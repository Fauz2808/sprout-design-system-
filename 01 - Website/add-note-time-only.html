<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Add Note — Time Only · Sprout</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0ede6; --surface:#fff; --field:#e8e4d9; --fg:#1a1a17; --ink:#1c2a1d; --muted:#807a6c; --border:#ddd9cf;
    --green:#5d8a63; --green-deep:#2d5c2e; --green-mid:#3d7a40; --green-soft:#e7efe6;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{background:#ddd8ce;font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:32px 24px;min-height:100vh;}
  .panel{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .caption{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a8478;text-align:center;}
  .caption strong{color:#3a3830;font-weight:600;}

  .device{position:relative;width:390px;height:844px;border-radius:56px;padding:12px;background:linear-gradient(160deg,#2a2a2c,#0e0e10);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 0 2px #000 inset,0 28px 60px -12px rgba(0,0,0,.45);}
  .device::before,.device::after{content:'';position:absolute;width:3px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.06) 8%,transparent 16%,transparent 84%,rgba(255,255,255,.04) 92%,transparent);top:100px;bottom:100px;}
  .device::before{left:-1px;}.device::after{right:-1px;}
  .island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:999px;z-index:5;}
  .br{position:absolute;width:4px;background:#0a0a0c;border-radius:2px;}
  .br.l1{left:-3px;top:174px;height:32px;}.br.l2{left:-3px;top:220px;height:60px;}.br.l3{left:-3px;top:290px;height:60px;}.br.r1{right:-3px;top:250px;height:100px;}

  .screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);}
  /* faint activity doodle texture, like the app */
  .screen::before{content:'';position:absolute;inset:0;opacity:.04;pointer-events:none;z-index:0;
    background-image:radial-gradient(circle at 20% 30%,#2d5c2e 1.5px,transparent 2px),radial-gradient(circle at 70% 60%,#2d5c2e 1.5px,transparent 2px),radial-gradient(circle at 45% 85%,#2d5c2e 1.5px,transparent 2px);
    background-size:90px 90px,120px 120px,70px 70px;}
  .sb{position:relative;z-index:2;flex:0 0 47px;padding:18px 26px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:15px;font-weight:600;color:var(--fg);}
  .sb .r{display:inline-flex;gap:6px;align-items:center;} .sb svg{width:17px;height:11px;fill:var(--fg);} .sb .bat{width:25px;}

  .top{position:relative;z-index:2;padding:6px 20px 10px;display:flex;align-items:center;}
  .top .bk{width:30px;height:30px;display:grid;place-items:center;cursor:pointer;} .top .bk svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;}
  .top .t{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);} .top .sp{width:30px;}

  .content{position:relative;z-index:1;flex:1;overflow-y:auto;padding:8px 20px 20px;}
  .content::-webkit-scrollbar{display:none;}
  .lbl{font-size:12.5px;color:var(--muted);margin:14px 4px 8px;font-weight:500;}

  .seldate{display:flex;align-items:center;gap:13px;background:var(--field);border-radius:16px;padding:15px 17px;}
  .seldate .ic{width:22px;text-align:center;font-size:18px;}
  .seldate .l{font-size:11px;color:var(--muted);} .seldate .v{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);margin-top:1px;}

  .input{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;font-size:15px;color:var(--ink);}
  .input.ph{color:#a8a496;}

  /* the TIME field (replaces the old calendar field) */
  .timefield{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 17px;cursor:pointer;transition:border-color .15s;}
  .timefield:active{border-color:var(--green-mid);}
  .timefield .ic{width:22px;text-align:center;font-size:17px;}
  .timefield .body{flex:1;}
  .timefield .l{font-size:11px;color:var(--muted);}
  .timefield .v{font-size:15.5px;font-weight:600;color:var(--ink);margin-top:2px;}
  .timefield .v .dash{color:var(--muted);font-weight:400;margin:0 7px;}
  .timefield .v.unset{color:#a8a496;font-weight:500;}
  .timefield .chev{margin-left:auto;} .timefield .chev svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;}
  .dur{font-size:12px;color:var(--green-mid);margin:10px 4px 0;font-weight:600;}

  /* save */
  .savebar{position:relative;z-index:2;padding:14px 20px calc(14px + env(safe-area-inset-bottom));}
  .save{width:100%;border:none;border-radius:18px;padding:17px;background:var(--green);color:#fff;font-size:16px;font-weight:700;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 12px 28px -12px rgba(45,92,46,.6);}
  .save svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.4;}

  /* ── TIME SHEET ── */
  .scrim{position:absolute;inset:0;z-index:8;background:rgba(20,24,18,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .28s ease;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-radius:28px 28px 44px 44px;padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .34s cubic-bezier(.22,1,.36,1);box-shadow:0 -16px 40px -16px rgba(0,0,0,.3);}
  .sheet.on{transform:translateY(0);}
  .grab{width:38px;height:5px;border-radius:999px;background:var(--border);margin:8px auto 6px;}
  .sheet h3{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);text-align:center;margin:4px 0 2px;}
  .sheet .tz{text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .sheet .tz b{color:var(--green-mid);font-weight:600;}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  .col h4{text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .wheel{position:relative;height:198px;overflow:hidden;border-radius:16px;background:var(--bg);}
  .band{position:absolute;left:8px;right:8px;top:50%;height:42px;transform:translateY(-50%);border-radius:11px;background:var(--green-soft);border:1px solid #cfe0cf;pointer-events:none;z-index:1;}
  .scroll{position:relative;z-index:2;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:78px 0;text-align:center;-ms-overflow-style:none;scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none;}
  .opt{height:42px;line-height:42px;scroll-snap-align:center;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;transition:color .15s,font-weight .15s;}
  .opt.sel{color:var(--green-deep);font-weight:700;font-size:17px;}
  .opt.disabled{opacity:.28;pointer-events:none;}

  .sheet .acts{display:flex;gap:11px;margin-top:16px;}
  .sheet .acts button{flex:1;border-radius:16px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);}
  .sheet .cancel{background:var(--green-soft);color:var(--green-deep);border:none;}
  .sheet .confirm{background:var(--green);color:#fff;border:none;box-shadow:0 10px 24px -12px rgba(45,92,46,.55);}
  .home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;background:var(--fg);border-radius:999px;opacity:.18;z-index:10;}
</style>
</head>
<body>
<div class="panel">
  <div class="caption"><strong>Add Note</strong> · time picker — calendar removed, start &amp; end time only</div>
  <div class="device">
    <span class="br l1"></span><span class="br l2"></span><span class="br l3"></span><span class="br r1"></span><span class="island"></span>
    <div class="screen">
      <div class="sb"><span>9:41</span><span class="r">
        <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg>
        <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1z"/></svg>
        <svg class="bat" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
      </span></div>

      <div class="top">
        <div class="bk"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
        <div class="t">Add Note</div><div class="sp"></div>
      </div>

      <div class="content">
        <div class="seldate">
          <div class="ic">📅</div>
          <div><div class="l">Selected date</div><div class="v">Tuesday, May 19</div></div>
        </div>

        <div class="lbl">Note</div>
        <div class="input ph">e.g. Bring towel & sunscreen for pool day</div>

        <div class="lbl">Time <span style="color:#bcb6a8">(optional)</span></div>
        <div class="timefield" onclick="openSheet()">
          <div class="ic">🕑</div>
          <div class="body">
            <div class="l">Start &amp; end time</div>
            <div class="v" id="timeVal"><span id="vStart">10:00 AM</span><span class="dash">–</span><span id="vEnd">11:00 AM</span></div>
          </div>
          <div class="chev"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
        </div>
        <div class="dur" id="durLine">1 hr</div>
      </div>

      <div class="savebar">
        <button class="save"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg> Save Note</button>
      </div>

      <!-- TIME SHEET -->
      <div class="scrim" id="scrim" onclick="closeSheet()"></div>
      <div class="sheet" id="sheet">
        <div class="grab"></div>
        <h3>Set time</h3>
        <div class="tz">Times shown in <b>CST</b></div>
        <div class="cols">
          <div class="col">
            <h4>Start</h4>
            <div class="wheel"><div class="band"></div><div class="scroll" id="startScroll"></div></div>
          </div>
          <div class="col">
            <h4>End</h4>
            <div class="wheel"><div class="band"></div><div class="scroll" id="endScroll"></div></div>
          </div>
        </div>
        <div class="acts">
          <button class="cancel" onclick="closeSheet()">Cancel</button>
          <button class="confirm" onclick="confirmTime()">Confirm</button>
        </div>
      </div>

      <div class="home"></div>
    </div>
  </div>
</div>

<script>
  // build half-hour times 7:00 AM → 9:00 PM
  const TIMES=[];
  for(let m=7*60; m<=21*60; m+=30){
    let h=Math.floor(m/60), mm=m%60, ap=h>=12?'PM':'AM', hh=h%12||12;
    TIMES.push((hh)+':'+(mm===0?'00':'30')+' '+ap);
  }
  let startIdx=6, endIdx=8; // 10:00 AM, 11:00 AM
  let pStart=startIdx, pEnd=endIdx; // pending while sheet open

  function render(){
    const s=document.getElementById('startScroll'), e=document.getElementById('endScroll');
    s.innerHTML=''; e.innerHTML='';
    TIMES.forEach((t,i)=>{
      const a=document.createElement('div'); a.className='opt'+(i===pStart?' sel':''); a.textContent=t;
      a.onclick=()=>{ pStart=i; if(pEnd<=pStart) pEnd=Math.min(i+1,TIMES.length-1); render(); center(); };
      s.appendChild(a);
      const b=document.createElement('div'); b.className='opt'+(i===pEnd?' sel':'')+(i<=pStart?' disabled':''); b.textContent=t;
      b.onclick=()=>{ pEnd=i; render(); center(); };
      e.appendChild(b);
    });
  }
  function center(){
    const s=document.getElementById('startScroll'), e=document.getElementById('endScroll');
    const selS=s.children[pStart], selE=e.children[pEnd];
    if(selS) s.scrollTo({top:selS.offsetTop-s.clientHeight/2+selS.clientHeight/2,behavior:'smooth'});
    if(selE) e.scrollTo({top:selE.offsetTop-e.clientHeight/2+selE.clientHeight/2,behavior:'smooth'});
  }
  function openSheet(){
    pStart=startIdx; pEnd=endIdx; render();
    document.getElementById('scrim').classList.add('on');
    document.getElementById('sheet').classList.add('on');
    setTimeout(center,80);
  }
  function closeSheet(){
    document.getElementById('scrim').classList.remove('on');
    document.getElementById('sheet').classList.remove('on');
  }
  function confirmTime(){
    startIdx=pStart; endIdx=pEnd;
    document.getElementById('vStart').textContent=TIMES[startIdx];
    document.getElementById('vEnd').textContent=TIMES[endIdx];
    document.getElementById('durLine').textContent=durText();
    closeSheet();
  }
  function durText(){
    const mins=(endIdx-startIdx)*30; const h=Math.floor(mins/60), m=mins%60;
    return (h?h+' hr':'')+(h&&m?' ':'')+(m?m+' min':'')||'—';
  }
  render(); document.getElementById('durLine').textContent=durText();
</script>
</body>
</html>
