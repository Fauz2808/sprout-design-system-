<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Upload — Loader Comparison · Sprout</title>
  <style>
    :root {
      --bg:      #faf8f4;
      --surface: #ffffff;
      --fg:      #1a1916;
      --muted:   #8a8780;
      --border:  #e8e5df;
      --accent:  #2D6A4F;
      --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
      --font-body:   -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:   ui-monospace, 'SF Mono', Menlo, monospace;
      --fs-body: 15px;
      --fs-meta: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: radial-gradient(70% 60% at 50% 0%,
        color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 65%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 48px;
      gap: 32px;
    }

    /* ── page heading ── */
    .page-title {
      text-align: center;
    }
    .page-title .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .page-title h1 {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--fg);
    }

    /* ── side-by-side container ── */
    .compare-row {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── single phone column ── */
    .phone-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .phone-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .phone-label .variant {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .phone-label .desc {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      max-width: 200px;
    }

    /* ── device frame ── */
    .device {
      position: relative;
      width: 360px;
      height: 780px;
      border-radius: 52px;
      padding: 11px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.30);
      isolation: isolate;
      flex-shrink: 0;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px; bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    /* Dynamic Island */
    .island {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      width: 116px; height: 34px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    /* hardware buttons */
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1  { left: -3px; top: 160px; height: 30px; }
    .btn-rail.left-2  { left: -3px; top: 204px; height: 56px; }
    .btn-rail.left-3  { left: -3px; top: 268px; height: 56px; }
    .btn-rail.right-1 { right: -3px; top: 230px; height: 92px; }

    /* screen surface */
    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 42px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* status bar */
    .statusbar {
      flex: 0 0 44px;
      padding: 16px 24px 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px; font-weight: 600;
      color: var(--fg); letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    /* nav bar */
    .nav-bar {
      flex: 0 0 auto;
      padding: 8px 20px 0;
      display: flex;
      align-items: center;
    }
    .close-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .close-btn svg { width: 15px; height: 15px; stroke: var(--fg); fill: none; stroke-width: 2; }

    /* photo area */
    .photo-wrap {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      margin-top: 6px;
    }
    .photo-placeholder {
      width: 100%; height: 100%;
      background: linear-gradient(180deg,
        #c8dce8 0%,   /* sky blue */
        #b8ccd8 18%,
        #e8d4c0 38%,  /* skin */
        #d4b898 54%,
        #8a6c5a 70%,  /* torso */
        #4a3428 100%
      );
      position: relative;
    }
    /* frosted scrim — slightly more opaque on spinner version for focus */
    .photo-scrim {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(1px);
    }
    .crop-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .crop-grid line { stroke: rgba(255,255,255,0.5); stroke-width: 0.7; }

    /* action bar — shared */
    .action-bar {
      flex: 0 0 auto;
      padding: 12px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
    }

    /* retry button — shared */
    .retry-btn {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: opacity 0.3s;
    }
    .retry-btn svg {
      width: 19px; height: 19px;
      stroke: var(--muted); fill: none;
      stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .retry-btn.disabled { opacity: 0.35; pointer-events: none; }

    /* home indicator */
    .home-indicator { flex: 0 0 26px; position: relative; }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 7px;
      transform: translateX(-50%);
      width: 120px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }


    /* ════════════════════════════════════════════════
       VARIANT A — Linear progress bar (pill button)
    ════════════════════════════════════════════════ */
    .upload-bar {
      flex: 1;
      height: 50px;
      border-radius: 999px;
      background: var(--accent);
      border: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 18px;
    }
    .upload-bar__track {
      position: absolute;
      inset: 0;
      background: color-mix(in oklch, #000 22%, var(--accent));
      border-radius: inherit;
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }
    .upload-bar__label {
      position: relative; z-index: 1;
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
    }
    .upload-bar__text {
      font-size: 15px; font-weight: 600; color: #fff;
      letter-spacing: -0.005em;
    }
    .upload-bar__pct {
      font-family: var(--font-mono);
      font-size: 14px; font-weight: 600;
      color: rgba(255,255,255,0.9);
    }
    .upload-bar__pill {
      position: absolute;
      bottom: 7px; left: 18px; right: 18px;
      height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      overflow: hidden;
    }
    .upload-bar__pill-fill {
      height: 100%; background: rgba(255,255,255,0.9);
      border-radius: 999px; width: 0%;
      transition: width 0.4s ease;
    }


    /* ════════════════════════════════════════════════
       VARIANT B — Ring spinner with percentage
    ════════════════════════════════════════════════ */
    .upload-ring-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* The ring itself */
    .ring-container {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }
    .ring-container svg {
      width: 72px; height: 72px;
      transform: rotate(-90deg); /* start arc at top */
    }
    /* track (background ring) */
    .ring-track {
      fill: none;
      stroke: var(--border);
      stroke-width: 5;
    }
    /* progress ring */
    .ring-fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 5;
      stroke-linecap: round;
      /* circumference of r=31: 2π×31 ≈ 194.78 */
      stroke-dasharray: 194.78;
      stroke-dashoffset: 194.78; /* 0% initially */
      transition: stroke-dashoffset 0.4s ease;
    }
    /* done state: solid fill tick ring */
    .ring-fill.done {
      stroke-dashoffset: 0;
      stroke: var(--accent);
      transition: stroke-dashoffset 0.3s ease;
    }

    /* percentage number in center */
    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .ring-pct {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .ring-pct.done-check {
      font-size: 20px;
      color: var(--accent);
    }
    .ring-sublabel {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 1px;
    }

    /* text beside the ring */
    .ring-text-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .ring-status {
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .ring-hint {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font-mono);
    }


    /* ── shared demo controls ── */
    .demo-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .demo-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .demo-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <!-- Page heading -->
  <div class="page-title">
    <p class="eyebrow">Sprout · Design Exploration</p>
    <h1>Photo Upload — Progress Loader Options</h1>
  </div>

  <!-- Side-by-side phones -->
  <div class="compare-row">

    <!-- ═══════════ PHONE A — Linear Bar ═══════════ -->
    <div class="phone-col">
      <div class="phone-label">
        <span class="variant">Option A</span>
        <span class="desc">Horizontal progress bar inside pill button</span>
      </div>

      <div class="device">
        <span class="btn-rail left-1"  aria-hidden></span>
        <span class="btn-rail left-2"  aria-hidden></span>
        <span class="btn-rail left-3"  aria-hidden></span>
        <span class="btn-rail right-1" aria-hidden></span>
        <span class="island"           aria-hidden></span>

        <div class="screen">
          <div class="statusbar">
            <span class="num">3:10</span>
            <span class="right">
              <svg viewBox="0 0 17 11" aria-hidden>
                <rect x="0" y="7" width="3" height="4" rx="0.6"/>
                <rect x="4" y="5" width="3" height="6" rx="0.6"/>
                <rect x="8" y="3" width="3" height="8" rx="0.6"/>
                <rect x="12" y="0" width="3" height="11" rx="0.6"/>
              </svg>
              <svg viewBox="0 0 17 11" aria-hidden>
                <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
              </svg>
              <svg class="battery" viewBox="0 0 25 11" aria-hidden>
                <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
                <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
                <rect x="2" y="2" width="18" height="7" rx="1.4"/>
              </svg>
            </span>
          </div>

          <div class="nav-bar">
            <button class="close-btn" aria-label="Go back">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
          </div>

          <div class="photo-wrap">
            <div class="photo-placeholder">
              <svg class="crop-grid" viewBox="0 0 338 500" preserveAspectRatio="none">
                <line x1="112.7" y1="0" x2="112.7" y2="500"/>
                <line x1="225.3" y1="0" x2="225.3" y2="500"/>
                <line x1="0" y1="166.7" x2="338" y2="166.7"/>
                <line x1="0" y1="333.3" x2="338" y2="333.3"/>
              </svg>
            </div>
          </div>

          <div class="action-bar">
            <button class="retry-btn disabled" id="retryA" aria-label="Choose different photo">
              <svg viewBox="0 0 24 24">
                <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
              </svg>
            </button>

            <button class="upload-bar" id="uploadBarBtn" aria-label="Uploading">
              <div class="upload-bar__track" id="barTrack"></div>
              <div class="upload-bar__label">
                <span class="upload-bar__text" id="barText">Uploading…</span>
                <span class="upload-bar__pct num" id="barPct">0%</span>
              </div>
              <div class="upload-bar__pill">
                <div class="upload-bar__pill-fill" id="barPillFill"></div>
              </div>
            </button>
          </div>

          <div class="home-indicator" aria-hidden></div>
        </div>
      </div>
    </div><!-- /phone-col A -->


    <!-- ═══════════ PHONE B — Ring Spinner ═══════════ -->
    <div class="phone-col">
      <div class="phone-label">
        <span class="variant">Option B</span>
        <span class="desc">Circular ring spinner with live percentage</span>
      </div>

      <div class="device">
        <span class="btn-rail left-1"  aria-hidden></span>
        <span class="btn-rail left-2"  aria-hidden></span>
        <span class="btn-rail left-3"  aria-hidden></span>
        <span class="btn-rail right-1" aria-hidden></span>
        <span class="island"           aria-hidden></span>

        <div class="screen">
          <div class="statusbar">
            <span class="num">3:10</span>
            <span class="right">
              <svg viewBox="0 0 17 11" aria-hidden>
                <rect x="0" y="7" width="3" height="4" rx="0.6"/>
                <rect x="4" y="5" width="3" height="6" rx="0.6"/>
                <rect x="8" y="3" width="3" height="8" rx="0.6"/>
                <rect x="12" y="0" width="3" height="11" rx="0.6"/>
              </svg>
              <svg viewBox="0 0 17 11" aria-hidden>
                <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
              </svg>
              <svg class="battery" viewBox="0 0 25 11" aria-hidden>
                <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
                <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
                <rect x="2" y="2" width="18" height="7" rx="1.4"/>
              </svg>
            </span>
          </div>

          <div class="nav-bar">
            <button class="close-btn" aria-label="Go back">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
          </div>

          <div class="photo-wrap">
            <div class="photo-placeholder">
              <!-- scrim to focus attention on action bar -->
              <div class="photo-scrim" id="scrimB"></div>
              <svg class="crop-grid" viewBox="0 0 338 500" preserveAspectRatio="none">
                <line x1="112.7" y1="0" x2="112.7" y2="500"/>
                <line x1="225.3" y1="0" x2="225.3" y2="500"/>
                <line x1="0" y1="166.7" x2="338" y2="166.7"/>
                <line x1="0" y1="333.3" x2="338" y2="333.3"/>
              </svg>
            </div>
          </div>

          <div class="action-bar" style="padding: 16px 20px 18px;">
            <button class="retry-btn disabled" id="retryB" aria-label="Choose different photo">
              <svg viewBox="0 0 24 24">
                <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
              </svg>
            </button>

            <!-- Ring spinner + text -->
            <div class="upload-ring-wrap">

              <!-- The ring -->
              <div class="ring-container">
                <svg viewBox="0 0 72 72" aria-hidden>
                  <!-- track -->
                  <circle class="ring-track" cx="36" cy="36" r="31"/>
                  <!-- fill (animated) -->
                  <circle class="ring-fill" id="ringFill" cx="36" cy="36" r="31"/>
                </svg>
                <!-- centered number -->
                <div class="ring-center">
                  <span class="ring-pct num" id="ringPct">0%</span>
                  <span class="ring-sublabel" id="ringLabel">uploading</span>
                </div>
              </div>

              <!-- Status text beside ring -->
              <div class="ring-text-block">
                <span class="ring-status" id="ringStatus">Uploading photo…</span>
                <span class="ring-hint" id="ringHint">Please don't close the app</span>
              </div>

            </div>
          </div>

          <div class="home-indicator" aria-hidden></div>
        </div>
      </div>
    </div><!-- /phone-col B -->

  </div><!-- /compare-row -->

  <!-- Shared demo controls -->
  <div class="demo-controls">
    <button class="demo-btn" onclick="restartBoth()">↺ Replay both</button>
    <button class="demo-btn" onclick="jumpBoth()">⚡ Jump to done</button>
  </div>


  <script>
    /* ── shared progress steps (same timing for both) ── */
    const STEPS = [
      { v: 12,  d: 250 },
      { v: 27,  d: 200 },
      { v: 43,  d: 180 },
      { v: 58,  d: 210 },
      { v: 71,  d: 170 },
      { v: 82,  d: 240 },
      { v: 90,  d: 300 },
      { v: 96,  d: 380 },
      { v: 100, d: 480 },
    ];

    /* ring circumference for r=31 */
    const CIRC = 2 * Math.PI * 31; // ≈ 194.78

    /* ── element refs ── */
    const barTrack   = document.getElementById('barTrack');
    const barPillFill= document.getElementById('barPillFill');
    const barPct     = document.getElementById('barPct');
    const barText    = document.getElementById('barText');
    const retryA     = document.getElementById('retryA');
    const uploadBarBtn = document.getElementById('uploadBarBtn');

    const ringFill   = document.getElementById('ringFill');
    const ringPct    = document.getElementById('ringPct');
    const ringLabel  = document.getElementById('ringLabel');
    const ringStatus = document.getElementById('ringStatus');
    const ringHint   = document.getElementById('ringHint');
    const retryB     = document.getElementById('retryB');

    let timer = null;

    /* ── set progress for BOTH screens simultaneously ── */
    function setProgress(pct) {
      pct = Math.min(100, Math.max(0, pct));
      const done = pct >= 100;

      /* — OPTION A: bar — */
      barTrack.style.transform  = `scaleX(${pct / 100})`;
      barPillFill.style.width   = pct + '%';
      barPct.textContent        = done ? '' : pct + '%';
      barText.textContent       = done ? 'Posted  ✓' : 'Uploading…';
      if (done) {
        uploadBarBtn.style.background = 'var(--accent)';
        retryA.classList.remove('disabled');
      } else {
        retryA.classList.add('disabled');
      }

      /* — OPTION B: ring — */
      const offset = CIRC * (1 - pct / 100);
      ringFill.style.strokeDashoffset = offset;

      if (done) {
        ringPct.textContent     = '✓';
        ringPct.className       = 'ring-pct done-check num';
        ringLabel.textContent   = '';
        ringStatus.textContent  = 'Photo posted!';
        ringHint.textContent    = 'Tap to view your memory';
        retryB.classList.remove('disabled');
      } else {
        ringPct.textContent     = pct + '%';
        ringPct.className       = 'ring-pct num';
        ringLabel.textContent   = 'uploading';
        ringStatus.textContent  = 'Uploading photo…';
        ringHint.textContent    = 'Please don\'t close the app';
        retryB.classList.add('disabled');
      }
    }

    function restartBoth() {
      clearTimeout(timer);
      setProgress(0);

      let i = 0;
      function tick() {
        if (i >= STEPS.length) return;
        const s = STEPS[i++];
        setProgress(s.v);
        if (i < STEPS.length) timer = setTimeout(tick, s.d);
      }
      timer = setTimeout(tick, 350);
    }

    function jumpBoth() {
      clearTimeout(timer);
      setProgress(100);
    }

    /* autoplay on load */
    window.addEventListener('load', () => setTimeout(restartBoth, 700));
  </script>
</body>
</html>
