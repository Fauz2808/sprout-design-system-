<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Birthday Flow A — Voice · Sprout</title>
<style>
  :root{
    --bg:#f0ede6; --surface:#fff; --field:#e8e4d9; --fg:#1a1a17; --muted:#7a7568; --border:#ddd9cf;
    --green:#2d5c2e; --green-mid:#3d7a40; --green-soft:#e8f0e8;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; --serif:'Georgia',serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{background:#ddd8ce;font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;gap:40px;padding:32px 24px;min-height:100vh;flex-wrap:wrap;}
  .panel{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .caption{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a8478;text-align:center;max-width:330px;}
  .caption strong{color:#3a3830;font-weight:600;}

  .device{position:relative;width:390px;height:844px;border-radius:56px;padding:12px;background:linear-gradient(160deg,#2a2a2c,#0e0e10);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 0 2px #000 inset,0 28px 60px -12px rgba(0,0,0,.45);}
  .device::before,.device::after{content:'';position:absolute;width:3px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.06) 8%,transparent 16%,transparent 84%,rgba(255,255,255,.04) 92%,transparent);top:100px;bottom:100px;}
  .device::before{left:-1px;}.device::after{right:-1px;}
  .island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:999px;z-index:5;}
  .br{position:absolute;width:4px;background:#0a0a0c;border-radius:2px;}
  .br.l1{left:-3px;top:174px;height:32px;}.br.l2{left:-3px;top:220px;height:60px;}.br.l3{left:-3px;top:290px;height:60px;}.br.r1{right:-3px;top:250px;height:100px;}

  .screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(120% 70% at 50% 12%, #eaf2ea 0%, #f0ede6 55%);}
  .sb{flex:0 0 47px;padding:18px 26px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:15px;font-weight:600;color:var(--fg);}
  .sb .r{display:inline-flex;gap:6px;align-items:center;} .sb svg{width:17px;height:11px;fill:var(--fg);} .sb .bat{width:25px;}

  .top{padding:8px 16px 4px;display:flex;align-items:center;gap:10px;}
  .ibtn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;} .ibtn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:2;}
  .top .t{flex:1;text-align:center;font-weight:700;font-size:15px;} .top .sp{width:34px;}

  .stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 26px 0;text-align:center;overflow-y:auto;}
  .stage::-webkit-scrollbar{display:none;}
  .status{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green-mid);margin-bottom:22px;display:flex;align-items:center;gap:6px;}
  .status .d{width:6px;height:6px;border-radius:50%;background:var(--green-mid);}

  /* orb */
  .orb{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#6bbf70,#2d5c2e);position:relative;display:grid;place-items:center;flex-shrink:0;box-shadow:0 16px 40px -10px rgba(45,92,46,.5);}
  .orb svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:1.8;opacity:.95;}
  .orb::before,.orb::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(45,92,46,.35);}
  .orb.speaking::before{animation:ring 1.8s ease-out infinite;}
  .orb.listening::before{animation:ring 1.1s ease-out infinite;} .orb.listening::after{animation:ring 1.1s ease-out .4s infinite;}
  .orb.thinking{animation:bob 1s ease-in-out infinite;}
  @keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .ailine{font-family:var(--serif);font-size:22px;line-height:1.3;color:var(--fg);margin:26px 0 0;max-width:300px;}
  .ailine b{color:var(--green);}
  .kidcard{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:11px 14px;margin-top:18px;}
  .kidcard .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#8fba92,#5a8f5d);display:grid;place-items:center;font-size:20px;color:#fff;}
  .kidcard .nm{font-weight:700;font-size:14.5px;text-align:left;} .kidcard .sub{font-size:12px;color:var(--muted);text-align:left;}
  .said{margin-top:18px;font-size:13.5px;color:var(--muted);} .said b{color:var(--fg);font-weight:600;}

  /* cover options */
  .covopts{display:flex;gap:10px;margin-top:22px;}
  .cov{flex:1;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;box-shadow:0 6px 16px -6px rgba(0,0,0,.25);}
  .cov.on{border-color:var(--green);}
  .cov .art{aspect-ratio:393/381;position:relative;display:flex;align-items:center;justify-content:center;}
  .cov .cn{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:var(--serif);font-weight:700;font-size:9px;}
  .cov .cnum{font-family:var(--serif);font-weight:800;font-size:40px;margin-left:18px;}
  .cov .ph{position:absolute;right:13%;bottom:11%;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);display:grid;place-items:center;font-size:12px;}

  /* after-created screen */
  .done-check{font-size:50px;margin:4px 0;}
  .done-h{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--fg);}
  .done-sub{font-size:13px;color:var(--muted);margin:4px 0 18px;}
  .done-cover{width:148px;aspect-ratio:393/381;border-radius:16px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.3);margin-bottom:18px;}
  .done-cover .dc-name{position:absolute;left:11px;top:40%;transform:translateY(-50%);font-family:var(--serif);font-weight:700;font-size:13px;}
  .done-cover .dc-num{font-family:var(--serif);font-weight:800;font-size:66px;margin-left:24px;}
  .done-cover .dc-ph{position:absolute;right:15%;bottom:13%;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);display:grid;place-items:center;font-size:15px;}
  .done-cover .dc-rule{position:absolute;left:11px;top:53%;width:34px;height:1px;background:currentColor;opacity:.4;}
  .done-cover .dc-ch{position:absolute;left:11px;top:57%;font-size:7px;font-weight:700;letter-spacing:.18em;}
  .done-card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2px 14px;}
  .dcard-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px;color:var(--fg);text-align:left;}
  .dcard-row:first-child{border-top:none;} .dcard-row svg{width:16px;height:16px;stroke:var(--green-mid);fill:none;stroke-width:1.8;flex-shrink:0;} .dcard-row b{font-weight:700;}
  .done-actions{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:14px;}
  .done-act{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1px solid var(--border);border-radius:13px;background:var(--surface);font-family:var(--font);font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;}
  .done-act svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:2;}

  /* dock */
  .dock{flex:0 0 auto;padding:14px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .micbtn{width:74px;height:74px;border-radius:50%;background:var(--green);border:none;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px -8px rgba(45,92,46,.6);transition:transform .12s;}
  .micbtn:active{transform:scale(.95);} .micbtn.live{animation:livepulse 1s ease-in-out infinite;}
  @keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(45,92,46,.4)}50%{box-shadow:0 0 0 14px rgba(45,92,46,0)}}
  .micbtn svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;}
  .miclabel{font-size:12.5px;color:var(--muted);}
  .dockbtn{width:100%;padding:15px;border:none;border-radius:14px;background:var(--green);color:#fff;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;}
  .typehint{font-size:11.5px;color:#a8a294;}
  .home{flex:0 0 22px;position:relative;} .home::after{content:'';position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:128px;height:5px;background:var(--fg);border-radius:999px;opacity:.2;}
</style>
</head>
<body>
<div class="panel">
  <div class="caption"><strong>Flow A · Voice</strong> · talk to Sprout AI, it talks back — hands-free</div>
  <div class="device">
    <span class="br l1"></span><span class="br l2"></span><span class="br l3"></span><span class="br r1"></span><span class="island"></span>
    <div class="screen">
      <div class="sb"><span>9:41</span><span class="r">
        <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg>
        <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1z"/></svg>
        <svg class="bat" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
      </span></div>
      <div class="top"><div class="ibtn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div><div class="t">Sprout AI</div><div class="sp"></div></div>

      <div class="stage">
        <div class="status" id="status"><span class="d"></span><span id="statusTxt">Speaking</span></div>
        <div class="orb speaking" id="orb"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
        <div class="ailine" id="ailine"></div>
        <div id="extra"></div>
        <div class="said" id="said"></div>
      </div>

      <div class="dock" id="dock"></div>
      <div class="home"></div>
    </div>
  </div>
</div>

<script>
  const $=id=>document.getElementById(id);
  const KID={name:'Alex', age:5};
  const TURNS=[
    {ai:"Hey James — <b>Alex turns 5 in 3 days.</b> Want to set up his party?", kid:true, you:"Yes, let's set it up"},
    {ai:"Love it. <b>When and where</b> is the party?", you:"Next Friday at 2 PM, at Zilker Park"},
    {ai:"Got it — <b>Fri, Jun 20 · 2 PM · Zilker Park.</b> I don't have a photo of Alex — want to add one for the cover?", you:"Yeah, I'll add one"},
    {ai:"Perfect. <b>What's Alex into</b> these days?", you:"He's obsessed with dinosaurs and space 🦕🚀"},
    {ai:"Amazing — give me a sec, designing a few covers for Alex…", covers:true}
  ];
  let i=0;

  function setStatus(s){ $('statusTxt').textContent=s; }
  function setOrb(state){ $('orb').className='orb '+state; }

  function playTurn(){
    const t=TURNS[i];
    $('said').innerHTML='';
    $('extra').innerHTML = t.kid ? `<div class="kidcard"><div class="av">🧒</div><div><div class="nm">${KID.name}</div><div class="sub">Your son · turning ${KID.age} · in 3 days</div></div></div>` : '';
    setStatus('Speaking'); setOrb('speaking'); $('ailine').innerHTML=t.ai;
    if(t.covers){
      $('dock').innerHTML='';
      setTimeout(showCovers, 1400);
      return;
    }
    // after speaking, hand to user
    setTimeout(()=>{ setStatus('Tap to reply'); setOrb('idle');
      $('dock').innerHTML=`<button class="micbtn" onclick="listen()"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><div class="miclabel">Hold to talk — or tap to reply</div>`;
    }, 1300);
  }
  function listen(){
    const t=TURNS[i];
    setStatus('Listening'); setOrb('listening');
    $('dock').innerHTML=`<button class="micbtn live"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><div class="miclabel">Listening…</div>`;
    setTimeout(()=>{ $('said').innerHTML=`<b>You:</b> "${t.you}"`; setStatus('Thinking'); setOrb('thinking'); $('dock').innerHTML='';
      setTimeout(()=>{ i++; playTurn(); }, 900);
    }, 1200);
  }

  const COVS=[{bg:'#e7dcc6',ink:'#5b4326'},{bg:'#e2e6e6',ink:'#3f5a66'},{bg:'#efe2dc',ink:'#7a4f4a'}];
  let chosen=COVS[0];
  function showCovers(){
    setStatus('Pick a favourite'); setOrb('idle');
    $('ailine').innerHTML="Here are three for <b>Alex</b> — which do you love?";
    $('extra').innerHTML=`<div class="covopts">${COVS.map((c,idx)=>`<div class="cov" onclick="chooseCover(this,${idx})"><div class="art" style="background:${c.bg};color:${c.ink};"><span class="cn">Alex</span><span class="cnum">5</span><span class="ph">🧒</span></div></div>`).join('')}</div>`;
    $('dock').innerHTML=`<div class="miclabel">Tap one, or say "the first one" 🎤</div><button class="micbtn" style="width:56px;height:56px;" onclick="regen()"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg></button><div class="miclabel">Regenerate</div>`;
  }
  function regen(){ setOrb('thinking'); setStatus('Designing'); setTimeout(showCovers, 1000); }
  function chooseCover(el,idx){
    document.querySelectorAll('.cov').forEach(c=>c.classList.remove('on')); el.classList.add('on'); chosen=COVS[idx];
    $('said').innerHTML=`<b>You:</b> "That one!"`; setStatus('Done'); setOrb('idle');
    $('ailine').innerHTML="🎂 <b>Alex's 5th birthday</b> is ready — want me to send the invites?";
    $('dock').innerHTML=`<button class="dockbtn" onclick="createdScreen()">Create event &amp; send invites</button>`;
  }

  // ── after the event is created ──
  function createdScreen(){
    document.querySelector('.top .t').textContent='Event created';
    const stage=document.querySelector('.stage');
    stage.innerHTML=`
      <div class="done-check">🎉</div>
      <div class="done-h">Alex's party is live!</div>
      <div class="done-sub">Invites just went out to your saved families.</div>
      <div class="done-cover" style="background:${chosen.bg};color:${chosen.ink};">
        <span class="dc-name">Alex</span><span class="dc-num">5</span><span class="dc-ph">🧒</span>
        <span class="dc-rule"></span><span class="dc-ch">CHAPTER 5</span>
      </div>
      <div class="done-card">
        <div class="dcard-row"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Fri, Jun 20 · 2:00 PM</span></div>
        <div class="dcard-row"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg><span>Zilker Park, Austin TX</span></div>
        <div class="dcard-row"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span><b>12 families</b> invited · 0 replied yet</span></div>
      </div>
      <div class="done-actions">
        <button class="done-act"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v14"/></svg>Share invite link</button>
        <button class="done-act"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Add to my calendar</button>
      </div>`;
    $('dock').innerHTML=`<button class="dockbtn" onclick="alert('Opening the event page…')">View event</button>`;
  }

  playTurn();
</script>
</body>
</html>
