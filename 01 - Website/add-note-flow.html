<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Add Note — Flow · Sprout</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0ede6; --surface:#fff; --field:#e8e4d9; --fg:#1a1a17; --ink:#1c2a1d; --muted:#807a6c; --border:#ddd9cf;
    --green:#2d5c2e; --green-mid:#3d7a40; --green-soft:#e7efe6;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --acc:#2d5c2e; --acc-bg:#e7efe6;
  }
  *,*::before,*::after{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{background:#ddd8ce;font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:32px 24px;min-height:100vh;}
  .panel{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .caption{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a8478;text-align:center;} .caption strong{color:#3a3830;font-weight:600;}

  .device{position:relative;width:390px;height:844px;border-radius:56px;padding:12px;background:linear-gradient(160deg,#2a2a2c,#0e0e10);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 0 2px #000 inset,0 28px 60px -12px rgba(0,0,0,.45);}
  .device::before,.device::after{content:'';position:absolute;width:3px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.06) 8%,transparent 16%,transparent 84%,rgba(255,255,255,.04) 92%,transparent);top:100px;bottom:100px;}
  .device::before{left:-1px;}.device::after{right:-1px;}
  .island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:999px;z-index:5;}
  .br{position:absolute;width:4px;background:#0a0a0c;border-radius:2px;}
  .br.l1{left:-3px;top:174px;height:32px;}.br.l2{left:-3px;top:220px;height:60px;}.br.l3{left:-3px;top:290px;height:60px;}.br.r1{right:-3px;top:250px;height:100px;}

  .screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);}
  .screen::before{content:'';position:absolute;inset:0;opacity:.04;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 20% 30%,#2d5c2e 1.5px,transparent 2px),radial-gradient(circle at 70% 60%,#2d5c2e 1.5px,transparent 2px),radial-gradient(circle at 45% 85%,#2d5c2e 1.5px,transparent 2px);background-size:90px 90px,120px 120px,70px 70px;}
  .sb{position:relative;z-index:2;flex:0 0 47px;padding:18px 26px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:15px;font-weight:600;color:var(--fg);}
  .sb .r{display:inline-flex;gap:6px;align-items:center;} .sb svg{width:17px;height:11px;fill:var(--fg);} .sb .bat{width:25px;}

  .top{position:relative;z-index:2;padding:6px 20px 8px;display:flex;align-items:center;}
  .top .bk{width:30px;height:30px;display:grid;place-items:center;cursor:pointer;} .top .bk svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;}
  .top .t{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);} .top .sp{width:30px;}

  .content{position:relative;z-index:1;flex:1;overflow-y:auto;padding:6px 20px 16px;} .content::-webkit-scrollbar{display:none;}
  .lbl{font-size:12px;color:var(--muted);margin:15px 4px 8px;font-weight:600;} .lbl span{font-weight:400;color:#bcb6a8;}

  .seldate{display:flex;align-items:center;gap:13px;background:var(--field);border-radius:16px;padding:13px 16px;}
  .seldate .ic{font-size:17px;} .seldate .l{font-size:11px;color:var(--muted);} .seldate .v{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin-top:1px;}

  /* note-type chips */
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--field);border-radius:14px;padding:5px;}
  .chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:10px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .12s,color .12s;}
  .chip .e{font-size:16px;}
  .chip.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.1);}

  /* fields */
  .notefield{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 15px;font-size:15px;color:var(--ink);font-family:var(--font);resize:none;outline:none;line-height:1.4;transition:border-color .15s;}
  .notefield::placeholder{color:#a8a496;} .notefield:focus{border-color:var(--acc);}

  .fieldrow{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .15s;}
  .fieldrow:active{border-color:var(--acc);}
  .fieldrow .ic{font-size:16px;width:20px;text-align:center;}
  .fieldrow .body{flex:1;min-width:0;}
  .fieldrow .l{font-size:11px;color:var(--muted);} .fieldrow .v{font-size:15px;font-weight:600;color:var(--ink);margin-top:2px;} .fieldrow .v .dash{color:var(--muted);font-weight:400;margin:0 7px;} .fieldrow .v.unset{color:#a8a496;font-weight:500;}
  .fieldrow .chev svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;}
  .fieldrow .linkin{flex:1;border:none;background:transparent;outline:none;font-size:14.5px;color:var(--ink);font-family:var(--font);} .fieldrow .linkin::placeholder{color:#a8a496;}
  .dur{font-size:12px;color:var(--acc);margin:9px 4px 0;font-weight:600;}
  .alldaytag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-bg);border-radius:999px;padding:7px 13px;}

  /* assign (to-do) */
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;background:var(--field);padding:5px;border-radius:13px;}
  .seg .s{padding:10px 2px;border-radius:9px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;} .seg .s .i{font-size:14px;}
  .seg .s.on{background:var(--surface);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.1);}
  .choose{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1.5px solid var(--acc);border-radius:14px;background:var(--acc-bg);margin-top:11px;cursor:pointer;}
  .choose .ic{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:16px;flex-shrink:0;}
  .choose .ct .a{font-size:13.5px;font-weight:700;color:var(--acc);} .choose .ct .b{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .choose .cx{margin-left:auto;color:var(--acc);} .choose .cx svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;}
  .hint{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);line-height:1.45;padding:11px 2px 0;}
  .hint svg{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:2;flex-shrink:0;margin-top:1px;}

  .savebar{position:relative;z-index:2;padding:12px 20px calc(14px + env(safe-area-inset-bottom));}
  .save{width:100%;border:none;border-radius:18px;padding:16px;background:var(--green);color:#fff;font-size:16px;font-weight:700;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 12px 28px -12px rgba(45,92,46,.6);}
  .save:disabled{opacity:.4;box-shadow:none;} .save svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.4;}

  /* sheets */
  .scrim{position:absolute;inset:0;z-index:8;background:rgba(20,24,18,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .28s ease;} .scrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-radius:28px 28px 44px 44px;padding:8px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(112%);transition:transform .34s cubic-bezier(.22,1,.36,1);box-shadow:0 -16px 40px -16px rgba(0,0,0,.3);max-height:78%;display:flex;flex-direction:column;} .sheet.on{transform:translateY(0);}
  .grab{width:38px;height:5px;border-radius:999px;background:var(--border);margin:8px auto 6px;flex-shrink:0;}
  .sheet h3{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);text-align:center;margin:4px 0 2px;}
  .sheet .tz{text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px;} .sheet .tz b{color:var(--green-mid);font-weight:600;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  .col h4{text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .wheel{position:relative;height:198px;overflow:hidden;border-radius:16px;background:var(--bg);}
  .band{position:absolute;left:8px;right:8px;top:50%;height:42px;transform:translateY(-50%);border-radius:11px;background:var(--green-soft);border:1px solid #cfe0cf;pointer-events:none;z-index:1;}
  .twscroll{position:relative;z-index:2;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:78px 0;text-align:center;scrollbar-width:none;} .twscroll::-webkit-scrollbar{display:none;}
  .opt{height:42px;line-height:42px;scroll-snap-align:center;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;transition:color .15s,font-weight .15s;}
  .opt.sel{color:var(--green);font-weight:700;font-size:17px;} .opt.disabled{opacity:.28;pointer-events:none;}
  .sheet .acts{display:flex;gap:11px;margin-top:16px;flex-shrink:0;}
  .sheet .acts button{flex:1;border-radius:16px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);border:none;}
  .sheet .cancel{background:var(--green-soft);color:var(--green);} .sheet .confirm{background:var(--green);color:#fff;box-shadow:0 10px 24px -12px rgba(45,92,46,.55);}

  /* people picker */
  .sh-h{flex-shrink:0;padding:0 0 9px;border-bottom:1px solid var(--border);}
  .sh-h .t{font-size:16px;font-weight:700;text-align:center;color:var(--ink);} .sh-h .s{font-size:11px;color:var(--muted);text-align:center;margin-top:1px;}
  .srch{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:11px;padding:9px 12px;margin-top:10px;} .srch svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;} .srch .ph{font-size:13px;color:#a8a496;}
  .quick{display:flex;gap:8px;padding:10px 0 2px;flex-shrink:0;} .quick b{font-size:11.5px;font-weight:600;color:#3b6ea5;background:#e1ecf7;border-radius:99px;padding:6px 12px;cursor:pointer;}
  .plist{flex:1;overflow-y:auto;} .plist::-webkit-scrollbar{display:none;}
  .pr{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--border);cursor:pointer;} .pr:first-child{border-top:none;}
  .pav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8fba92,#5a8f5d);display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;}
  .pr .pn{flex:1;font-size:13.5px;font-weight:600;color:var(--ink);} .pr .pq{font-size:11px;color:var(--muted);}
  .pc{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:grid;place-items:center;} .pc svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;opacity:0;}
  .pr.on .pc{background:#3b6ea5;border-color:#3b6ea5;} .pr.on .pc svg{opacity:1;}
  .peoplebtn{flex-shrink:0;margin-top:10px;background:#3b6ea5;color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;}

  .home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;background:var(--fg);border-radius:999px;opacity:.18;z-index:12;}
  .toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:13;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);text-align:center;} .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="panel">
  <div class="caption"><strong>Add Note</strong> · full flow — 4 note types · time wheel · to-do assign &amp; people picker</div>
  <div class="device">
    <span class="br l1"></span><span class="br l2"></span><span class="br l3"></span><span class="br r1"></span><span class="island"></span>
    <div class="screen">
      <div class="sb"><span>9:41</span><span class="r">
        <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg>
        <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1z"/></svg>
        <svg class="bat" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4" fill="currentColor" fill-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
      </span></div>

      <div class="top"><div class="bk"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div><div class="t">Add Note</div><div class="sp"></div></div>

      <div class="content">
        <div class="seldate"><div class="ic">📅</div><div><div class="l">Selected date</div><div class="v">Thursday, June 12</div></div></div>
        <div class="lbl">Note type</div>
        <div class="chips" id="chips"></div>
        <div id="form"></div>
      </div>

      <div class="savebar"><button class="save" id="saveBtn" onclick="doSave()"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg> <span id="saveLbl">Save Note</span></button></div>

      <!-- TIME SHEET -->
      <div class="scrim" id="tScrim" onclick="closeTime()"></div>
      <div class="sheet" id="tSheet">
        <div class="grab"></div>
        <h3>Set time</h3>
        <div class="tz">Times shown in <b>CST</b></div>
        <div class="cols">
          <div class="col"><h4>Start</h4><div class="wheel"><div class="band"></div><div class="twscroll" id="startScroll"></div></div></div>
          <div class="col"><h4>End</h4><div class="wheel"><div class="band"></div><div class="twscroll" id="endScroll"></div></div></div>
        </div>
        <div class="acts"><button class="cancel" onclick="closeTime()">Cancel</button><button class="confirm" onclick="confirmTime()">Confirm</button></div>
      </div>

      <!-- PEOPLE SHEET -->
      <div class="scrim" id="pScrim" onclick="closePeople()"></div>
      <div class="sheet" id="pSheet">
        <div class="grab"></div>
        <div class="sh-h"><div class="t">Who's this for?</div><div class="s">Kinder · Miss Taylor's Class · 25 parents</div>
          <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="ph">Search parents…</span></div></div>
        <div class="quick"><b onclick="allPeople(true)">Select all</b><b onclick="allPeople(false)">Clear</b></div>
        <div class="plist" id="plist"></div>
        <button class="peoplebtn" id="peopleDone" onclick="confirmPeople()">Done · 2 selected</button>
      </div>

      <div class="toast" id="toast">Saved ✓</div>
      <div class="home"></div>
    </div>
  </div>
</div>

<script>
  const TYPES=[
    {k:'event',   e:'📝', label:'Event',    color:'#2d5c2e', bg:'#e7efe6', noteLabel:'Event note', ph:'e.g. Class party in the afternoon', time:true},
    {k:'noschool',e:'🚫', label:'No School',color:'#c0533d', bg:'#fbe6e3', noteLabel:'Note',        ph:'e.g. District holiday — no school', allday:true},
    {k:'special', e:'⭐', label:'Special',  color:'#c08a2d', bg:'#f6edd8', noteLabel:'Note',        ph:'e.g. Pajama day! 🩳', time:true},
    {k:'todo',    e:'✅', label:'To-Do',    color:'#3b6ea5', bg:'#e1ecf7', noteLabel:'Describe to-do', ph:'e.g. Bring a white dress to school', todo:true},
  ];
  const T=k=>TYPES.find(t=>t.k===k);
  let curType='event';

  // time
  const TIMES=[]; for(let m=7*60;m<=21*60;m+=30){let h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM',hh=h%12||12;TIMES.push(hh+':'+(mm===0?'00':'30')+' '+ap);}
  let startIdx=6,endIdx=8,pStart=6,pEnd=8,timeSet=false;
  function durText(){const mins=(endIdx-startIdx)*30,h=Math.floor(mins/60),m=mins%60;return (h?h+' hr':'')+(h&&m?' ':'')+(m?m+' min':'')||'—';}

  // to-do
  let deadlineSet=false, assign='everyone';
  const PEOPLE=[{n:'Sarah Park',q:"Kennedy's mom"},{n:'Emily Miller',q:"Jake's mom"},{n:'Marcus Chen',q:"Oliver's dad"},{n:'Priya Patel',q:"Aanya's mom"},{n:'James Martin',q:"Cooper's dad"},{n:'Nina Park',q:"Leo's mom"}];
  let picked=new Set([0,1]), pickedSaved=new Set([0,1]);
  const ini=n=>n.split(' ').map(w=>w[0]).join('').toUpperCase();

  function renderChips(){
    document.getElementById('chips').innerHTML=TYPES.map(t=>`<div class="chip${t.k===curType?' on':''}" onclick="selectType('${t.k}')" ${t.k===curType?`style="color:${t.color}"`:''}><span class="e">${t.e}</span>${t.label}</div>`).join('');
  }
  function selectType(k){
    curType=k; const t=T(k);
    document.documentElement.style.setProperty('--acc',t.color);
    document.documentElement.style.setProperty('--acc-bg',t.bg);
    renderChips(); renderForm();
  }
  function renderForm(){
    const t=T(curType); let h='';
    h+=`<div class="lbl">${t.noteLabel}</div><textarea class="notefield" id="noteInput" rows="2" placeholder="${t.ph}" oninput="updateSave()"></textarea>`;
    if(t.time){
      h+=`<div class="lbl">Time <span>(optional)</span></div>
        <div class="fieldrow" onclick="openTime()"><div class="ic">🕑</div><div class="body"><div class="l">Start &amp; end time</div>
        <div class="v ${timeSet?'':'unset'}" id="timeVal">${timeSet?`${TIMES[startIdx]}<span class="dash">–</span>${TIMES[endIdx]}`:'Add a time'}</div></div>
        <div class="chev"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div>
        ${timeSet?`<div class="dur">${durText()}</div>`:''}`;
    }
    if(t.allday){
      h+=`<div class="lbl">Duration</div><span class="alldaytag">🗓️ All day · shows at the top of the day</span>`;
    }
    if(t.todo){
      h+=`<div class="lbl">Deadline <span>(optional)</span></div>
        <div class="fieldrow" onclick="toggleDeadline()"><div class="ic">📅</div><div class="body"><div class="l">Due by</div>
        <div class="v ${deadlineSet?'':'unset'}" id="ddVal">${deadlineSet?'Fri, Jun 13':'Set a date'}</div></div>
        <div class="chev"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div>
        <div class="lbl">Attach a link <span>(optional)</span></div>
        <div class="fieldrow"><div class="ic">🔗</div><input class="linkin" placeholder="Paste a URL"/></div>
        <div class="lbl">Assign to</div>
        <div class="seg">
          <div class="s${assign==='everyone'?' on':''}" onclick="pickAssign('everyone')"><span class="i">👥</span>Everyone</div>
          <div class="s${assign==='specific'?' on':''}" onclick="pickAssign('specific')"><span class="i">🙋</span>Specific</div>
          <div class="s${assign==='me'?' on':''}" onclick="pickAssign('me')"><span class="i">🔒</span>Just me</div>
        </div>
        ${assign==='specific'?`<div class="choose" onclick="openPeople()"><div class="ic">🙋</div><div class="ct"><div class="a">${peopleSummary()}</div><div class="b">${pickedSaved.size} parent${pickedSaved.size!==1?'s':''} selected · tap to edit</div></div><div class="cx"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div>`:''}
        <div class="hint"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>${assign==='everyone'?'Everyone in this class group will get this to-do.':assign==='specific'?'Only the parents you choose will get this to-do.':'Private — only you will see this to-do.'}</span></div>`;
    }
    document.getElementById('form').innerHTML=h;
    updateSave();
  }
  function peopleSummary(){const a=[...pickedSaved];if(!a.length)return 'Choose people';const first=PEOPLE[a[0]].n.split(' ')[0]+' '+PEOPLE[a[0]].n.split(' ')[1][0]+'.';return a.length>1?`${first} +${a.length-1} more`:first;}

  function updateSave(){
    const t=T(curType), v=(document.getElementById('noteInput')||{}).value||'';
    document.getElementById('saveLbl').textContent = t.todo?'Save To-Do':'Save Note';
    document.getElementById('saveBtn').disabled = !v.trim();
  }

  // time sheet
  function renderTW(){
    const s=document.getElementById('startScroll'),e=document.getElementById('endScroll');s.innerHTML='';e.innerHTML='';
    TIMES.forEach((t,i)=>{
      const a=document.createElement('div');a.className='opt'+(i===pStart?' sel':'');a.textContent=t;a.onclick=()=>{pStart=i;if(pEnd<=pStart)pEnd=Math.min(i+1,TIMES.length-1);renderTW();centerTW();};s.appendChild(a);
      const b=document.createElement('div');b.className='opt'+(i===pEnd?' sel':'')+(i<=pStart?' disabled':'');b.textContent=t;b.onclick=()=>{pEnd=i;renderTW();centerTW();};e.appendChild(b);
    });
  }
  function centerTW(){const s=document.getElementById('startScroll'),e=document.getElementById('endScroll');const a=s.children[pStart],b=e.children[pEnd];if(a)s.scrollTo({top:a.offsetTop-s.clientHeight/2+a.clientHeight/2,behavior:'smooth'});if(b)e.scrollTo({top:b.offsetTop-e.clientHeight/2+b.clientHeight/2,behavior:'smooth'});}
  function openTime(){pStart=startIdx;pEnd=endIdx;renderTW();document.getElementById('tScrim').classList.add('on');document.getElementById('tSheet').classList.add('on');setTimeout(centerTW,80);}
  function closeTime(){document.getElementById('tScrim').classList.remove('on');document.getElementById('tSheet').classList.remove('on');}
  function confirmTime(){startIdx=pStart;endIdx=pEnd;timeSet=true;closeTime();renderForm();}

  function toggleDeadline(){deadlineSet=!deadlineSet;renderForm();}
  function pickAssign(m){assign=m;renderForm();}

  // people sheet
  function renderPeople(){
    document.getElementById('plist').innerHTML=PEOPLE.map((p,i)=>`<div class="pr${picked.has(i)?' on':''}" onclick="togglePerson(${i})"><div class="pav">${ini(p.n)}</div><div><div class="pn">${p.n}</div><div class="pq">${p.q}</div></div><div class="pc"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div></div>`).join('');
    document.getElementById('peopleDone').textContent=`Done · ${picked.size} selected`;
  }
  function togglePerson(i){picked.has(i)?picked.delete(i):picked.add(i);renderPeople();}
  function allPeople(all){picked=all?new Set(PEOPLE.map((_,i)=>i)):new Set();renderPeople();}
  function openPeople(){picked=new Set(pickedSaved);renderPeople();document.getElementById('pScrim').classList.add('on');document.getElementById('pSheet').classList.add('on');}
  function closePeople(){document.getElementById('pScrim').classList.remove('on');document.getElementById('pSheet').classList.remove('on');}
  function confirmPeople(){pickedSaved=new Set(picked);closePeople();renderForm();}

  function doSave(){const t=T(curType);toast(`${t.e} ${t.todo?'To-do':'Note'} added to Thu, Jun 12 ✓`);}
  let tT;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2000);}

  selectType('event');
</script>
</body>
</html>
