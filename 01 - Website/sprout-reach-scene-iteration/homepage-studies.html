<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Sprout homepage preview</title>
    <script>
      // Bookmarked comparison links now open the single scroll preview.
      const preview = new URL("./home-scroll.html", location.href);
      if (["#home", "#problem", "#brief", "#assist", "#community", "#join"].includes(location.hash)) {
        preview.hash = location.hash;
      }
      location.replace(preview.href);
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=./home-scroll.html"></noscript>
  </head>
  <body><a href="./home-scroll.html">Open the Sprout homepage preview</a></body>
</html>
