<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprout hero B · The people</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="../assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<!-- Hero direction B, 19 Nov 2026. Review scaffolding: hero + top bar only.
     Idea: lead with people, not the product. A type band on top, then one wide photograph of parents and kids on a
     blanket (assets/family-neighborhood.webp, already in the site's asset set), and the class group chat (coded) where
     that afternoon got planned. The headline is the insight: the kids already know each other, the parents don't. -->
<style>
:root {
  --bg: #f4f1ea; --sand: #ebe4d4; --paper: #fbfaf6; --ink: #1e3e2b; --text: #4d525b; --muted: #7d715e;
  --green: #186338; --green-subtle: #e2e9e3; --line: rgb(30 62 43 / 0.14);
  --serif: "Playfair Display", Georgia, serif; --sans: "Inter", -apple-system, system-ui, sans-serif;
  --gx: clamp(16px, 5.5vw, 80px); --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: clip; }
img { max-width: 100%; display: block; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; border-radius: 4px; }
.top { position: relative; z-index: 5; display: flex; align-items: center; gap: 28px; height: 72px; padding: 0 var(--gx); }
.logo { display: inline-flex; align-items: center; gap: 9px; font: 600 22px/1 var(--serif); color: var(--ink); text-decoration: none; }
.top-links { display: flex; gap: 26px; margin-left: auto; font-size: 15px; }
.top-links a { color: var(--ink); opacity: 0.78; text-decoration: none; }
.top-links a:hover { opacity: 1; }
.top-rp, .top-cta { font: 500 15px/1 var(--serif); text-decoration: none; padding: 12px 16px; border-radius: 99px; white-space: nowrap; }
.top-rp { color: var(--green); }
.top-rp:hover { background: var(--green-subtle); }
.top-cta { color: #fff; background: var(--green); padding-inline: 20px; }
.top-rp .sm { display: none; }

/* ── B · the people ── */
.hero { position: relative; overflow: hidden; height: calc(max(760px, 100svh) - 72px); max-height: 1000px; display: flex; flex-direction: column; }
.band { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); column-gap: clamp(32px, 6vw, 110px); align-items: end;
  padding: clamp(18px, 3vh, 36px) var(--gx) clamp(28px, 4.4vh, 44px); }
h1 { margin: 0; font: 500 clamp(44px, 5.7vw, 86px)/0.98 var(--serif); letter-spacing: -0.025em; color: var(--ink); text-wrap: balance; }
h1 em { font-style: italic; font-weight: 400; color: var(--green); }
.side { padding-bottom: 6px; }
.lede { margin: 0; font-size: 18px; line-height: 1.5; color: var(--text); max-width: 34ch; }
.lede b { font-weight: 500; color: var(--ink); }
.proof { margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 34ch; }
.proof span { display: block; }
.proof span:first-child { color: var(--ink); font-weight: 500; }

.shot { position: relative; flex: 1; min-height: 0; margin: 0; }
.shot > img { width: 100%; height: 100%; object-fit: cover; object-position: 38% 44%; filter: saturate(0.92); }
.shot figcaption { position: absolute; left: var(--gx); bottom: 18px; font-size: 12px; letter-spacing: 0.02em; color: rgb(255 255 255 / 0.86); text-shadow: 0 1px 8px rgb(0 0 0 / 0.35); }

/* phone: the class group chat, coded */
.stage { position: absolute; right: calc(var(--gx) + 1vw); top: clamp(28px, 5vh, 48px); --pw: clamp(240px, 19vw, 280px); }
.phone { position: relative; width: var(--pw); aspect-ratio: 393 / 852; border-radius: 14% / 6.46%; overflow: hidden; background: var(--bg);
  box-shadow: 0 0 0 2.5px #d6d1c6, 0 40px 70px -26px rgb(20 30 15 / 0.55); isolation: isolate; }
.app { position: absolute; top: 0; left: 0; width: 393px; height: 852px; transform-origin: 0 0; transform: scale(var(--s, 0.7)); font-family: var(--sans); color: var(--ink); display: flex; flex-direction: column; }
.sb { display: flex; justify-content: space-between; align-items: center; height: 51px; flex-shrink: 0; padding: 14px 30px 0 46px; font: 600 16px/1 var(--sans); }
.sb .r { display: flex; gap: 6px; align-items: center; fill: var(--ink); }
.ch-top { display: flex; align-items: center; gap: 12px; padding: 8px 16px 10px; }
.ch-top > .ph { font-size: 24px; }
.ch-top .mt { width: 44px; height: 44px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font: 500 17px var(--serif); flex-shrink: 0; }
.ch-top .t { flex: 1; display: flex; flex-direction: column; }
.ch-top .t b { font: 500 18px/1.3 var(--serif); }
.ch-top .t small { font-size: 12px; color: var(--muted); }
.tabs { display: flex; justify-content: space-around; border-bottom: 1px solid #e3ddd0; padding: 0 8px; }
.tabs span { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 9px; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs span i { font-size: 20px; }
.tabs span.on { color: var(--ink); border-color: var(--green); font-weight: 600; }
.msgs { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0; background: #f1ede4; }
.day { align-self: center; font-size: 11px; font-weight: 600; color: var(--muted); background: #e7e1d4; border-radius: 99px; padding: 3px 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 86%; }
.msg img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.msg .b { display: flex; flex-direction: column; gap: 3px; }
.msg .who { font-size: 11px; color: var(--muted); padding-left: 4px; }
.msg .who b { font-weight: 600; color: var(--ink); }
.msg p { margin: 0; padding: 9px 13px; border-radius: 16px 16px 16px 4px; background: #fff; font-size: 14.5px; line-height: 1.42; box-shadow: 0 1px 2px rgb(13 13 18 / 0.04); }
.msg.me { align-self: flex-end; }
.msg.me p { border-radius: 16px 16px 4px 16px; background: var(--green); color: #fff; }
.msg .tm { font-size: 10px; color: var(--muted); align-self: flex-end; padding: 0 4px; }
.compose { display: flex; align-items: center; gap: 10px; padding: 12px 16px 40px; background: #f1ede4; }
.compose .in { flex: 1; height: 40px; border-radius: 99px; background: #fff; border: 1px solid #e3ddd0; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #a39a88; }
.compose i { font-size: 24px; color: var(--green); }

@media (prefers-reduced-motion: no-preference) {
  .shot > img { animation: settle 1.6s var(--ease) both; }
  .phone { animation: rise 1.1s var(--ease) 0.35s both; }
  @keyframes settle { from { transform: scale(1.04); } }
  @keyframes rise { from { opacity: 0; transform: translateY(36px); } }
}
@media (max-width: 1100px) { .band { grid-template-columns: 1fr; row-gap: 18px; } .lede { max-width: 52ch; } }
@media (max-width: 820px) { .top-links { display: none; } .top-rp { margin-left: auto; } }
@media (max-width: 640px) {
  .hero { height: auto; max-height: none; min-height: calc(100svh - 64px); }
  .top { gap: 2px; height: 64px; }
  .logo { font-size: 20px; gap: 7px; }
  .logo img { width: 26px; height: 26px; }
  .top-rp, .top-cta { font-size: 13.5px; padding: 10px 11px; }
  .top-rp .lg { display: none; }
  .top-rp .sm { display: inline; }
  .band { padding-top: 14px; padding-bottom: 22px; row-gap: 14px; }
  h1 { font-size: 11.2vw; line-height: 1; }
  .lede { font-size: 16px; }
  .proof { margin-top: 12px; font-size: 12.5px; max-width: none; }
  .shot { flex: 1 0 380px; }
  .shot > img { object-position: 30% 50%; }
  .stage { top: auto; bottom: -150px; right: 14px; --pw: 168px; }
  .phone { box-shadow: 0 0 0 2px #d6d1c6, 0 24px 40px -18px rgb(20 30 15 / 0.6); }
}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#" aria-label="Sprout home"><img src="../assets/logo.png" alt="" width="30" height="30" />Sprout</a>
  <nav class="top-links" aria-label="Sections"><a href="#">Daily Brief</a><a href="#">Class chats</a><a href="#">Directory</a><a href="#">FAQ</a></nav>
  <a class="top-rp" href="https://roomparent.com" rel="noopener"><span class="lg">I’m a room parent</span><span class="sm">Room parent</span></a>
  <a class="top-cta" href="https://apps.apple.com/us/app/sprout-the-app-for-parents/id6739574052">Join your schools</a>
</header>

<main>
  <section class="hero" aria-labelledby="hero-h">
    <div class="band">
      <h1 id="hero-h">Meet the parents your kids <em>already know.</em></h1>
      <div class="side">
        <p class="lede"><b>Sprout is your school’s parent community,</b> plus a daily plan that does the remembering.</p>
        <p class="proof"><span>Kiker families in Circle C are already here</span><span>Free for parents. Always.</span></p>
      </div>
    </div>

    <figure class="shot">
      <img src="../assets/family-neighborhood.webp" width="1536" height="1024" alt="Parents and their kids sharing snacks on a picnic blanket in a park" fetchpriority="high" />
      <div class="stage">
        <div class="phone" role="img" aria-label="Sprout class group chat for Ms. Taylor’s Class: parents planning to meet at the park after pickup on Friday.">
          <div class="app" aria-hidden="true">
            <div class="sb"><span>3:12</span><span class="r">
              <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.3 1.3a4.7 4.7 0 0 0-6.6 0zM1.1 4.5a9.8 9.8 0 0 1 13.8 0l-1.3 1.3a8 8 0 0 0-11.2 0z"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#1e3e2b"/><rect x="2.5" y="2.5" width="19" height="8" rx="2"/><rect x="25" y="4.5" width="1.5" height="4" rx=".7"/></svg>
            </span></div>
            <div class="ch-top"><i class="ph ph-caret-left"></i><span class="mt">MT</span><span class="t"><b>Ms. Taylor’s Class</b><small>Kiker Elementary · First grade</small></span><i class="ph ph-dots-three"></i></div>
            <div class="tabs"><span class="on"><i class="ph-fill ph-chat-circle-dots"></i>Chat</span><span><i class="ph ph-calendar-blank"></i>Calendar</span><span><i class="ph ph-envelope-simple"></i>Updates</span><span><i class="ph ph-link-simple"></i>Links</span></div>
            <div class="msgs">
              <span class="day">Today</span>
              <div class="msg"><img src="../assets/assist/mem-sarah.webp" alt="" /><span class="b"><span class="who"><b>Sarah</b> · Howard’s mom</span><p>Anyone at Brodie Park after pickup Friday?</p></span></div>
              <div class="msg"><img src="../assets/assist/dm-raj.webp" alt="" /><span class="b"><span class="who"><b>Raj</b> · Anaya’s dad</span><p>We’re in. Anaya has been asking all week.</p></span></div>
              <div class="msg"><img src="../assets/assist/mem-jessica.webp" alt="" /><span class="b"><span class="who"><b>Jessica</b> · Robert’s mom</span><p>I’ll bring grapes and the big blanket.</p></span></div>
              <div class="msg me"><span class="b"><p>See you there! We’ll bring the soccer ball.</p></span></div>
              <div class="msg"><img src="../assets/assist/mem-mike.webp" alt="" /><span class="b"><span class="who"><b>Mike</b> · Hawkins’ dad</span><p>Hawkins says save him a spot.</p></span></div>
            </div>
            <div class="compose"><i class="ph ph-plus-circle"></i><span class="in">Message Ms. Taylor’s Class</span><i class="ph-fill ph-paper-plane-right"></i></div>
          </div>
        </div>
      </div>
    </figure>
  </section>
</main>

<script>
(function () {
  const fit = () => document.querySelectorAll(".phone").forEach((p) => p.style.setProperty("--s", p.offsetWidth / 393));
  fit();
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
