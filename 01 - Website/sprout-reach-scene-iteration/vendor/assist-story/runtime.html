/* Sprout tokens (Figma Semantic collection) */
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}

/* ---------- stage: full screen on phones, a phone on desktop ---------- */

}

/* ---------- Daily Brief (exact Figma renders) ---------- */
.brief{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--st);padding-bottom:calc(96px + var(--sb))}
/* tab bar: docked + notched, Tony-approved 14 Nov (Figma Navigation Bar (Docked) 16121:176380) */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(86px + var(--sb));display:flex;justify-content:space-between;align-items:flex-start;padding:9px 22px 0;z-index:5}

.tab i{font-size:24px;line-height:24px}

.tab-gap{width:72px}
/* Sprout Assist: knitted clover in the notch, centre on the bar line */
.hero{position:absolute;left:50%;bottom:calc(54px + var(--sb));width:64px;height:64px;margin-left:-32px;border-radius:50%;background:#e2e9e3;box-shadow:inset 0 0 0 4px #eae6db,0 6px 16px rgba(24,99,56,.18),0 2px 4px rgba(0,0,0,.06);border:0;padding:0;z-index:6;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}

.hp-note{display:flex;align-items:center;gap:calc(10px * var(--k,.5));font-size:calc(25px * var(--k,.5));color:#6b746d;margin-top:calc(12px * var(--k,.5))}
.hp-face{width:calc(36px * var(--k,.5));height:calc(36px * var(--k,.5));border-radius:50%;background:#e3ede5 center/cover}
.hp-trk{position:relative;height:calc(60px * var(--k,.5));margin:calc(24px * var(--k,.5)) calc(8px * var(--k,.5)) 0}
.hp-trk .bar{position:absolute;left:0;right:0;top:calc(12px * var(--k,.5));height:calc(10px * var(--k,.5));border-radius:5px;background:#e2ddd2}
.hp-trk .fill{position:absolute;left:0;top:calc(12px * var(--k,.5));height:calc(10px * var(--k,.5));border-radius:5px;background:var(--brand)}
.hp-trk .stop{position:absolute;top:calc(5px * var(--k,.5));width:calc(24px * var(--k,.5));height:calc(24px * var(--k,.5));margin-left:calc(-12px * var(--k,.5));border-radius:50%;background:#fff;border:2px solid #cfc8b8}
.hp-trk .lbl{position:absolute;top:calc(34px * var(--k,.5));transform:translateX(-30%);font-size:calc(19px * var(--k,.5));color:#6b746d;white-space:nowrap}
.hp-trk .now{position:absolute;top:0;width:calc(34px * var(--k,.5));height:calc(34px * var(--k,.5));margin-left:calc(-17px * var(--k,.5));border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.hp-acts{display:flex;gap:calc(14px * var(--k,.5));margin-top:calc(20px * var(--k,.5))}
.hp-acts button{flex:1;padding:calc(16px * var(--k,.5)) 0;border-radius:999px;background:#e3efe6;color:var(--brand);font:600 calc(25px * var(--k,.5)) var(--sans);display:flex;align-items:center;justify-content:center;gap:calc(8px * var(--k,.5))}
/* E1 time: quick picks + Starts / Ends fields + wheel sheet */
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qk .chip{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding:8px 12px;font-size:13.5px}
.qk .chip small{font-size:11.5px;color:var(--subtle);margin-top:1px}
.qk .chip.sel{background:var(--brand-subtle);border-color:var(--brand);color:var(--strong)}
.qk .chip.sel small{color:var(--brand)}
.tf{display:flex;gap:8px;margin-top:10px}
.tf-f{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;background:var(--field);border-radius:14px;padding:9px 12px}
.tf-f small{grid-column:1;font-size:11.5px;color:var(--subtle)}
.tf-f b{grid-column:1;font:500 18px var(--serif);color:var(--strong)}
.tf-f b em{font:400 11px var(--sans);font-style:normal;color:var(--subtle)}
.tf-f i{grid-row:1/3;grid-column:2;color:var(--subtle)}
.tw{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;height:200px;margin:4px 0 8px}
.tw-col{height:200px;overflow-y:auto;scroll-snap-type:y mandatory;padding:80px 0;scrollbar-width:none;position:relative;z-index:1}
.tw-col::-webkit-scrollbar{display:none}
.tw-it{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font:500 20px var(--serif);color:var(--subtlest,#a9aea8);cursor:pointer;transition:color .15s}
.tw-it.on{color:var(--strong)}
.tw-band{position:absolute;left:0;right:0;top:80px;height:40px;border-radius:12px;background:var(--brand-subtle)}
/* E2 compact sitter list */
.sl{display:flex;flex-direction:column;margin-top:12px;border:1px solid var(--border-soft);border-radius:14px;overflow:hidden}
.sl-row{display:flex;align-items:center;gap:10px;padding:9px 12px;text-align:left;background:#fff;border-bottom:1px solid var(--border-soft);transition:background .15s}
.sl-row:last-of-type{border-bottom:0}
.sl-row .uaph{border-radius:50%;background-color:#e3ede5;background-size:cover;background-position:center bottom;flex:none}
.sl-tx{flex:1;min-width:0}
.sl-n{display:flex;align-items:center;gap:6px;font:500 16px var(--serif);color:var(--strong)}
.sl-tag{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--sans);color:var(--brand);background:var(--brand-subtle);border-radius:999px;padding:2px 7px}
.sl-tag i{width:14px;height:14px;border-radius:50%;background:center/cover}
.sl-tx small{display:block;font-size:12.5px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-row .ck{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--border);display:grid;place-items:center;color:transparent;font-size:12px;flex:none}
.sl-row.on{background:#f3f8f4}
.sl-row.on .ck{background:var(--brand);border-color:var(--brand);color:#fff}
.sl-add{display:flex;align-items:center;gap:8px;padding:11px 12px;font-size:14px;font-weight:500;color:var(--brand);text-align:left;border-top:1px dashed var(--border);background:#fff}
.sl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--subtle)}
.sl-foot .textbtn{width:auto;padding:4px 0;font-size:13px;color:var(--brand)}
/* E4: quick options are just the times */
.qk .chip{padding:9px 14px;font-size:14px}

/* clay avatars fill their circle */
.sl-row .uaph,.ua-row .uaph,.cmp-to .uaph,.for .uaph,.lead .uaph,.mk .uaph{background-size:cover!important;background-position:center!important;background-color:#f2eee6!important}

/* E7: parent marks who is free */
.wf-seg{display:flex;flex:none;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.wf-seg button{padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--subtle);background:#fff}
.wf-seg button+button{border-left:1px solid var(--border)}
.wf-seg button.on[data-a=free]{background:var(--brand);color:#fff}
.wf-seg button.on[data-a=no]{background:#efe9df;color:var(--strong)}
.sl-row.wf.no .sl-tx,.sl-row.wf.no .uaph{opacity:.5}

/* E8: Send on each row, Send to all, small Skip */
.snd{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;background:var(--brand);color:#fff;font:600 13px var(--sans)}
.snd i{font-size:15px}
.snd.done{background:var(--brand-subtle);color:var(--brand)}
.msgpv{margin-top:10px;font-size:13px;color:var(--subtle)}
.msgpv summary{cursor:pointer;color:var(--brand);font-weight:500;list-style:none}
.msgpv summary::-webkit-details-marker{display:none}
.msgpv p{margin:6px 0 0;padding:10px 12px;background:var(--field);border-radius:12px;color:var(--strong);font-size:13.5px;line-height:1.4}
.textbtn.skip{display:block;width:auto;margin:10px auto 0;padding:4px 8px;font-size:12.5px;color:var(--subtle)}

/* F3: Menu / Website as small aligned pills */
.dn3cta{display:flex;align-items:center;gap:6px;margin-top:10px}
.dn3link{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--border-soft);background:#fff;font:500 13px/1 var(--sans);color:var(--brand)}
.dn3link i{font-size:15px;line-height:1;display:block}
.dn3go{margin-left:auto;height:36px;padding:0 20px!important}
/* F4: edit affordances */
.field .ed,.event-invite .ed{margin-left:auto;align-self:center;width:32px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--brand);background:var(--brand-subtle);flex:none}
.edt{width:100%;border:0;background:var(--field);border-radius:12px;padding:10px 12px;font:15px/1.45 var(--sans);color:var(--strong);resize:none;outline:none}
.cmp-edit{display:block;width:auto;margin:0 0 6px auto;font-size:13px;color:var(--brand)}
.ln-ed{display:inline-flex;align-items:center;gap:5px;font:inherit;color:var(--brand);font-weight:600}
/* F3 fix: an inherited 10px bottom margin pushed the icons up */
.dn3link i{margin:0!important;display:flex;align-items:center;justify-content:center;width:16px;height:16px;font-size:16px;line-height:1}
.dn3link{display:inline-flex}

/* G1 (17 Nov): card spacing, price easy to see, Menu / Website clearly secondary and compact so Choose always fits */
.dn3bd{padding:14px 14px 14px}
.dn3top{align-items:center}
.dn3top b{font:500 21px/1.2 var(--serif)}
.dn3price{flex:none;font-size:12.5px;color:var(--subtle);white-space:nowrap}
.dn3price strong{font:600 17px/1 var(--sans);color:var(--brand);margin-right:2px}
.dn3sub{margin-top:5px;font-size:13px}
.dn3why{margin-top:10px}
.dn3cta{gap:6px;margin-top:14px}
.dn3link{height:34px;padding:0 10px;border:0;background:var(--field);color:var(--strong);font:500 13px/1 var(--sans);gap:5px}
.dn3link i{width:15px!important;height:15px!important;font-size:15px!important;color:var(--subtle);background:none!important}
.dn3go{height:36px;padding:0 18px!important}

/* G2: chat cards reused inside an edit sheet; the row you just changed flashes */
.insheet .card{background:none;box-shadow:none;border:0;padding:0}
.insheet .ctop .eyebrow{display:none}
.field.just{animation:justEd 1.4s ease}
@keyframes justEd{0%,40%{background:var(--brand-subtle)}100%{background:transparent}}

/* G3: history button badge + Plans / Chats sections */
#historyBtn{position:relative}
#historyBtn .hb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#fff;color:var(--brand);border:1.5px solid var(--brand);font:600 10.5px/14px var(--sans);text-align:center;box-sizing:border-box}
#historyBtn .hb.attn{background:var(--brand);color:#fff}
#historyBtn .hb[hidden]{display:none}
.hsec{display:flex;flex-direction:column;gap:1px;margin:4px 2px 10px}
.hsec b{font:500 17px/1.2 var(--serif);color:var(--strong)}
.hsec span{font-size:12.5px;color:var(--subtle)}
.hsec.hdiv{margin-top:22px;padding-top:18px;border-top:1px solid var(--border-soft)}
.hrow+.hrow{margin-top:8px}
.hrow .hmeta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;align-self:center}
.hrow .hmeta .when{align-self:auto;margin:0}
.hrow .hmeta em{font-style:normal;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-subtle);border-radius:999px;padding:2px 8px}
.hrow.attn .hmeta em{background:var(--brand);color:#fff}
.hrow .icotile i{font-size:20px;color:var(--brand)}

/* G4: a sitter added straight into the list flashes once */
.sl-row.just{animation:justEd 1.4s ease}

/* G5: waiting on the class group: small X to cancel, add a sitter while you wait */
.card.wcls{padding:12px 14px}
.wcls-top{display:flex;align-items:center;gap:12px}
.wcls-top .spinner{flex:none}
.wcls-top .icotile{flex:none;width:36px;height:36px}
.wcls-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wcls-tx b{font:500 15px/1.25 var(--sans);color:var(--strong)}
.wcls-tx small{font-size:12.5px;color:var(--subtle)}
.wx{flex:none;width:28px;height:28px;border-radius:50%;background:var(--field);color:var(--subtle);display:flex;align-items:center;justify-content:center}
.wx i{font-size:14px}
.wcls .sl-add{margin-top:10px;width:100%;border-top:1px solid var(--border-soft);padding-top:10px}
/* G6: Menu, Website and Choose share one height and centre line (Choose had .btn's top margin) */
.dn3cta{align-items:center}
.dn3cta .dn3go{margin:0 0 0 auto!important;height:36px!important;min-height:0!important;padding:0 18px!important;line-height:1}
.dn3cta .dn3link{height:36px!important;margin:0!important}
/* G7: edit sheets built from chat cards have no footer, so give Save the same home-bar clearance a footer gets */
.bsheet .bbody .insheet{padding-bottom:0}

/* H1: Accounts and cards (direction A, detail sheets) */
#overlays:has(.waiver.on) .bsheet{z-index:37}
.bscrim:has(~ #overlays .waiver.on){z-index:36}
.waiver.instant{transition:none}
.wrow{align-items:center}
.wrow .wcar,.wact .wcar{margin-left:6px;color:var(--subtle);font-size:16px;flex:none}
.wdef{font-size:12px;color:var(--brand);background:var(--brand-subtle);border-radius:999px;padding:2px 8px;flex:none}
.cface{position:relative;border-radius:16px;padding:16px 18px;color:#fff;aspect-ratio:1.6/1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;margin:4px 0 14px;box-shadow:0 8px 20px rgba(0,0,0,.12);background:linear-gradient(135deg,#1f4f86,#163a63)}
.cface.mastercard{background:linear-gradient(135deg,#3b3b3b,#1d1d1d)}
.cface .cbrand{position:absolute;top:14px;left:18px;font:600 15px var(--sans);letter-spacing:.02em}
.cface .clink{position:absolute;top:14px;right:16px;font:600 11px var(--sans);background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px}
.cface b{font:500 22px/1 var(--sans);letter-spacing:.06em}
.cface small{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85}
.cface small em{font-style:normal}
.cface.sm{width:40px;height:28px;aspect-ratio:auto;padding:0 5px 3px;margin:0;border-radius:6px;box-shadow:none;flex:none;align-items:flex-end;justify-content:flex-end}
.cface.sm b{font:600 9px/1 var(--sans);letter-spacing:0}
.wfacts{background:#fff;border:1px solid var(--border-soft);border-radius:16px;padding:4px 14px}
.wfacts>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;font-size:13.5px}
.wfacts>div+div{border-top:1px solid var(--border-soft)}
.wfacts span{color:var(--subtle);flex:none}
.wfacts b{font-weight:500;color:var(--strong);text-align:right}
.wacts{margin-top:12px;background:#fff;border:1px solid var(--border-soft);border-radius:16px;overflow:hidden}
.wact{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:none}
.wact+.wact{border-top:1px solid var(--border-soft)}
.wact>i:first-child{font-size:20px;color:var(--brand);flex:none}
.wact span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wact b{font:500 15px var(--sans);color:var(--strong)}
.wact small{font-size:12.5px;color:var(--subtle)}
.wact.danger>i:first-child,.wact.danger b{color:#b3372b}
.btn.danger{background:#b3372b}
.icotile.warn{background:#f6e3df}.icotile.warn i{color:#b3372b}
.wwarn{display:flex;gap:8px;align-items:flex-start;background:#fbf3e4;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4;color:var(--strong);margin-top:10px}
.wwarn i{font-size:18px;color:#a86a12;flex:none;margin-top:1px}
.ahead{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.ahead .logo{width:48px;height:48px;font-size:20px;border-radius:14px}
.ahead b{display:block;font:500 20px var(--serif);color:var(--strong)}
.ahead small{font-size:13px;color:var(--subtle)}

.field.ro{background:var(--raised)}
.field.ro .v{color:var(--subtle)}
.field.ro>i{font-size:18px;color:var(--subtle);flex:none;margin-left:8px}

.wlinkbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:12px;border-radius:999px;border:1px solid var(--border-soft);background:#fff;font:500 14px var(--sans);color:var(--brand)}
.wlinkbtn i{font-size:17px}
/* H4: locked rows keep the lock on the right, centred, instead of dropping under the text */
.field.in.ro{display:flex;align-items:center;gap:12px}
.field.in.ro>div{flex:1;min-width:0}
.field.in.ro .v{font:500 15.5px var(--sans);margin-top:2px}
.field.in.ro>i{margin-left:0}

/* H5: add a provider account */
.wadd{display:flex;align-items:center;flex-wrap:wrap;gap:0 8px;width:100%;margin-top:8px;padding:12px 14px;border-radius:16px;border:1px dashed var(--border);background:transparent;text-align:left;font:500 15px var(--sans);color:var(--brand)}
.wadd i{font-size:18px}
.wadd small{flex-basis:100%;padding-left:26px;font-size:12.5px;font-weight:400;color:var(--subtle)}
.wsearch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-soft);border-radius:999px;padding:0 14px;height:44px;margin-bottom:6px}
.wsearch i{font-size:18px;color:var(--subtle)}
.wsearch input{flex:1;border:0;background:none;font:400 15px var(--sans);color:var(--strong);outline:none}
.olabel.gm{display:flex;align-items:center;gap:6px}
.olabel.gm img{width:16px;height:12px}
.wfound{position:relative}
.wfound+.wfound{margin-top:8px}
.wfound .wrow{padding-right:72px}
.wfound .wcar{position:absolute;right:14px}
.wdis{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--field);color:var(--subtle);display:flex;align-items:center;justify-content:center}
.wdis i{font-size:13px}
.wcheck{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 8px 8px}
.wcheck .spinner{width:28px;height:28px}
.wcheck b{font:500 17px var(--serif);color:var(--strong);margin-top:6px}
.wcheck small{font-size:13px;color:var(--subtle)}
.wcheck.ok .icotile{width:44px;height:44px;background:var(--brand-subtle)}
.wcheck.ok .icotile i{font-size:22px;color:var(--brand)}

/* I1: demo clock (review panel) + the plan's lock screen and Live Activity in the phone */
.clk{margin:4px 0 18px;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--border-soft);transition:box-shadow .3s}
.clk.ping{box-shadow:0 0 0 3px var(--brand)}
.clk-h b{display:block;font:500 17px var(--serif);color:var(--strong)}
.clk-h small{display:block;font-size:12px;color:var(--subtle);line-height:1.4;margin-top:2px}
.clk-now{margin-top:10px;font:600 15px var(--sans);color:var(--strong)}
.desk .clk-next{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin-top:10px;padding:10px 14px;border-radius:14px;border:0;background:var(--brand);color:#fff;text-align:left;font:600 14px var(--sans);cursor:pointer}
.desk .clk-next small{font-weight:400;font-size:12px;opacity:.85}
.desk .clk-next:disabled{background:var(--field);color:var(--subtle);cursor:default}
.desk .clk-list{list-style:none;padding:0;margin:10px 0 0;font-size:12.5px}
.desk .clk-list button{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:6px 8px;background:none;font:inherit;color:var(--strong);cursor:pointer}
.desk .clk-list button:hover{background:var(--field)}
.desk .clk-list button span{display:block;font-weight:600;font-size:12px;color:var(--brand)}
.desk .clk-list button em{display:block;font-style:normal;color:var(--subtle);font-size:11.5px}
.desk .clk-list li.done button{opacity:.5;cursor:default}
.desk .clk-list li.done button span::before{content:'✓ '}
.clk-log{margin-top:10px;font-size:12px}
.clk-log>b{display:block;font-weight:600;color:var(--strong);margin-bottom:4px}
.clk-log>div{padding:6px 0;border-top:1px solid var(--border-soft);color:var(--strong)}
.clk-log span{display:block;font-size:11px;color:var(--brand);font-weight:600}
.clk-log small{display:block;color:var(--subtle)}
.lock.fam{padding:0 12px;cursor:pointer}
.lock.fam .lstack{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:8px}
.lock.fam .lnote{margin-top:0;width:100%;text-align:left;font:inherit;border:0}
.lock.fam .la{background:rgba(246,243,236,.96);color:var(--strong);border-radius:28px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.lock.fam .la-top{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--subtle)}
.lock.fam .la-top img{width:20px;height:20px;border-radius:6px}
.lock.fam .la-top b{color:var(--strong);font-weight:600}
.lock.fam .la-top .r{margin-left:auto;font:600 12px var(--sans);color:var(--brand)}
.lock.fam .la-t{font:500 19px/1.2 var(--serif);margin:6px 0 1px}
.lock.fam .la-s{font-size:12px;color:var(--subtle);line-height:1.35}
.lock.fam .trk{position:relative;height:30px;margin:10px 4px 0}
.lock.fam .trk .bar{position:absolute;left:0;right:0;top:6px;height:5px;border-radius:3px;background:#e2ddd2}
.lock.fam .trk .fill{position:absolute;left:0;top:6px;height:5px;border-radius:3px;background:var(--brand)}
.lock.fam .trk .stop{position:absolute;top:2px;width:13px;height:13px;margin-left:-6.5px;border-radius:7px;background:#fff;border:2px solid #cfc8b8}
.lock.fam .trk .stop.on{border-color:var(--brand);background:var(--brand)}
.lock.fam .trk .lbl{position:absolute;top:17px;transform:translateX(-30%);font-size:9.5px;color:var(--subtle);white-space:nowrap}
.lock.fam .la-acts{display:flex;gap:6px;margin-top:8px}
.lock.fam .la-acts button{flex:1;padding:7px 0;border-radius:999px;background:var(--brand-subtle);color:var(--brand);font:600 12px var(--sans);display:flex;align-items:center;justify-content:center;gap:4px}
.lock.fam .la-acts button{height:34px;min-height:0;padding:0 10px;margin:0}
.lock.fam .la-acts button i{margin:0;font-size:15px;line-height:1}
.lock.fam .la-acts .la-pay{flex:1.3;background:var(--brand);color:#fff}

/* L3 rate the sitter: five stars, tap to set */
.stars{display:flex;gap:6px;margin-top:14px}
.star{width:44px;height:44px;border-radius:12px;background:var(--raised,#f6f3ec);display:flex;align-items:center;justify-content:center;font-size:24px;color:#d9d2c3;transition:transform .12s,color .12s}
.star.on{color:#f0a91a}
.star:active{transform:scale(.9)}

/* J4 class chat */
.jc-screen{position:absolute;inset:0;z-index:31;display:flex;flex-direction:column;background:var(--bg);color:var(--strong)}
#phone:has(>.jc-screen)>:is(.sbar,.island,.brief,.nav,.hero,.sprout-nav-peek,.sheet,.faceid,.homebar){visibility:hidden}
.jc-head,.jc-composer{flex:none;width:100%;background-size:100% 100%;background-repeat:no-repeat}
.jc-head{aspect-ratio:393/265;background-image:url(/sitter-class-chat/header.png)}
.jc-composer{position:relative;aspect-ratio:393/102;background-image:url(/sitter-class-chat/composer.png)}
.jc-log{flex:1;min-height:0;overflow:auto;padding:8px 16px}
.jc-msg{display:flex;align-items:flex-end;gap:8px;margin:0 0 16px}
.jc-msg.own{justify-content:flex-end}
.jc-content{min-width:0}
.jc-content>small{display:block;font-size:12px;margin-bottom:5px}
.jc-bubble{width:fit-content;margin:0;padding:8px 12px;border-radius:12px;background:var(--field);font:15px/1.4 var(--sans);overflow-wrap:anywhere}
.jc-msg.own .jc-bubble{background:var(--brand-subtle)}
.jc-action{margin:-8px 0 0 48px}
.jc-shared{color:var(--subtle);font-size:13px}
.jc-sys{display:flex;gap:6px;align-items:flex-start;margin:10px 0 0}.jc-sys i{font-size:16px;color:var(--brand);flex:none;margin-top:1px}
.jc-head{position:relative}.jc-title{position:absolute;left:50%;top:62.3%;transform:translate(-50%,-50%);padding:1px 18px;background:#f4f1ea;font:600 17px/22px 'Playfair Display',serif;color:#1d2a22;white-space:nowrap}


/* J8: the party search reuses the dinner carousel. The invitation follows Sprout's public share layout. */
.party-results [data-map]{margin-left:auto;white-space:nowrap}
.party-results>iframe.dnmap{display:block;width:100%;height:230px;border:0;margin:12px 0}
.party-results .party-map{height:230px;margin:12px 0}
.party-results [hidden]{display:none!important}
.party-map .dnlayer{aspect-ratio:auto;background:none}
.party-map .party-map-tiles{position:absolute;inset:0;pointer-events:none;filter:saturate(.43) sepia(.16)}
.party-map-tiles img{display:block;position:absolute;width:256px;height:256px;max-width:none}
.party-map-credit{position:absolute;bottom:3px;left:5px;z-index:4;padding:2px 4px;border-radius:4px;background:var(--bg);color:var(--strong);font-size:10px}
.party-detail-photo{display:block;width:100%;height:184px;object-fit:cover;margin:0 0 14px}
.party-detail .btitle{margin:0}
.party-detail-section{margin-top:17px;padding-top:14px;border-top:1px solid var(--border-soft)}
.party-detail-section .bq{margin:0 0 6px}
.party-detail-section .bp{margin:4px 0 8px}
.party-detail-section .link{display:inline-flex;margin:3px 0 0}

.party-results .dncar{margin:0 -12px;padding:2px 12px 8px}
.party-results .dn3{overflow:hidden}
.party-results a.chip{text-decoration:none}
.event-invite .cover{aspect-ratio:5/4;margin:0 0 12px}
.event-invite .event-invite-title{font-size:20px;line-height:1.2;margin:0 0 9px}
.event-invite-photo{position:relative}
.event-invite-photo .ed{position:absolute;top:8px;right:8px}
.event-invite-heading{display:flex;align-items:flex-start;gap:8px}
.event-invite-heading .ed{align-self:flex-start}
.event-invite-heading .event-invite-title{min-width:0;overflow-wrap:anywhere}
.event-invite .fact{align-items:flex-start;line-height:1.4}
.event-invite .fact>i{margin-top:1px}
.event-invite .fact strong{color:var(--strong);font-weight:600}
.event-invite .fact strong .link{color:inherit}
.event-invite .event-invite-secondary,.event-invite-meta .fact{color:var(--subtle);font-size:12.5px}
.event-invite-meta{margin-top:8px}
.event-invite [data-send-invites]{margin-top:12px}
.event-invite>.link{display:inline-flex;margin:4px 0 0 24px;font-size:12.5px}
.birthday-invite-page .wbody{padding:calc(var(--st) + 16px) 16px 24px}

/* L4 share several sitters: each picked row opens its own note field */
.shr+.shr{margin-top:0}
.shr.on{background:var(--brand-subtle);border-radius:14px;padding-bottom:10px;margin:4px 0}
.shr.on .sl-row{background:transparent}
.shr-note{margin:0 10px;background:#fff}
.shr>.sl-row{width:100%}
.sl>.shr:not(:last-child)>.sl-row:not(.on){border-bottom:1px solid var(--border-soft)}

/* L5 playdate DM: Sprout's 1:1 chat, opened from the confirmed playdate. Plain header (back, parent, kid), real input. */
.jc-screen.dm{transition:opacity .25s,transform .25s}
.jc-screen.dm.gone{opacity:0;transform:translateX(30px)}
.dm-head{flex:none;display:flex;align-items:center;gap:10px;padding:54px 14px 12px;border-bottom:1px solid var(--border-soft,#e6e1d6);background:var(--bg)}
.dm-back{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--strong)}
.dm-who b{display:block;font:600 15px/1.2 var(--sans);color:var(--strong)}
.dm-who small{display:block;font-size:12px;color:var(--subtle)}
.jc-screen.dm .jc-log{padding-top:16px}
.dm-sys{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 16px;font-size:12px;color:var(--subtle)}
.dm-sys i{color:var(--brand);font-size:15px}
.dm-comp{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 34px;border-top:1px solid var(--border-soft,#e6e1d6);background:var(--bg)}
.dm-comp input{flex:1;height:40px;border:0;border-radius:20px;background:#fff;padding:0 16px;font:15px var(--sans);color:var(--strong)}
.dm-comp input:focus{outline:2px solid var(--brand);outline-offset:0}
.dm-comp button{width:40px;height:40px;border-radius:20px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.ua-row.pk .uamono i{font-size:20px}
.jc-screen.dm .jc-content{max-width:80%}
.jc-screen.dm .jc-msg.own .jc-bubble{background:var(--brand);color:#fff}
.lock.fam .la-acts button i{width:auto;height:auto;border:0;border-radius:0;background:none;box-shadow:none}
.shr-note input::placeholder{color:#9aa19c;opacity:1}

/* 19 Nov (Ahmad): compact place-search header. Area over a one-line title, Google Maps as an icon button. */
.party-results .pr-head{align-items:center}
.party-results .pr-tx{flex:1;min-width:0}
.party-results .pr-tx .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party-results .pr-gmap{flex:none;width:40px;height:40px;margin-left:8px;border-radius:20px;border:1px solid var(--border-soft,#e2ddd2);background:#fff;color:var(--strong);display:flex;align-items:center;justify-content:center;font-size:19px;transition:transform .12s}
.party-results .pr-gmap:active{transform:scale(.94)}
.party-results .pr-gmap.on{background:var(--brand);border-color:var(--brand);color:#fff}
.party-results .dn3 .dn3top{flex-direction:column;align-items:flex-start;gap:1px}
.party-results .dn3 .dn3top b{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn3cta .dn3ico{width:36px;padding:0;justify-content:center;flex:none}
.dn3cta .dn3ico i{margin:0;font-size:17px}
.party-results .dn3cta .dn3go{flex:1}

/* N4 (20 Nov): the class as parent tiles, two per row, search when it is long (Playdate, Birthday, Carpool) */
.pg-search{display:flex;align-items:center;gap:8px;margin-top:12px;padding:0 12px;height:40px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--subtle)}
.pg-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:15px var(--sans);color:var(--strong)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pg-t{position:relative;display:flex;align-items:center;gap:8px;min-width:0;padding:8px;border:1px solid var(--border-soft);border-radius:14px;background:#fff;text-align:left;transition:background .15s,border-color .15s}
.pg-t .uaph{border-radius:50%;flex:none;background-size:cover!important;background-position:center!important;background-color:#f2eee6!important}
.pg-t .uaph.uamono{background:var(--brand-subtle)!important;font-size:15px}
.pg-tx{display:flex;flex-direction:column;min-width:0}
.pg-tx b{font:500 13.5px/1.25 var(--serif);color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-tx small{font-size:11.5px;line-height:1.35;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-t .ck{position:absolute;left:30px;top:50%;margin-top:4px;width:17px;height:17px;border-radius:9px;border:2px solid #fff;display:grid;place-items:center;color:transparent;font-size:9px;opacity:0;transition:opacity .15s}
.pg-t.on{background:#f3f8f4;border-color:var(--brand)}
.pg-t.on .ck{background:var(--brand);color:#fff;opacity:1}
.pg-more[hidden]{display:none}
.pg-more{display:block;margin:10px auto 0;padding:6px 10px;font:600 13px var(--sans);color:var(--brand);background:none;border:0}
.pg-none{margin:10px 0 0;font-size:13px;color:var(--subtle);text-align:center}
/* N1 carpool: weekday chips sit on one line */
/* 24 Nov: seven day chips on one row. flex-basis 0 + min-width 0 so they share the row evenly on any phone width,
   label sized to fit so "Wed" never spills out of its chip and stays centered. */
.cp-wd{flex-wrap:nowrap;gap:4px}
.cp-wd .chip{flex:1 1 0;min-width:0;height:36px;padding:0;font-size:12.5px;white-space:nowrap;text-align:center;justify-content:center;align-items:center}
/* N9 (20 Nov): who is on the group text: you, the sitter (or parent) and Sprout */
.gtx-who{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.gtx-who .uaph{display:inline-block;border-radius:50%;background-size:cover;background-position:center;margin-left:4px}
.gtx-who .orb.sm{width:16px;height:16px;margin-left:4px}

/* S1 (20 Nov US): today's earliest start, and times before it greyed out */
.ua-lead{display:flex;gap:6px;align-items:flex-start;margin:2px 0 8px;font-size:12px;line-height:1.35;color:var(--subtle)}
.ua-lead i{font-size:15px;color:var(--brand);margin-top:1px}
.card .qk .chip:disabled{opacity:.35;pointer-events:none}
/* S2: one address suggestion under the field, like iOS autofill */
.rq-sug{margin:-4px 0 8px}
.rq-sug button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;background:var(--brand-subtle);text-align:left}
.rq-sug i{font-size:18px;color:var(--brand)}
.rq-sug b{display:block;font:600 13.5px var(--sans);color:var(--strong)}
.rq-sug small{display:block;font-size:11.5px;color:var(--subtle)}
/* S3 (20 Nov US): Add a sitter from Contacts (iOS contact picker look) */
.ct-pick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:4px 0 0;border-radius:14px;background:var(--brand-subtle);text-align:left}
.ct-pick>i:first-child{font-size:24px;color:var(--brand)}
.ct-pick span{flex:1}
.ct-pick b{display:block;font:600 14.5px var(--sans);color:var(--brand)}
.ct-pick small{display:block;font-size:12px;color:var(--subtle);margin-top:1px}
.ct-pick>i:last-child{color:var(--brand);font-size:16px}
.ct-or{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:11.5px;color:var(--subtle)}
.ct-or:before,.ct-or:after{content:"";flex:1;height:1px;background:rgba(0,0,0,.1)}
.ct-head b{display:block;font:600 17px var(--sans);color:var(--strong);text-align:center}
.ct-head small{display:block;font-size:12px;color:var(--subtle);text-align:center;margin:3px 0 10px}
.ct-search{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;background:rgba(118,118,128,.12);margin-bottom:6px}
.ct-search i{color:var(--subtle);font-size:16px}
.ct-search input{flex:1;border:0;background:transparent;font:15px var(--sans);outline:none;min-width:0}
.ct-list{max-height:360px;overflow-y:auto}
.ct-l{font:600 12px var(--sans);color:var(--subtle);padding:10px 2px 4px;border-bottom:1px solid rgba(0,0,0,.06)}
.ct-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 2px;border-bottom:1px solid rgba(0,0,0,.06);text-align:left;background:transparent}
.ct-av{width:34px;height:34px;border-radius:50%;background:#c9cdd3;color:#fff;font:600 13px var(--sans);display:flex;align-items:center;justify-content:center;flex:none}
.ct-row b{display:block;font:500 15px var(--sans);color:var(--strong)}
.ct-row small{display:block;font-size:12px;color:var(--subtle)}
/* A2 (25 Nov): multi-pick contacts for Share a sitter, the same check as .sl-row */
.ct-row>span:nth-child(2){flex:1;min-width:0}
.ct-row .ck{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--border);display:grid;place-items:center;color:transparent;font-size:12px;flex:none}
.ct-row.on .ck{background:var(--brand);border-color:var(--brand);color:#fff}
.ct-row:disabled{opacity:.45}
.shr-sec{margin-top:16px}
/* S4 (20 Nov US): the sitter's reply in the group text (left, grey like an incoming text), yours on the right,
   and "Sprout read this" under it. S7: the payout link inside Sprout's text. */
.preview.gtx.sms-in{background:#fff;border:1px solid rgba(0,0,0,.08);margin-right:36px}
.preview.gtx.sms-in>small:first-child{display:flex;align-items:center;gap:5px}
.preview.gtx.sms-in .uaph{display:inline-block;border-radius:50%;background-size:cover;background-position:center}
/* Ahmad, 22 Nov: the monogram in a reply label sat low and spilled out; keep it centred in its circle */
.preview.gtx small .uaph.uamono,.pd-w .pd-sent small .uaph.uamono{display:inline-grid;place-items:center;flex:none;line-height:1;border-radius:50%}
.preview.gtx .gtx-read{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;color:var(--subtle)}
.preview.gtx .gtx-read .orb.sm{width:14px;height:14px}
.preview.gtx.sms-out{margin-left:36px;background:var(--brand-subtle)}
.preview.gtx .gtx-link{display:inline-block;margin-top:4px;font:600 13px var(--sans);color:var(--brand);text-decoration:underline}
/* S5 (20 Nov US): Live Activity track inset the same on both sides, labels centred on their dots */
.lock.fam .trk{margin:10px 34px 0}
.lock.fam .trk .lbl{transform:translateX(-50%)}
.lock.fam .trk .lbl.up{top:-15px}
.lock.fam .trk.has-up{margin-top:24px}
/* S6 (20 Nov US): pay card. Hours stepper (stayed late), tip by percent, then Pay or Already paid */
.card.pc .pc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--surface-sunken,#f3efe6)}
.card.pc .pc-row b{display:block;font:600 14px var(--sans);color:var(--strong)}
.card.pc .pc-row small{display:block;font-size:11.5px;color:var(--subtle);margin-top:1px}
.card.pc .pc-step{display:flex;align-items:center;gap:10px}
.card.pc .pc-step b{min-width:76px;text-align:center;font:600 14px var(--sans);white-space:nowrap}
.card.pc .pc-step button{width:32px;height:32px;min-height:0;padding:0;margin:0;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.1);color:var(--brand);display:flex;align-items:center;justify-content:center}
.card.pc .pc-step button:disabled{opacity:.35}
.card.pc [data-tl][hidden]{display:none}

/* P1 (20 Nov US): playdate kids as one row of photo chips, quick times and places on one line each */
.pd-kids{display:flex;gap:8px;margin-top:6px;overflow-x:auto}
.pd-kid{display:inline-flex;align-items:center;gap:8px;flex:none;height:44px;padding:0 14px 0 5px;border-radius:999px;background:#fff;border:1.5px solid rgba(0,0,0,.1);font:600 14.5px var(--sans);color:var(--strong)}
.pd-kid .uaph{width:34px;height:34px;border-radius:50%;background-size:cover;background-position:center}
.pd-kid i{display:none;font-size:13px;color:var(--brand)}
.pd-kid.on{border-color:var(--brand);background:var(--brand-subtle)}
.pd-kid.on i{display:inline}
.card .qk.pd-strip{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.card .qk.pd-strip::-webkit-scrollbar{display:none}
.card .qk.pd-strip .chip{flex:none}
/* P2: the invite card on the organizer's side, same as the other parent's, with a status line instead of buttons */
.pd-w .pd-sent{margin:-2px 0 12px;padding:10px 12px;border-radius:14px;background:var(--brand-subtle)}
.pd-w .pd-sent small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--subtle)}
.pd-w .pd-sent .uaph{display:inline-block;border-radius:50%;background-size:cover;background-position:center}
.pd-w .pd-sent p{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--strong)}
.fact s{color:var(--subtle)}
/* A3 (25 Nov): the payout link rides on the booked card's payout line */
.fact .link{flex:none;white-space:nowrap;text-decoration:none}
.pd-state{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;font:600 13px var(--sans)}
.pd-state.wait{background:#f3efe6;color:var(--subtle)}
.pd-state.wait .spinner{width:14px;height:14px}
.pd-state.ask{background:#fff3dc;color:#8a5a00}
.pd-state.ask i{font-size:16px}

/* C2 (20 Nov US): regular carpool. Families in the order Sprout asks them, one at a time */
.rk{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.rk-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:14px;background:#fff;border:1.5px solid rgba(0,0,0,.08);text-align:left}
.rk-row.on{border-color:var(--brand);background:var(--brand-subtle)}
.rk-tx{flex:1;min-width:0}
.rk-tx b{display:block;font:600 14px var(--sans);color:var(--strong)}
.rk-tx small{display:block;font-size:11.5px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-n{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 13px var(--sans);background:#efebe2;color:var(--subtle)}
.rk-row.on .rk-n{background:var(--brand);color:#fff}
/* 24 Nov: Add a parent, the last row under any carpool family list (class list or a phone number) */
.rk-add{margin-top:6px;background:transparent;border-style:dashed;border-color:rgba(0,0,0,.16)}
.rk-add .uaph{width:36px;height:36px;flex:none}
.rk-add .uaph i{font-size:18px}
.rk-add .rk-go{font-size:16px;color:var(--subtle)}
[data-pg] .rk-add{margin-top:8px}
/* the schedule Tony shares: one line per turn, the name only */
.pd-sched .sch{margin:8px 0 2px;border-radius:12px;background:#fff;overflow:hidden}
.pd-sched .sch-r{display:flex;justify-content:space-between;padding:7px 10px;font-size:13px;border-top:1px solid #eee8dc}
.pd-sched .sch-r:first-child{border-top:0}
.pd-sched .sch-r b{font-weight:600;color:var(--strong)}
/* S8 (21 Nov): custom tip, a dollar field */
.tip-in{display:flex;align-items:center;gap:6px;margin-top:6px;padding:0 16px;height:60px;border-radius:16px;background:#fff;border:1.5px solid var(--brand)}
.tip-in span{font:600 26px var(--sans);color:var(--subtle)}
.tip-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:600 28px var(--sans);color:var(--strong)}
.card.pc .fchips[data-tips]{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
/* Ahmad, 21 Nov: taller so they're easy to tap (44px, the iOS minimum) */
.card.pc .fchips[data-tips] .chip{display:flex;align-items:center;margin:0;padding:0 4px;min-width:0;height:44px;min-height:44px;border-radius:12px;justify-content:center;text-align:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.pc .fchips[data-tips]{margin-top:8px!important}

/* Ahmad, 22 Nov: lock-screen push = Figma "Push Notification" (13562:200846). Glass card 8px padding, 16px radius,
   white hairline, soft shadow; 40px clover tile (#f2edea→#e7d8d2, 10px radius); Inter 10/1.55 white:
   title semibold + "now", subtitle semibold, body regular. */
.lock .lnote.pn{display:flex;align-items:center;gap:8px;margin-top:40px;padding:8px;border-radius:16px;background:rgba(244,241,234,.1);border:1px solid rgba(255,255,255,.1);

<script>
/* Sprout Assist prototype engine.
   Every visual part and timing is the approved SSC Kids demo (ssc-kids-signup-demo/prototype/index.html):
   say() = typing dots ~1 s then a Sprout bubble; me() = parent bubble; block() = an indented card / chips row;
   chips under a card = the answer; a question inside a card = .q; agent work = .status spinner -> check;
   money = approval card + Face ID; anything full screen = the waiver sheet (close top-left, CTA in the footer). */
window.SPROUT_NAV_TEXTURE = './art/assist-clover-ahmad-700.png';
window.Sprout = (() => {
  const $ = s => document.querySelector(s);
  /* PACE < 1 replays a flow fast in the background (review state for ongoing sessions); 1 = real time */
  let PACE = 1;
  const sleep = ms => new Promise(r => setTimeout(r, ms * PACE));
  const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const sheet = $('#sheet'), scrim = $('#scrim'), views = $('#views'), hsub = $('#hsub'), headOrb = $('#headOrb');
  const A = './art/';

  function toast(t){ const n = $('#toast'); n.textContent = t; n.classList.add('on'); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('on'), 1600); }
  const notInDemo = () => toast('Not part of this demo');

  /* ---------- family data (the same family as the SSC demo) ---------- */
  const wallet = {
    accounts: [
      { provider:'Austin Parks & Rec', site:'austintexas.gov', email:'tony@martinfam.com', how:'Your existing login', kids:['Jake'], used:'Jun 3 · Jake’s summer camp' },
    ],
    cards: [
      { id:'visa', brand:'Visa', last4:'4242', exp:'08 / 28', label:'Visa •••• 4242', sub:'Pay with Link · one-time card number', def:true, link:true, by:'Tony',
        used:'Jun 3 · Austin Parks & Rec · $240', uses:'Jake’s summer camp balance, due Aug 7', bill:['Tony Martin', '10212 Banks Court, Austin, TX', '78745'] },
      { id:'mc', brand:'Mastercard', last4:'5100', exp:'11 / 27', label:'Mastercard •••• 5100', sub:'Joint card · Dana', nick:'Joint card', by:'Dana', used:'Not used by Sprout yet' },
    ],
  };
  const defaultCard = () => wallet.cards.find(c => c.def) || wallet.cards[0];
  const fmt = n => '$' + n.toFixed(2).replace(/\.00$/, '.00');

  /* ---------- plans: one chat per request; starting a task again makes a new plan ---------- */
  const plans = []; let current = null, seq = 0, pendingOpen = null;
  const homeView = el('<div class="chat" id="homeView"></div>'); views.appendChild(homeView);

  function syncOrb(){ headOrb.classList.toggle('work', !!(current && current.typing)); }
  function makePlan(kind, o){
    const p = { id: ++seq, kind, title: o.title, sub: o.sub, icon: o.icon, line: o.line || 'Just started', when: 'Now', attn: false, done: false, typing: false, started: Date.now(), touched: Date.now() };
    p.chat = el('<div class="chat" hidden></div>'); views.appendChild(p.chat);
    p.scroll = () => requestAnimationFrame(() => p.chat.scrollTo({ top: p.chat.scrollHeight, behavior: 'smooth' }));
    p.add = n => { p.chat.appendChild(n); p.scroll(); return n; };
    p.say = async (html, wait = 900) => {
      p.typing = true; syncOrb();
      const t = p.add(el(`<div class="row"><div class="from"><span class="orb sm"></span>Sprout</div><div class="bub typing" style="display:inline-flex;margin-left:32px"><i></i><i></i><i></i></div></div>`));
      await sleep(wait); t.remove(); p.typing = false; syncOrb();
      p.add(el(`<div class="row"><div class="from"><span class="orb sm"></span>Sprout</div><div class="bub">${html}</div></div>`));
    };
    p.me = text => p.add(el(`<div class="row me"><div class="bub">${text}</div></div>`));
    p.block = html => p.add(el(`<div class="row indent">${html}</div>`));
    p.set = (line, extra = {}) => { Object.assign(p, { line, touched: Date.now() }, extra); renderHome(); };
    /* chips under a message or card. The tapped chip turns green, the rest fade; the parent's answer
       appears as their bubble (same as SSC). stub = chips that only show "Not part of this demo". */
    p.chips = (opts, { echo = true, stub = [], into = null } = {}) => new Promise(res => {
      const html = `<div class="chips">${opts.map((o, i) => `<button class="chip" data-i="${i}">${o}</button>`).join('')}</div>`;
      const host = into ? (into.appendChild(el(html)), into) : p.block(html);
      const c = host.querySelector('.chips:last-of-type') || host.querySelector('.chips');
      c.querySelectorAll('.chip').forEach(b => b.onclick = () => {
        const i = +b.dataset.i; if (stub.includes(i)) return notInDemo();
        b.classList.add('sel'); c.classList.add('done');
        if (echo) p.me(typeof echo === 'string' ? echo : opts[i]);
        res(i);
      });
      p.scroll();
    });
    /* agent work row: spinner, then a check */
    p.work = (title, small) => {
      const r = p.block(`<div class="status"><span class="spinner"></span><div>${title}<small>${small || ''}</small></div></div>`);
      return { done: (t2, s2, icon = 'ph-clipboard-text') => { r.innerHTML = `<div class="status"><span class="icotile"><i class="ph ${icon}"></i></span><div>${t2}<small>${s2 || ''}</small></div><i class="ph-bold ph-check end"></i></div>`; p.scroll(); } };
    };
    p.note = (t, s, icon = 'ph-clipboard-text') => p.block(`<div class="status"><span class="icotile"><i class="ph ${icon}"></i></span><div>${t}${s ? `<small>${s}</small>` : ''}</div><i class="ph-bold ph-check end"></i></div>`);
    /* receipt line (SSC "Registered" row / Figma receipt pill) */
    p.receipt = t => p.block(`<div class="status"><i class="ph-bold ph-check-circle" style="font-size:20px;color:var(--brand)"></i><div>${t}</div></div>`);
    p.divider = t => p.add(el(`<div class="tdiv">${t}</div>`));
    /* what the parent would type (Figma keyboard frames): fills the composer; tapping it or send posts it */
    p.draft = text => new Promise(res => { p.pending = { text, res }; if (current === p) applyComposer(); });
    /* object card (Figma "SA card"): cover, header, fact rows, then SSC .two buttons (secondary, primary) */
    p.card = ({ cover, icon = 'ph-calendar-blank', eyebrow, title, rows = [], body = '', left, right, leftStub = true }) => new Promise(res => {
      const c = p.block(`<div class="card">${cover ? `<div class="cover" style="background-image:url(${cover})"></div>` : ''}
        <div class="ctop"><span class="icotile"><i class="ph ${icon}"></i></span><div><div class="eyebrow">${eyebrow}</div><div class="ttl">${title}</div></div></div>
        ${rows.length ? '<hr>' + rows.map(([i, t]) => `<div class="fact"><i class="ph ${i}"></i>${t}</div>`).join('') : ''}${body}
        ${right ? `<div class="two">${left ? `<button class="btn ghost" data-k="0">${left}</button>` : ''}<button class="btn" data-k="1">${right}</button></div>` : ''}</div>`).querySelector('.card');
      c.querySelectorAll('.two .btn').forEach(b => b.onclick = () => {
        if (b.dataset.k === '0' && leftStub) return toast(typeof leftStub === 'string' ? leftStub : 'Not part of this demo');
        c.querySelector('.two').remove(); p.me(b.textContent); res({ k: +b.dataset.k, el: c });
      });
      if (!right) res({ k: -1, el: c });
    });
    plans.unshift(p); renderHome();
    return p;
  }
  function applyComposer(){
    const d = current && current.pending;
    $('#composer').classList.toggle('draft', !!d); $('#ctext').textContent = d ? d.text : 'Ask Sprout anything';
  }
  function sendDraft(){
    if (!current || !current.pending) return;
    const { text, res } = current.pending; current.pending = null; applyComposer(); current.me(text); res(text);
  }
  $('#composer').onclick = sendDraft;

  /* bottom sheet (Figma "Sheet ·"): grabber, no X, tap outside goes back, CTA in the footer */
  function bsheet({ body, foot = '', stack = false, onBack }){
    const s = el(`<div class="bsheet" role="dialog"><div class="grab"></div><div class="bbody">${body}</div>${foot ? `<div class="bfoot${stack ? ' stack' : ''}">${foot}</div>` : ''}</div>`);
    $('#overlays').appendChild(s); const scr = $('#bscrim');
    s.getBoundingClientRect(); s.classList.add('on'); scr.classList.add('on');

  /* the field editor (bottom sheet, Save in the footer): choices as pick rows, otherwise a text box. Saving updates the
     row in place, tags it Edited, and fires 'edited' on the row so a flow can react (new weeks change the price). */
  function editField(row){
    if (row.dataset.ro) return;
    const label = row.querySelector('.l').textContent, vEl = row.querySelector('.v'), cur = vEl.textContent;
    const opts = row.dataset.opts ? JSON.parse(row.dataset.opts) : null, multi = !!row.dataset.multi;
    const now = new Set(multi ? cur.replace(' and ', ', ').split(', ').map(x => x.trim()) : [cur]);
    const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const v = bsheet({ body:`<div class="bh"><span class="icotile"><i class="ph ph-pencil-simple"></i></span><b>${esc(label)}</b></div>
      ${opts ? `<div class="list">${opts.map((o, i) => `<button type="button" class="pick${now.has(o) ? ' on' : ''}" data-i="${i}"><span class="ptx">${esc(o)}</span><span class="cb${multi ? '' : ' rd'}"><i class="ph-bold ph-check"></i></span></button>`).join('')}</div>`
        : cur.length > 40 ? `<textarea class="edt" rows="3">${esc(cur)}</textarea>` : `<label class="field in" style="margin:0"><div style="width:100%"><input value="${esc(cur)}" autocomplete="off"></div></label>`}`,
      foot:'<button type="button" class="btn" data-save>Save</button>' });
    const picks = [...v.o.querySelectorAll('.list .pick')];
    picks.forEach(b => b.onclick = () => { if (multi) b.classList.toggle('on'); else picks.forEach(x => x.classList.toggle('on', x === b)); });
    const input = v.o.querySelector('input, textarea'); if (input) setTimeout(() => input.focus(), 350);
    v.o.querySelector('[data-save]').onclick = () => {
      let val;
      if (opts) { const on = picks.filter(b => b.classList.contains('on')).map(b => opts[+b.dataset.i]); if (!on.length) return toast('Pick at least one');
        val = multi ? (on.length > 1 ? on.slice(0, -1).join(', ') + ' and ' + on[on.length - 1] : on[0]) : on[0]; }
      else { val = input.value.trim(); if (!val) return toast(`${label} can’t be empty`); }
      v.close();
      if (val === cur) return;
      vEl.textContent = val;
      const tag = row.querySelector('.s'); tag.innerHTML = 'Edited <i class="ph ph-pencil-simple"></i>';
      row.dispatchEvent(new CustomEvent('edited', { bubbles:true, detail:{ label, value:val, picks: opts ? picks.filter(b => b.classList.contains('on')).map(b => opts[+b.dataset.i]) : null } }));
    };

  /* provider account step (SSC "Last step" chips; Figma K12 R·1/R·2 and K10 A·1–A·3) */
  async function providerAccount(p, { provider, site, kid = 'Jake', ask, opts = ['Create one for me', 'I already have one'], after }){
    const have = wallet.accounts.find(a => a.provider === provider);
    if (have) {
      await p.say(`You already have a ${provider} account, so I'll sign in with it.`, 900);
      const w = p.work(`Signing in to ${provider}`, `on ${site}`); await sleep(1300);
      w.done(`Signed in to ${provider}`, `${have.email} · from your password manager`); return;
    }
    await p.say(ask || `${provider} needs a parent account. I can make one with tony@martinfam.com, or use the one you already have.`, 1000);
    for (;;) {
      const i = await p.chips(opts);
      if (i === 0) {
        await sleep(300);
        const w = p.work(`Creating your ${provider} account`, `on ${site}`); await sleep(1500);
        wallet.accounts.push({ provider, site, email:'tony@martinfam.com', how:'Created by Sprout' }); renderHome();
        w.done(`Created your ${provider} account`, 'tony@martinfam.com · login saved to your password manager');
        if (after) await after(false);
        return;
      }
      await p.say('Sign in with your password manager. I never see or keep your password.', 800);
      const login = await passwordSheet(provider, site, kid);
      if (!login) { await p.say('No problem. Pick one when you’re ready.', 600); continue; }
      const w = p.work(`Signing in to ${provider}`, `on ${site}`); await sleep(1200);
      wallet.accounts.push({ provider, site, email: login, how:'Your existing login' }); renderHome();
      w.done(`Signed in to ${provider}`, `${login} · from your password manager`);
      if (after) await after(true);
      return;
    }
  }
  /* Figma K12 R·1 / R·2: the password manager fills the login; Sprout never sees the password */
  function passwordSheet(provider, site, kid){
    return new Promise(res => {
      let done = false; const finish = v => { if (!done) { done = true; res(v); } };
      const saved = () => `<div class="bh"><span class="icotile"><i class="ph ph-key"></i></span><b>Sign in to ${provider}</b></div>
        <p class="bp">Your password manager fills in your ${provider} login. Sprout uses it on their site to register ${kid}, and never sees the password.</p>
        <div class="field"><i class="ph ph-password" style="font-size:20px;color:var(--subtle);margin-right:10px"></i><div class="v" style="margin:0;font-size:14.5px">tony@martinfam.com · saved login for ${provider}</div></div>`;
      const other = () => `<div class="bh"><span class="icotile"><i class="ph ph-key"></i></span><b>Sign in to ${provider}</b></div>
        <p class="bp">Type the login you use on ${site}. It's saved to your password manager. Sprout never sees the password.</p>
        <div class="fields" style="margin-top:0"><label class="field in"><div style="width:100%"><div class="l">Email</div><input value="tony.martin@gmail.com" autocomplete="off"></div></label>
        <label class="field in"><div style="width:100%"><div class="l">Password</div><input type="password" value="demo-password" autocomplete="off"></div></label></div>`;
      const v = bsheet({ body:saved(), stack:true, foot:`<button type="button" class="btn" data-go>Continue with saved login</button><button type="button" class="textbtn" data-alt>Use a different login</button>`, onBack:() => finish(null) });
      let mode = 'saved';
      v.foot.querySelector('[data-go]').onclick = () => { const login = mode === 'saved' ? 'tony@martinfam.com' : v.body.querySelector('input').value; v.close(); finish(login); };
      v.foot.querySelector('[data-alt]').onclick = () => {
        if (mode === 'saved') { mode = 'other'; v.body.innerHTML = other(); v.foot.querySelector('[data-go]').textContent = 'Sign in'; v.foot.querySelector('[data-alt]').textContent = 'Cancel'; }
        else { mode = 'saved'; v.body.innerHTML = saved(); v.foot.querySelector('[data-go]').textContent = 'Continue with saved login'; v.foot.querySelector('[data-alt]').textContent = 'Use a different login'; }
      };
    });
  }

}

const sub = (p, s) => { p.sub = s; if (!p.chat.hidden) $('#hsub').textContent = s; };
async function later(p, { status, small, ms = 3500, title, body }){
  const w = p.block(`<div class="status"><span class="spinner"></span><div>${status}<small>${small || ''}</small></div></div>`);
  await sleep(ms); w.remove(); X.notify(p, title, body);
}
const preview = (text, label = 'Message preview') => `<div class="preview"><small>${label}</small><p>${text}</p></div>`;

/* ---------- data ---------- */
const NIGHTS = { fri:{ short:'Fri', day:'Fri, Jul 31', long:'Friday, July 31', cancel:'Thu 7 PM' }, sat:{ short:'Sat', day:'Sat, Aug 1', long:'Saturday, August 1', cancel:'Fri 7 PM' } };
const PLACES = [
  { n:'Olive & Ember', s:'Italian · 2.1 mi · $$$', slots:['6:30', '7:00', '8:15'], best:'7:00', note:'Patio seating. You saved it in June.', addr:'1601 S Lamar Blvd' },
  { n:'Casa Verde', s:'Mexican · 3.4 mi · $$', slots:['7:00', '7:30', '8:00'], best:'7:30', note:'New this spring. Two families in Maya’s class went last month.', addr:'2200 Manchaca Rd' },
  { n:'Kumo', s:'Japanese · 4.0 mi · $$$$', slots:['8:30'], best:'8:30', note:'Tasting menu, about 2 hours. Only 8:30 is left.', addr:'801 S Lamar Blvd' },
];
const SITTERS = { Alex:{ rate:25, by:'Saved by you', times:'Sat for you 4 times' }, Sam:{ rate:28, by:'Saved by Dana', times:'Sat for you twice' }, Riley:{ rate:24, by:'Saved by you', times:'Sat for you once' } };
const CANT = ['Riley'];   // Riley is away that weekend; everyone else says yes (C: Alex is busy too)

/* sitter time from the dinner time: arrive 30 min before you leave, stay until you're home */
const mins = t => { const [h, m] = t.split(':').map(Number); return (h + 12) * 60 + m; };
const clock = m => { const h = Math.floor(m / 60) - 12, mm = m % 60; return mm ? `${h}:${String(mm).padStart(2, '0')}` : `${h}`; };
function evening(time, homeBy){
  const from = mins(time) - 30, to = homeBy ? mins(homeBy) : (mins(time) >= mins('8:00') ? mins('10:30') : mins('10:00'));
  return { from, to, label:`${clock(from)}–${clock(to)} PM`, hours:(to - from) / 60 };
}
const est = (name, ev) => Math.round(SITTERS[name].rate * ev.hours);
const hrs = h => `${h % 1 ? h.toFixed(1) : h} hours`;

/* ---------- shared parts ---------- */
function placeDetails(pl){
  overlay({ title:pl.n, sub:pl.s, plain:false, body:`<div class="page"><div class="demo-note">Sample place. Sprout shows the restaurant’s own details here.</div>
    <h3>${pl.n}</h3><h4>${pl.s}</h4><h5>Why it’s here</h5><p>${pl.note}</p><h5>Open tables for 2</h5><p>${pl.slots.map(s => s + ' PM').join(' · ')}</p>
    <h5>Where</h5><p>${pl.addr}, Austin · about ${Math.round(parseFloat(pl.s.split('·')[1]) * 4)} min from home</p>
    <h5>Cancellation</h5><p>Free until the evening before. After that, a $25 per person no-show fee.</p></div>` });
}
/* restaurant picker: each place with its open times; tap a time, then one green button books it */
function placeCard(p, { night, eyebrow }){
  return new Promise(res => {
    const c = p.block(`<div class="card">
      <div class="ctop"><span class="icotile"><i class="ph ph-fork-knife"></i></span><div><div class="eyebrow">${eyebrow || `Dinner · ${night.day} · 2 people`}</div><div class="ttl">Tables open near home</div></div></div>
      <div class="fields">${PLACES.map((pl, i) => `<div class="field" style="display:block">
        <div style="display:flex;align-items:center;gap:10px">${mono(pl.n)}<div style="flex:1;min-width:0"><div class="v" style="margin:0">${pl.n}</div><div class="fs">${pl.s}</div></div><button class="textbtn" data-d="${i}" style="font-size:13px;padding:4px 0;width:auto;flex:none;margin:0">Details</button></div>
        <div class="chips" style="margin:10px 0 0">${pl.slots.map(s => `<button class="chip" data-p="${i}" data-t="${s}">${s} PM</button>`).join('')}</div></div>`).join('')}</div>
      <button class="btn" disabled style="margin-top:12px">Pick a time</button>
      <div class="foot">Sample places · no real reservation</div></div>`).querySelector('.card');
    let pick = null; const btn = c.querySelector('.btn');
    c.querySelectorAll('[data-d]').forEach(b => b.onclick = () => placeDetails(PLACES[+b.dataset.d]));
    c.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => {
      c.querySelectorAll('.chip[data-t]').forEach(x => x.classList.toggle('sel', x === b));
      pick = { place:PLACES[+b.dataset.p], time:b.dataset.t }; btn.disabled = false; btn.textContent = `Book ${pick.place.n} · ${pick.time} PM`;
    });
    btn.onclick = () => { if (!pick) return; c.querySelectorAll('.chips').forEach(x => x.classList.add('done')); c.querySelectorAll('[data-d]').forEach(x => x.remove()); btn.remove(); p.me(`Book ${pick.place.n} · ${pick.time} PM`); res(pick); };
  });
}
async function bookTable(p, night, pick){
  const w = p.work(`Booking ${pick.place.n}`, `${night.day} · ${pick.time} PM · 2 people`); await sleep(1500);
  w.done(`Table booked · ${pick.place.n}`, `${night.day} · ${pick.time} PM · free to cancel until ${night.cancel}`, 'ph-fork-knife');
}
/* the sitters you know (A8): pick any, each gets a separate message */
function sitterPicker(p, { title = 'Who should I ask?' } = {}){
  return new Promise(r => {
    const c = p.block(`<div class="card">
      <div class="ctop"><span class="icotile"><i class="ph ph-address-book"></i></span><div><div class="eyebrow">Your saved sitters · pick any</div><div class="ttl">${title}</div></div></div>
      <div class="fields">${Object.entries(SITTERS).map(([n, s]) => `<button class="pick on" data-n="${n}">${mono(n)}<span class="ptx">${n}<small>${s.by} · $${s.rate}/hour</small></span><span class="cb"><i class="ph-bold ph-check"></i></span></button>`).join('')}</div>
      <button class="btn">Ask Alex, Sam and Riley</button></div>`);
    const btn = c.querySelector('.btn'), picks = [...c.querySelectorAll('.pick')];
    const names = () => picks.filter(x => x.classList.contains('on')).map(x => x.dataset.n);
    picks.forEach(x => x.onclick = () => { x.classList.toggle('on'); const n = names(); btn.disabled = !n.length; btn.textContent = n.length ? 'Ask ' + joinNames(n) : 'Pick at least one sitter'; });
    btn.onclick = () => { const n = names(); picks.forEach(x => x.style.pointerEvents = 'none'); btn.remove(); p.me('Ask ' + joinNames(n)); r(n); };
  });
}
const availMsg = (night, ev) => `Hi! Are you free to watch Maya (7) and Jake (5) on ${night.day}, ${ev.label}? We’re going out to dinner. Let us know your rate. We’ll confirm with one sitter after hearing back.`;
async function sendToSitters(p, names, night, ev){
  await p.say(`${names.length > 1 ? 'Here’s what each of them gets, separately.' : `Here’s the message to ${names[0]}.`} Your home address stays private until you book.`, 900);
  const m = p.block(`<div class="card">${preview(availMsg(night, ev))}</div>`);
  await p.chips([`Send to ${names.length > 1 ? names.length + ' sitters' : names[0]}`, 'Edit message'], { into:m, stub:[1] });
  p.note(joinNames(names), `${names.length} separate message${names.length > 1 ? 's' : ''} delivered`, 'ph-chat-circle-text');
}
/* the confirm card: SSC approval card, no payment (you pay the sitter directly) */
function confirmNight(p, { name, night, ev, pick }){
  return new Promise(res => {
    const c = p.block(`<div class="card pay">
      <div class="ctop"><span class="icotile"><i class="ph ph-moon-stars"></i></span><div><div class="ttl">Confirm your night</div><div class="sub">${night.day}</div></div></div>
      <div class="for"><i class="s">M</i>Maya &amp; Jake · ${name} · ${ev.label}</div>
      ${pick ? `<div class="line"><span>Dinner</span><span>${pick.place.n} · ${pick.time} PM</span></div>` : ''}
      <div class="line"><span>Sitter</span><span>${name} · $${SITTERS[name].rate}/hour</span></div>
      <div class="line"><span>Sitter time</span><span>${hrs(ev.hours)}</span></div>
      <div class="line est"><span>Sitter estimate</span><span>$${est(name, ev)}</span></div>
      <div class="wait"><i class="ph ph-hourglass-medium"></i>Booked after ${name} accepts · you pay ${name} directly</div>
      <div class="two"><button class="btn ghost" data-k="back">Back</button><button class="btn" data-k="ok">Confirm ${name}</button></div>
    </div>`).querySelector('.card');
    c.querySelector('[data-k=back]').onclick = () => { c.parentElement.remove(); res(false); };
    c.querySelector('[data-k=ok]').onclick = () => { c.querySelector('.two').remove(); c.querySelector('.wait').innerHTML = `<i class="ph ph-hourglass-medium"></i>Waiting for ${name} to accept`; p.me('Confirm ' + name); res(true); };
  });
}
async function summary(p, { name, night, ev, pick }){
  p.block(`<div class="card"><div class="ctop"><span class="icotile"><i class="ph ph-moon-stars"></i></span><div><div class="eyebrow">Date night · ${night.day}</div><div class="ttl">Your evening</div></div></div>
    <hr><div class="fact"><i class="ph ph-baby"></i>${name} · ${ev.label} · about $${est(name, ev)}</div>
    ${pick ? `<div class="fact"><i class="ph ph-fork-knife"></i>${pick.place.n} · ${pick.time} PM · table for 2</div>` : ''}
    <div class="fact"><i class="ph ph-calendar-check"></i>On the family calendar · Dana has it too</div></div>`);
  p.set(`${pick ? pick.place.n + ' ' + pick.time + ' · ' : ''}${name} ${ev.label}`, { when:night.short, done:true });
  const d = await p.chips(['Text Dana the plan', 'Done']);
  await p.say(d === 0 ? 'Sent Dana the plan from you. Have a lovely night.' : 'Have a lovely night.', 700);
  if (d === 1) X.closeSheet();
}
/* nobody can come: the table stays booked until you decide */
async function noSitter(p, { night, pick, asked }){
  const left = Object.keys(SITTERS).filter(n => !asked.includes(n));
  await p.say(`${joinNames(asked)} can’t do ${night.long.split(',')[0]}.${pick ? ` Your table at ${pick.place.n} is still booked, free to cancel until ${night.cancel}.` : ''}`, 1000);
  p.set('No sitter yet', { when:night.short, attn:false });
  const k = await p.chips([left.length ? `Ask ${joinNames(left)}` : 'Ask class families', 'Ask class families', pick ? 'Cancel the table' : 'Call off the night'].filter((x, i, a) => a.indexOf(x) === i), { stub:left.length ? [1] : [0] });
  if (k === 0 && left.length) return left;
  const w = p.work(pick ? `Cancelling ${pick.place.n}` : 'Closing the sitter requests', night.day); await sleep(1200);
  w.done(pick ? 'Table cancelled · no fee' : 'Requests closed', night.day, 'ph-x-circle');
  p.set('Called off', { done:true });
  await p.say('Done. Nothing else is booked. Want me to look at Friday instead?', 800);
  await p.chips(['Try Friday', 'Not now'], { stub:[0] });
  return null;
}
async function waitForReplies(p, asked, night, ev, yesOverride){
  const yes = (yesOverride || asked.filter(n => !CANT.includes(n)));
  await p.say(`Sent. You can close Sprout. I’ll tell you when someone answers, and I won’t book anyone without your OK.`, 900);
  await later(p, { status:'Waiting for sitters', small:`${night.day} · ${ev.label}`, ms:3500,
    title: yes.length ? (yes.length > 1 ? `${joinNames(yes)} are free` : `${yes[0]} is free`) : 'Your sitters replied',
    body: yes.length ? `For your night out, ${night.day}` : 'Open Assist to see their answers' });
  return yes;
}

/* ======================= A · step by step (Tony's order, one question at a time) ======================= */
X.flows.dateA = async p => {
  await p.say('A date night, love it. Which night? You and Dana are both free Friday and Saturday evening.', 1000);
  const n = await p.chips(['Fri, Jul 31', 'Sat, Aug 1', 'Another night'], { stub:[2] });
  const night = n === 0 ? NIGHTS.fri : NIGHTS.sat; sub(p, `Date night · ${night.day}`); p.title = `Date night · ${night.day}`;
  await p.say('What are you in the mood for?', 700);
  await p.chips(['Somewhere new', 'A place we like', 'Surprise me']);
  const w = p.work('Checking tables for 2', `${night.day} · near home`); await sleep(1400);
  w.done('3 places have tables', `${night.day} · 6:30 to 8:30 PM`, 'ph-fork-knife');
  await p.say('Pick a time. All three are free to cancel until the evening before, so it’s safe to book before we find a sitter.', 1100);
  p.set('Pick a table', { when:night.short });
  const pick = await placeCard(p, { night });
  await bookTable(p, night, pick);
  const ev = evening(pick.time);
  await p.say(`Dinner at ${clock(mins(pick.time))}. With the drive, I’ll ask a sitter for ${ev.label}.`, 900);
  const card = p.block(`<div class="card">
    <div class="ctop"><span class="icotile"><i class="ph ph-baby"></i></span><div><div class="eyebrow">Sitter request</div><div class="ttl">${night.long}</div></div></div>
    <div class="fields">${[{ l:'When', v:`${night.day} · ${ev.label}`, s:`30 min before you leave, until you’re home` }, { l:'Children', v:'Maya, 7 · Jake, 5' }, { l:'Where', v:'Our home · address shared after booking' }].map(f => fieldRow(f)).join('')}</div>
    <div class="qwrap"></div></div>`).querySelector('.card');
  editHint(card);
  await ask(p, card, 'Does the evening look right?', ['Looks right', 'Change the time'], { 1:'Tap a pencil to change a row (not part of this demo)' });
  card.querySelector('.qwrap').innerHTML = '';
  await p.say('Who should I ask?', 600);
  let asked = await sitterPicker(p);
  for (;;) {
    await sendToSitters(p, asked, night, ev);
    p.set('Waiting for sitters', { when:night.short });
    const yes = await waitForReplies(p, asked, night, ev);
    if (yes.length) {
      for (;;) {
        await p.say(`${joinNames(yes)} ${yes.length > 1 ? 'can both' : 'can'} do ${ev.label}. Who should I confirm?`, 900);
        p.block(`<div class="card"><div class="fields" style="margin-top:0">${asked.map(nm => `<div class="field">${mono(nm)}<div style="margin-left:10px"><div class="v" style="margin:0">${nm} · ${yes.includes(nm) ? 'free' : 'can’t make it'}</div><div class="fs">${yes.includes(nm) ? `$${SITTERS[nm].rate}/hour · about $${est(nm, ev)} · ${SITTERS[nm].times}` : 'Away that weekend'}</div></div></div>`).join('')}</div></div>`);
        p.set('Choose a sitter', { when:night.short });
        const i = await p.chips(yes.map(nm => 'Choose ' + nm));
        const name = yes[i];
        if (!await confirmNight(p, { name, night, ev, pick })) continue;
        await later(p, { status:`${name} · confirmation requested`, small:`${night.day} · ${ev.label}`, ms:2600, title:`${name} confirmed`, body:'Your date night is set' });
        p.note(`${name} · confirmed`, `${night.day} · ${ev.label}`, 'ph-calendar-check');
        const others = asked.filter(x => x !== name && yes.includes(x));
        await p.say(`${name} confirmed. ${others.length ? `I let ${joinNames(others)} know the night is covered. ` : ''}Your night is set.`, 900);
        return summary(p, { name, night, ev, pick });
      }
    }
    const more = await noSitter(p, { night, pick, asked });
    if (!more) return;
    p.me('Ask ' + joinNames(more)); asked = more;
  }
};

/* ======================= B · one plan card that fills in ======================= */
X.flows.dateB = async p => {
  await p.say('Date night. I’ll build it in one plan: answer a few taps, then I book dinner and find the sitter.', 1000);
  const c = p.block(`<div class="card">
    <div class="ctop"><span class="icotile"><i class="ph ph-moon-stars"></i></span><div><div class="eyebrow">Date night · your plan</div><div class="ttl">Night out for you and Dana</div></div></div>
    <div class="fields"></div><div class="qwrap"></div><div class="prog"></div></div>`).querySelector('.card');
  const n = await ask(p, c, 'Which night? You and Dana are both free Friday and Saturday.', ['Fri, Jul 31', 'Sat, Aug 1']);
  const night = n === 0 ? NIGHTS.fri : NIGHTS.sat; sub(p, `Date night · ${night.day}`); p.title = `Date night · ${night.day}`;
  addField(c, { l:'Night', v:night.day, s:'You and Dana are both free' });
  const hb = await ask(p, c, 'Home by?', ['10 PM', '10:30 PM', '11 PM']);
  const homeBy = ['10:00', '10:30', '11:00'][hb];
  addField(c, { l:'Home by', v:['10 PM', '10:30 PM', '11 PM'][hb] });
  const d = await ask(p, c, 'Dinner too?', ['Somewhere new', 'A place we like', 'No dinner, just a sitter']);
  addField(c, { l:'Dinner', v:['Somewhere new', 'A place we like', 'No dinner'][d], s:d < 2 ? 'Table for 2, near home' : 'Sitter only' });
  const s = await ask(p, c, 'Who should I ask to sit? Each gets a separate message.', ['Alex, Sam and Riley', 'Just Alex', 'Just Riley']);
  let asked = [['Alex', 'Sam', 'Riley'], ['Alex'], ['Riley']][s];
  addField(c, { l:'Sitter', v:joinNames(asked), s:'From your saved sitters' });
  c.querySelector('.qwrap').innerHTML = '';
  editHint(c);
  /* progress rows inside the card: what Sprout is doing, line by line */
  const setSitter = (v, sm) => { const r = [...c.querySelectorAll('.field')].find(x => x.querySelector('.l')?.textContent === 'Sitter'); if (r) { r.querySelector('.v').textContent = v; r.querySelector('.fs').textContent = sm; } };
  const prog = c.querySelector('.prog');
  const row = (k, html) => { let r = prog.querySelector(`[data-r=${k}]`); if (!r) { r = prog.appendChild(el(`<div data-r="${k}" style="margin-top:8px"></div>`)); } r.innerHTML = html; p.scroll(); return r; };
  const spin = (t, sm) => `<div class="status"><span class="spinner"></span><div>${t}<small>${sm}</small></div></div>`;
  const ok = (t, sm, icon) => `<div class="status"><span class="icotile"><i class="ph ${icon}"></i></span><div>${t}<small>${sm}</small></div><i class="ph-bold ph-check end"></i></div>`;
  const off = (t, sm) => `<div class="status"><span class="icotile"><i class="ph ph-x"></i></span><div>${t}<small>${sm}</small></div></div>`;
  await sleep(300);
  let pick = null;
  if (d < 2) {
    row('dinner', spin('Finding a table for 2', `${night.day} · back by ${clock(mins(homeBy))} PM`)); await sleep(1400);
    row('dinner', `<div class="q" style="margin-top:0"><p>Three places fit. Pick one; I’ll book the time that gets you home by ${clock(mins(homeBy))}.</p></div>
      <div class="fields" style="margin-top:8px">${PLACES.map((pl, i) => `<button class="pick" data-i="${i}">${mono(pl.n)}<span class="ptx">${pl.n} · ${pl.best} PM<small>${pl.s}</small></span><span class="cb rd"><i class="ph-bold ph-check"></i></span></button>`).join('')}</div>
      <div class="two" style="margin-top:10px"><button class="btn ghost" data-det>Details</button><button class="btn" data-go disabled>Pick a place</button></div>`);
    p.set('Pick a place', { when:night.short });
    pick = await new Promise(res => {
      const r = prog.querySelector('[data-r=dinner]'); let i = -1; const go = r.querySelector('[data-go]');
      r.querySelectorAll('.pick').forEach(b => b.onclick = () => { i = +b.dataset.i; r.querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === b)); go.disabled = false; go.textContent = `Book ${PLACES[i].best} PM`; });
      r.querySelector('[data-det]').onclick = () => i < 0 ? toast('Pick a place to see its details') : placeDetails(PLACES[i]);
      go.onclick = () => { if (i < 0) return; p.me(`Book ${PLACES[i].n} · ${PLACES[i].best} PM`); res({ place:PLACES[i], time:PLACES[i].best }); };
    });
    row('dinner', spin(`Booking ${pick.place.n}`, `${night.day} · ${pick.time} PM`)); await sleep(1300);
    row('dinner', ok(`${pick.place.n} · ${pick.time} PM`, `Booked · free to cancel until ${night.cancel}`, 'ph-fork-knife'));
  }
  const ev = evening(pick ? pick.time : '6:30', homeBy);
  for (;;) {
    row('sitter', spin(`Asking ${joinNames(asked)}`, `${night.day} · ${ev.label} · separate messages`));
    p.set('Waiting for sitters', { when:night.short });
    await p.say(`I asked ${joinNames(asked)} for ${ev.label}. You can close Sprout; this card keeps updating.`, 900);
    await later(p, { status:'Waiting for sitters', small:`${night.day} · ${ev.label}`, ms:3500,
      title: asked.some(x => !CANT.includes(x)) ? 'A sitter is free' : 'Your sitter replied', body:`Date night · ${night.day}` });
    const yes = asked.filter(x => !CANT.includes(x));
    if (!yes.length) {
      row('sitter', off(`${joinNames(asked)} can’t make it`, `${night.day} · away that weekend`));
      const left = Object.keys(SITTERS).filter(x => !asked.includes(x));
      await p.say(`${joinNames(asked)} can’t make it.${pick ? ` Your table is still booked, free to cancel until ${night.cancel}.` : ''}`, 900);
      const k = await ask(p, c, 'What should I do?', [`Ask ${joinNames(left)}`, 'Ask class families', pick ? 'Cancel the night' : 'Call it off'], { 1:'Same as the Class-family sitters flow' });
      c.querySelector('.qwrap').innerHTML = '';
      if (k === 0) { p.me(`Ask ${joinNames(left)}`); asked = left; setSitter(joinNames(left), `${joinNames(CANT)} can’t make it`); continue; }
      p.me(pick ? 'Cancel the night' : 'Call it off');
      if (pick) { row('dinner', spin(`Cancelling ${pick.place.n}`, night.day)); await sleep(1100); row('dinner', off(`${pick.place.n} · cancelled`, 'No fee')); }
      row('sitter', off('Sitter requests closed', night.day));
      c.querySelector('.ttl').textContent = 'Night called off'; p.set('Called off', { done:true });
      await p.say('Called off. Nothing is booked.', 700); return;
    }
    row('sitter', `<div class="status"><span class="icotile"><i class="ph ph-baby"></i></span><div>${joinNames(yes)} ${yes.length > 1 ? 'are' : 'is'} free<small>${yes.map(x => `${x} $${SITTERS[x].rate}/hr`).join(' · ')}${asked.filter(x => CANT.includes(x)).length ? ' · Riley can’t' : ''}</small></div></div>`);
    let name = yes[0];
    if (yes.length > 1) { const i = await ask(p, c, 'Who should I confirm?', yes.map(x => `${x} · about $${est(x, ev)}`)); name = yes[i]; c.querySelector('.qwrap').innerHTML = ''; }
    await p.say(`Here’s the night. Confirm and I’ll lock in ${name}.`, 800);
    if (!await confirmNight(p, { name, night, ev, pick })) { asked = yes; continue; }
    row('sitter', spin(`${name} · confirmation requested`, ev.label));
    await later(p, { status:`${name} · confirmation requested`, small:`${night.day} · ${ev.label}`, ms:2600, title:`${name} confirmed`, body:'Your date night is set' });
    row('sitter', ok(`${name} · ${ev.label}`, `Confirmed · about $${est(name, ev)}, paid to ${name}`, 'ph-baby'));
    setSitter(name, `${ev.label} · confirmed`);
    c.querySelector('.ttl').textContent = 'Your night is set';
    p.set(`${pick ? pick.place.n + ' ' + pick.time + ' · ' : ''}${name} ${ev.label}`, { when:night.short, done:true });
    await p.say(`${name} confirmed. Both are on the family calendar, so Dana has it too.`, 900);
    const e = await p.chips(['Text Dana the plan', 'Done']);

  const c = p.block(`<div class="card">
    <div class="ctop"><span class="icotile"><i class="ph ph-moon-stars"></i></span><div><div class="eyebrow">Suggested · ${night.day}</div><div class="ttl">Date night</div></div></div>

  p.set('Date night idea', { when:'Sat' });
  const k = await p.chips(['Book it', 'Other options', 'Not this week'], { into:c });
  if (k === 2) {
    await p.say('Okay, nothing booked. Should I suggest one again next week?', 800);

    return;
  }
  let pick = pick0, ev = ev0, asked = ['Alex'];
  if (k === 1) {
    await p.say('Here are the other open tables Saturday. Pick a time, then the sitter.', 900);
    pick = await placeCard(p, { night }); ev = evening(pick.time);

    asked = await sitterPicker(p);
  }
  await bookTable(p, night, pick);

  /* the suggested sitter can say no: Alex is busy, so Sprout offers the next sitters */
  let yes = await waitForReplies(p, asked, night, ev, k === 0 ? [] : null);

  p.note(`${name} · confirmed`, `${night.day} · ${ev.label}`, 'ph-calendar-check');
  await p.say(`${name} confirmed. Your night is set.`, 800);
  return summary(p, { name, night, ev, pick });
};

<script>

const PLACES = {

/* ---------- the map: photo pins + home; gliding = translating the layer so the pick sits in the middle ---------- */
function mapHtml(keys, sel, labels, others = []){
  return `<div class="dnmap"><div class="dnlayer">
