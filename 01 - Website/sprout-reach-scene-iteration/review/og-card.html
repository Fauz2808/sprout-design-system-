<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sprout link card</title>
<!-- The link preview (og:image) for joinsprout.co, 1200x630 (Tony, 10 Oct: "a better link when we send our website in
     iMessage"). His card is the framework: logo, "Your school's parent community.", the daily plan line, a phone with
     Today. The phone is the site's own Daily Brief, photographed by review/make-og.mjs into assets/og/brief-phone.png.
     Don't edit the PNG; edit this and run: node review/make-og.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root { --green: #186338; --deep: #0d3f22; --cream: #f4f1ea; --mint: #b8e0a0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--deep); }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(620px 520px at 960px 140px, rgb(120 190 120 / .30), transparent 70%),
      radial-gradient(900px 700px at -80px 700px, rgb(4 30 16 / .55), transparent 70%),
      linear-gradient(135deg, #1a6a3c 0%, #145530 45%, #0d3f22 100%); }
  /* a faint dot grid, so the green reads as a surface and not a flat fill */
  .card::before { content: ""; position: absolute; inset: 0; opacity: .09;
    background-image: radial-gradient(rgb(255 255 255) 1px, transparent 1.4px); background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(100deg, #000 0%, transparent 62%); mask-image: linear-gradient(100deg, #000 0%, transparent 62%); }

  .copy { position: absolute; left: 80px; top: 72px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Playfair Display", serif; font-weight: 600; font-size: 34px; color: var(--cream); }
  .brand img { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 6px 16px -6px rgb(0 0 0 / .45); }
  h1 { margin: 58px 0 0; font-family: "Playfair Display", serif; font-weight: 600; font-size: 72px; line-height: 1.04; letter-spacing: -0.01em; color: #fffdf8; }
  .plus { margin: 22px 0 0; max-width: 520px; font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 34px; line-height: 1.22; color: var(--mint); }
  .foot { position: absolute; left: 80px; bottom: 56px; display: flex; align-items: center; gap: 12px; font-family: Inter, sans-serif; font-weight: 500; font-size: 21px; color: rgb(244 241 234 / .78); }
  .foot b { font-weight: 600; color: var(--cream); }
  .foot i { width: 5px; height: 5px; border-radius: 50%; background: rgb(244 241 234 / .5); }

  /* the phone: the site's real Daily Brief, cut off by the bottom edge like Tony's */
  .phone { position: absolute; left: 790px; top: 64px; width: 360px; filter: drop-shadow(0 30px 40px rgb(0 0 0 / .38)); }
  /* the photo is square-cornered (the page is cream behind the phone): round it to the site's own phone radius */
  .phone img { display: block; width: 100%; border-radius: 14% / 6.46%; box-shadow: 0 0 0 4px rgb(255 253 248 / .16); }
  /* the mascot, on the phone's edge, the same circle the website header uses */
  .orb { position: absolute; left: 738px; top: 446px; width: 104px; height: 104px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #fffdf8 0%, #f4ecda 100%);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .9), 0 16px 30px -10px rgb(0 0 0 / .5); overflow: hidden; }
  .orb img { position: absolute; inset: 10% 12% 2%; width: 76%; height: 88%; object-fit: contain; }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <div class="brand"><img src="../assets/logo.png" alt="" />Sprout</div>
      <h1>Your school’s parent community.</h1>
      <p class="plus">Plus a daily plan that does the remembering.</p>
    </div>
    <div class="foot"><b>joinsprout.co</b><i></i><span>Free for parents</span></div>
    <div class="phone"><img src="../assets/og/brief-phone.png" alt="" /></div>
    <div class="orb"><img src="../assets/mascot/sprout-happy.webp" alt="" /></div>
  </div>
</body>
</html>
