<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Upload · Sprout</title>
  <style>
    :root {
      --bg:      #faf8f4;
      --surface: #ffffff;
      --fg:      #1a1916;
      --muted:   #8a8780;
      --border:  #e8e5df;
      --accent:  #2D6A4F;

      --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;

      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%,
        color-mix(in oklch, var(--accent) 5%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
      min-height: 100vh;
    }

    /* ── caption ── */
    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    /* ── device frame ── */
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px; bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    /* Dynamic Island */
    .island {
      position: absolute;
      top: 22px; left: 50%;
      transform: translateX(-50%);
      width: 124px; height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    /* hardware buttons */
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    /* ── screen ── */
    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* status bar */
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px; font-weight: 600;
      color: var(--fg); letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    /* content */
    .content {
      flex: 1 1 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* home indicator */
    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    /* ── screen-specific ── */

    .nav-bar {
      padding: 8px 20px 0;
      display: flex;
      align-items: center;
    }

    .close-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .close-btn svg { width: 16px; height: 16px; stroke: var(--fg); fill: none; stroke-width: 2; }

    /* photo crop area */
    .photo-wrap {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      margin: 8px 0 0;
    }

    .photo-placeholder {
      width: 100%; height: 100%;
      background:
        /* simulated photo — warm skin-toned gradient */
        linear-gradient(180deg,
          #c8dce8 0%,
          #b8ccd8 20%,
          #e8d4c0 40%,
          #d4b898 55%,
          #8a6c5a 70%,
          #4a3428 100%
        );
      position: relative;
    }

    /* 3×3 crop grid */
    .crop-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .crop-grid line {
      stroke: rgba(255,255,255,0.55);
      stroke-width: 0.8;
    }

    /* bottom action bar */
    .action-bar {
      flex: 0 0 auto;
      padding: 14px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
    }

    /* retry button */
    .retry-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: opacity 0.3s;
    }
    .retry-btn svg {
      width: 20px; height: 20px;
      stroke: var(--muted); fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .retry-btn.disabled { opacity: 0.4; pointer-events: none; }

    /* ── Upload progress button ── */
    .upload-btn {
      flex: 1;
      height: 52px;
      border-radius: 999px;
      background: var(--accent);
      border: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    /* animated fill track */
    .upload-btn__track {
      position: absolute;
      inset: 0;
      background: color-mix(in oklch, #000 20%, var(--accent));
      border-radius: inherit;
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    /* label / percentage */
    .upload-btn__label {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .upload-btn__text {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.005em;
    }
    .upload-btn__pct {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.01em;
    }

    /* progress bar under the button (alternative pill bar) */
    .progress-pill {
      position: absolute;
      bottom: 7px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: rgba(255,255,255,0.22);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-pill__fill {
      height: 100%;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* done state */
    .upload-btn.done .upload-btn__track {
      transform: scaleX(1);
      background: color-mix(in oklch, #000 10%, var(--accent));
      transition: transform 0.3s ease;
    }

    /* ── stage 2: idle Post button ── */
    .post-btn {
      flex: 1;
      height: 52px;
      border-radius: 999px;
      background: var(--accent);
      border: 0;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.005em;
      display: none;
    }

    /* ── state toggle for demo ── */
    .demo-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .demo-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .demo-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Sprout</strong> · Photo Upload — Progress Bar</div>

    <div class="device">
      <span class="btn-rail left-1"  aria-hidden></span>
      <span class="btn-rail left-2"  aria-hidden></span>
      <span class="btn-rail left-3"  aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island"           aria-hidden></span>

      <div class="screen">
        <!-- status bar -->
        <div class="statusbar">
          <span class="num">3:10</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0"  y="7" width="3" height="4" rx="0.6"/>
              <rect x="4"  y="5" width="3" height="6" rx="0.6"/>
              <rect x="8"  y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <!-- nav -->
        <div class="nav-bar">
          <button class="close-btn" aria-label="Go back">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>

        <!-- photo crop -->
        <div class="content">
          <div class="photo-wrap">
            <div class="photo-placeholder">
              <!-- 3×3 crop grid SVG -->
              <svg class="crop-grid" viewBox="0 0 366 540" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <!-- vertical lines at 1/3 and 2/3 -->
                <line x1="122" y1="0" x2="122" y2="540"/>
                <line x1="244" y1="0" x2="244" y2="540"/>
                <!-- horizontal lines at 1/3 and 2/3 -->
                <line x1="0" y1="180" x2="366" y2="180"/>
                <line x1="0" y1="360" x2="366" y2="360"/>
              </svg>
            </div>
          </div>

          <!-- action bar -->
          <div class="action-bar">
            <!-- retry/change photo -->
            <button class="retry-btn disabled" id="retryBtn" aria-label="Choose different photo">
              <svg viewBox="0 0 24 24">
                <path d="M1 4v6h6"/>
                <path d="M23 20v-6h-6"/>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
              </svg>
            </button>

            <!-- upload progress button -->
            <button class="upload-btn" id="uploadBtn" aria-label="Uploading photo">
              <div class="upload-btn__track" id="uploadTrack"></div>
              <div class="upload-btn__label">
                <span class="upload-btn__text" id="uploadText">Uploading…</span>
                <span class="upload-btn__pct num" id="uploadPct">0%</span>
              </div>
              <div class="progress-pill">
                <div class="progress-pill__fill" id="pillFill"></div>
              </div>
            </button>
          </div>
        </div>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>

    <!-- demo controls outside the phone -->
    <div class="demo-controls">
      <button class="demo-btn" onclick="restartUpload()">↺ Replay upload</button>
      <button class="demo-btn" onclick="jumpToComplete()">⚡ Jump to done</button>
    </div>
  </div>

  <script>
    const track    = document.getElementById('uploadTrack');
    const pillFill = document.getElementById('pillFill');
    const pctLabel = document.getElementById('uploadPct');
    const textLabel= document.getElementById('uploadText');
    const retryBtn = document.getElementById('retryBtn');
    const uploadBtn= document.getElementById('uploadBtn');

    let pct = 0;
    let timer = null;

    function setProgress(value) {
      pct = Math.min(100, Math.max(0, value));
      const p = pct / 100;

      // scale the dark overlay from left
      track.style.transform = `scaleX(${p})`;
      // pill
      pillFill.style.width = pct + '%';
      // label
      pctLabel.textContent = pct + '%';

      if (pct >= 100) {
        textLabel.textContent = 'Posted ✓';
        pctLabel.textContent  = '';
        uploadBtn.classList.add('done');
        retryBtn.classList.remove('disabled');
      } else {
        uploadBtn.classList.remove('done');
      }
    }

    function restartUpload() {
      clearInterval(timer);
      retryBtn.classList.add('disabled');
      setProgress(0);
      uploadBtn.classList.remove('done');
      textLabel.textContent = 'Uploading…';

      // staggered acceleration curve: slow start, fast middle, slow end
      const steps = [
        { target: 15,  delay: 220 },
        { target: 30,  delay: 180 },
        { target: 48,  delay: 150 },
        { target: 63,  delay: 200 },
        { target: 75,  delay: 160 },
        { target: 85,  delay: 250 },
        { target: 92,  delay: 300 },
        { target: 97,  delay: 400 },
        { target: 100, delay: 500 },
      ];

      let i = 0;
      function tick() {
        if (i >= steps.length) return;
        const s = steps[i++];
        setProgress(s.target);
        if (i < steps.length) timer = setTimeout(tick, s.delay);
      }
      timer = setTimeout(tick, 300);
    }

    function jumpToComplete() {
      clearInterval(timer);
      setProgress(100);
      retryBtn.classList.remove('disabled');
    }

    // auto-start on load
    window.addEventListener('load', () => setTimeout(restartUpload, 600));
  </script>
</body>
</html>
