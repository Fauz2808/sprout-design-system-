<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout — Feature Graphic Preview</title>
<style>
  body{margin:0;background:#15211b;color:#e9efe9;font-family:-apple-system,Inter,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px 60px;}
  h1{font-weight:600;font-size:20px;letter-spacing:.2px;margin:0 0 4px;}
  p{color:#9ecbb1;font-size:13px;margin:0 0 28px;}
  .card{margin:0 0 34px;}
  .label{font-size:12px;color:#9ecbb1;letter-spacing:.15em;text-transform:uppercase;margin:0 0 10px;}
  img{display:block;width:1024px;max-width:92vw;height:auto;border-radius:12px;
      box-shadow:0 18px 50px rgba(0,0,0,.5);}
  .meta{font-size:11px;color:#7d9488;margin-top:8px;}
</style>
</head>
<body>
  <h1>Sprout — Play Store Feature Graphic</h1>
  <p>1024 × 500 px · PNG · &lt; 15 MB</p>

  <div class="card">
    <div class="label">Option A — Dark Forest</div>
    <img src="./sprout-feature-graphic.png" alt="Sprout feature graphic — dark">
    <div class="meta">sprout-feature-graphic.png</div>
  </div>

  <div class="card">
    <div class="label">Option B — Light Cream</div>
    <img src="./sprout-feature-graphic-light.png" alt="Sprout feature graphic — light">
    <div class="meta">sprout-feature-graphic-light.png</div>
  </div>
</body>
</html>
