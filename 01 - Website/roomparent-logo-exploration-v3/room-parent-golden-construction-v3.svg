<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Room Parent logo golden-ratio construction</title>
  <desc id="desc">Presentation board showing the final mark, lockup, ratio circles, baseline, and small-size tests.</desc>
  <rect width="2400" height="1500" fill="#F5F1E8"/>
  <g fill="#245C43" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="140" y="150" font-size="64" font-weight="600">Room Parent</text>
    <text x="140" y="215" font-size="28" font-weight="500" opacity=".7">GOLDEN RATIO CONSTRUCTION  •  V3</text>
  </g>

  <!-- Final mark -->
  <g transform="translate(90 285) scale(.82)">
    <g fill="#245C43">
      <circle cx="300" cy="134" r="97.08"/>
      <circle cx="724" cy="310" r="60"/>
      <path d="M100 850V490 C100 350 206 245 340 245 C445 245 535 305 585 395 C600 422 589 455 562 467 L425 526 C370 550 340 598 340 660 V850 C340 883 323 900 290 900 H150 C117 900 100 883 100 850Z"/>
      <path d="M712 900 C679 900 662 883 662 850 V665 C662 612 631 573 585 552 L538 531 C507 517 502 476 531 459 C578 431 632 414 694 414 C797 414 860 496 860 604 V850 C860 883 843 900 810 900Z"/>
    </g>
  </g>

  <!-- Construction diagram -->
  <g transform="translate(1240 285) scale(.82)">
    <g fill="#245C43" opacity=".12">
      <circle cx="300" cy="134" r="97.08"/>
      <circle cx="724" cy="310" r="60"/>
      <path d="M100 850V490 C100 350 206 245 340 245 C445 245 535 305 585 395 C600 422 589 455 562 467 L425 526 C370 550 340 598 340 660 V850 C340 883 323 900 290 900 H150 C117 900 100 883 100 850Z"/>
      <path d="M712 900 C679 900 662 883 662 850 V665 C662 612 631 573 585 552 L538 531 C507 517 502 476 531 459 C578 431 632 414 694 414 C797 414 860 496 860 604 V850 C860 883 843 900 810 900Z"/>
    </g>
    <g fill="none" stroke="#D39B3C" stroke-width="4">
      <circle cx="300" cy="134" r="97.08"/>
      <circle cx="724" cy="310" r="60"/>
      <circle cx="340" cy="490" r="240"/>
      <circle cx="694" cy="604" r="148.33"/>
      <line x1="70" y1="900" x2="900" y2="900"/>
      <line x1="300" y1="25" x2="300" y2="235" stroke-dasharray="12 12"/>
      <line x1="724" y1="235" x2="724" y2="382" stroke-dasharray="12 12"/>
    </g>
    <g fill="#8A6425" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600">
      <text x="120" y="105">φr = 97.08</text>
      <text x="755" y="302">r = 60</text>
      <text x="78" y="948">SHARED BASELINE</text>
      <text x="445" y="770">240 : 148.33 = 1.618</text>
    </g>
  </g>

  <!-- Horizontal lockup -->
  <g transform="translate(130 1110)">
    <g transform="scale(.31)">
      <g fill="#245C43">
        <circle cx="300" cy="134" r="97.08"/>
        <circle cx="724" cy="310" r="60"/>
        <path d="M100 850V490 C100 350 206 245 340 245 C445 245 535 305 585 395 C600 422 589 455 562 467 L425 526 C370 550 340 598 340 660 V850 C340 883 323 900 290 900 H150 C117 900 100 883 100 850Z"/>
        <path d="M712 900 C679 900 662 883 662 850 V665 C662 612 631 573 585 552 L538 531 C507 517 502 476 531 459 C578 431 632 414 694 414 C797 414 860 496 860 604 V850 C860 883 843 900 810 900Z"/>
      </g>
    </g>
    <text x="300" y="210" fill="#245C43" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="170" font-weight="600" letter-spacing="-5">Room Parent</text>
  </g>

  <!-- Small-size tests -->
  <g transform="translate(1770 1115)" fill="#245C43">
    <g transform="scale(.16)">
      <circle cx="300" cy="134" r="97.08"/><circle cx="724" cy="310" r="60"/>
      <path d="M100 850V490 C100 350 206 245 340 245 C445 245 535 305 585 395 C600 422 589 455 562 467 L425 526 C370 550 340 598 340 660 V850 C340 883 323 900 290 900 H150 C117 900 100 883 100 850Z"/>
      <path d="M712 900 C679 900 662 883 662 850 V665 C662 612 631 573 585 552 L538 531 C507 517 502 476 531 459 C578 431 632 414 694 414 C797 414 860 496 860 604 V850 C860 883 843 900 810 900Z"/>
    </g>
    <g transform="translate(210 70) scale(.08)">
      <circle cx="300" cy="134" r="97.08"/><circle cx="724" cy="310" r="60"/>
      <path d="M100 850V490 C100 350 206 245 340 245 C445 245 535 305 585 395 C600 422 589 455 562 467 L425 526 C370 550 340 598 340 660 V850 C340 883 323 900 290 900 H150 C117 900 100 883 100 850Z"/>
      <path d="M712 900 C679 900 662 883 662 850 V665 C662 612 631 573 585 552 L538 531 C507 517 502 476 531 459 C578 431 632 414 694 414 C797 414 860 496 860 604 V850 C860 883 843 900 810 900Z"/>
    </g>
  </g>
  <g fill="#245C43" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600">
    <text x="1790" y="1400">64 PX</text>
    <text x="1985" y="1400">32 PX</text>
  </g>
</svg>
