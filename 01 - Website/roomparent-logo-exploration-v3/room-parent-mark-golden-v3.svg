<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Room Parent family mark</title>
  <desc id="desc">A geometric adult and child leaning toward a shared opening, constructed with golden-ratio proportions.</desc>
  <g fill="#245C43">
    <!-- Head diameters: adult 194.16, child 120. Ratio = 1.618. -->
    <circle cx="300" cy="134" r="97.08"/>
    <circle cx="724" cy="310" r="60"/>

    <!-- Adult body. Main width module 240. Child width module 148.33. Ratio = 1.618. -->
    <path d="M100 850V490
             C100 350 206 245 340 245
             C445 245 535 305 585 395
             C600 422 589 455 562 467
             L425 526
             C370 550 340 598 340 660
             V850
             C340 883 323 900 290 900
             H150
             C117 900 100 883 100 850Z"/>

    <!-- Child body. The inward shoulder overlaps the adult arm to create one shared bridge. -->
    <path d="M712 900
             C679 900 662 883 662 850
             V665
             C662 612 631 573 585 552
             L538 531
             C507 517 502 476 531 459
             C578 431 632 414 694 414
             C797 414 860 496 860 604
             V850
             C860 883 843 900 810 900Z"/>
  </g>
</svg>
