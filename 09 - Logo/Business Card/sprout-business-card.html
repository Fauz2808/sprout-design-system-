<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sprout Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#0b0f0c;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;}

  .card{
    position:relative;
    width:600px; height:1050px;
    background:#1e3e2b;
    border-radius:56px;
    overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.5);
  }

  /* grain texture */
  .grain{
    position:absolute; inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    opacity:.55;
    pointer-events:none;
    z-index:1;
  }

  /* radial glow behind the logo */
  .glow{
    position:absolute;
    top:-40px; left:50%;
    transform:translateX(-50%);
    width:520px; height:520px;
    background:radial-gradient(circle, rgba(87,154,116,0.22) 0%, transparent 65%);
    pointer-events:none;
    z-index:1;
  }

  /* faint orbiting ring, partially off-canvas */
  .ring{
    position:absolute;
    width:460px; height:460px;
    border:1px solid rgba(244,241,234,0.10);
    border-radius:50%;
    top:-140px; right:-160px;
    z-index:1;
  }
  .ring2{
    position:absolute;
    width:300px; height:300px;
    border:1px solid rgba(244,241,234,0.07);
    border-radius:50%;
    bottom:60px; left:-140px;
    z-index:1;
  }

  .content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 48px 56px;
  }

  /* logo lockup */
  .logo{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:64px;
  }
  .logo-icon{
    width:60px; height:60px;
    border-radius:17px;
    background:linear-gradient(155deg,#faf8f3,#ece6d8);
    box-shadow:0 6px 16px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .logo-name{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:40px;
    letter-spacing:-0.5px;
    color:#f4f1ea;
  }

  /* tagline / headline — sized like the headline on our app screenshot pages */
  .tagline{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:60px;
    line-height:1.05;
    letter-spacing:-1.5px;
    text-align:center;
    color:#f4f1ea;
    margin-bottom:56px;
    max-width:480px;
  }
  .tagline .it{ font-style:italic; font-weight:700; }

  .divider{
    width:120px; height:1px;
    background:rgba(244,241,234,0.16);
    margin-bottom:auto;
  }

  /* qr block */
  .qr-wrap{
    width:264px; height:264px;
    background:#f4f1ea;
    border-radius:22px;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);
    margin-bottom:34px;
  }
  .qr-wrap img{ width:100%; height:100%; display:block; }

  .url{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(244,241,234,0.72);
    margin-bottom:14px;
  }
  .contact{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:14.5px;
    color:rgba(244,241,234,0.42);
    letter-spacing:0.2px;
  }
  .contact .dot{ margin:0 8px; color:rgba(244,241,234,0.28); }
</style>
</head>
<body>

<div class="card">
  <div class="grain"></div>
  <div class="glow"></div>
  <div class="ring"></div>
  <div class="ring2"></div>

  <div class="content">
    <div class="logo">
      <div class="logo-icon">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
          <ellipse cx="24" cy="13" rx="9" ry="11" fill="#1e3e2b"/>
          <ellipse cx="35" cy="24" rx="11" ry="9" fill="#1e3e2b"/>
          <ellipse cx="24" cy="35" rx="9" ry="11" fill="#1e3e2b"/>
          <ellipse cx="13" cy="24" rx="11" ry="9" fill="#1e3e2b"/>
          <circle cx="24" cy="24" r="9" fill="#1e3e2b"/>
          <ellipse cx="24" cy="13" rx="5" ry="6" fill="#186338"/>
          <ellipse cx="35" cy="24" rx="6" ry="5" fill="#186338"/>
          <ellipse cx="24" cy="35" rx="5" ry="6" fill="#186338"/>
          <ellipse cx="13" cy="24" rx="6" ry="5" fill="#186338"/>
          <path d="M24 32 L24 44" stroke="#134f2d" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="3.5" fill="#134f2d"/>
        </svg>
      </div>
      <div class="logo-name">Sprout</div>
    </div>

    <div class="tagline">The <span class="it">Super App</span><br>for Parents</div>

    <div class="divider"></div>

    <div class="qr-wrap"><img src="qr_brand.png" alt="joinsprout.co QR code"></div>
    <div class="url">joinsprout.co</div>
    <div class="contact">(805) 680-6295<span class="dot">·</span>tony@joinsprout.co</div>
  </div>
</div>

</body>
</html>
