<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Hero gradient: deep forest top → brand green bottom -->
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0f2218"/>
      <stop offset="55%"  stop-color="#1e3e2b"/>
      <stop offset="100%" stop-color="#186338"/>
    </linearGradient>

    <!-- Hero → background blend zone -->
    <linearGradient id="heroBlend" x1="0" y1="195" x2="0" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#186338"/>
      <stop offset="100%" stop-color="#f4f1ea"/>
    </linearGradient>

    <!-- Radial glow in hero (top-left warmth) -->
    <radialGradient id="heroGlow" cx="25%" cy="25%" r="65%">
      <stop offset="0%"   stop-color="#579a74" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#186338" stop-opacity="0"/>
    </radialGradient>

    <!-- Profile photo placeholder gradient -->
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9aa0ad"/>
      <stop offset="100%" stop-color="#4d525b"/>
    </linearGradient>

    <!-- Card drop-shadow filter -->
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Photo drop-shadow filter -->
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.20"/>
    </filter>

  </defs>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  BACKGROUND                                        -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect width="393" height="852" fill="#f4f1ea"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  HERO SECTION  (0 – 215 px)                       -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect width="393" height="215" fill="url(#heroGrad)"/>
  <!-- Radial warmth glow -->
  <rect width="393" height="215" fill="url(#heroGlow)"/>
  <!-- Bottom blend to cream -->
  <rect y="193" width="393" height="42" fill="url(#heroBlend)"/>

  <!-- Decorative circles (subtle depth) -->
  <circle cx="358" cy="38"  r="88"  fill="white" opacity="0.022"/>
  <circle cx="24"  cy="188" r="56"  fill="white" opacity="0.018"/>
  <circle cx="340" cy="190" r="44"  fill="white" opacity="0.016"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  STATUS BAR                                        -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="20" y="22"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="15" font-weight="600" fill="white">9:41</text>

  <!-- Signal bars -->
  <rect x="310" y="15" width="3.5" height="6"  rx="1" fill="white"/>
  <rect x="315" y="13" width="3.5" height="8"  rx="1" fill="white"/>
  <rect x="320" y="11" width="3.5" height="10" rx="1" fill="white"/>
  <rect x="325" y="9"  width="3.5" height="12" rx="1" fill="white"/>

  <!-- Wi-Fi arcs -->
  <path d="M334 17 Q339.5 11.5 345 17"   stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M337 19.5 Q339.5 16 342 19.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="339.5" cy="22" r="1.5" fill="white"/>

  <!-- Battery -->
  <rect x="352" y="13" width="22" height="11" rx="2.5" stroke="white" stroke-width="1.5" fill="none"/>
  <rect x="374" y="15.5" width="2.5" height="6" rx="1.2" fill="white" opacity="0.55"/>
  <rect x="353.5" y="14.5" width="16" height="8" rx="1.5" fill="white"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  NAVIGATION BUTTONS                               -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Back button (frosted glass pill) -->
  <circle cx="36" cy="66" r="18" fill="white" fill-opacity="0.18"/>
  <path d="M40.5 59 L33.5 66 L40.5 73"
        stroke="white" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Options button -->
  <circle cx="357" cy="66" r="18" fill="white" fill-opacity="0.18"/>
  <circle cx="350" cy="66" r="2.2" fill="white"/>
  <circle cx="357" cy="66" r="2.2" fill="white"/>
  <circle cx="364" cy="66" r="2.2" fill="white"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  PROFILE PHOTO  (centered, bridges hero/content)  -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Drop-shadow layer -->
  <circle cx="196.5" cy="183" r="57" fill="black" opacity="0.001" filter="url(#photoShadow)"/>
  <!-- White ring border -->
  <circle cx="196.5" cy="183" r="57" fill="white"/>
  <!-- Photo placeholder -->
  <circle cx="196.5" cy="183" r="51" fill="url(#photoGrad)"/>
  <!-- Person silhouette hint -->
  <circle cx="196.5" cy="170" r="16"  fill="white" opacity="0.32"/>
  <path d="M168 214 C170 195 223 195 225 214" fill="white" opacity="0.22"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  PROFILE IDENTITY                                  -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Name — Playfair Display, brand bold -->
  <text x="196.5" y="264"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="24" font-weight="700"
        fill="#1e3e2b">Ronald Richard</text>

  <!-- Location row (pin icon + text, row centered ~196.5) -->
  <!-- Pin icon at x=148, y baseline ~284 -->
  <path d="M148 270 C148 265.6 151.4 262 156 262 C160.6 262 164 265.6 164 270 C164 275.6 156 283 156 283 C156 283 148 275.6 148 270 Z"
        fill="none" stroke="#818898" stroke-width="1.4"/>
  <circle cx="156" cy="270" r="2.8" fill="#818898"/>
  <text x="168" y="277"
        font-family="Inter, -apple-system, sans-serif"
        font-size="13.5" fill="#818898">Texas, USA</text>

  <!-- Sub-headline: children description -->
  <text x="196.5" y="301"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="14" fill="#818898">Etan, Olivia, and Erick&#x2019;s dad</text>

  <!-- School context (small muted label) -->
  <text x="196.5" y="320"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="12" fill="#b3b8c1">Lincoln School &#xB7; Kennedy&#x2019;s Dad</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  DIVIDER                                           -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="20" y1="338" x2="373" y2="338" stroke="#e6e7ea" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  MET STATUS + MEETS ROW                            -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- "Met" badge (Brand/500 pill with checkmark) -->
  <rect x="118" y="351" width="62" height="28" rx="14" fill="#186338"/>
  <!-- Checkmark icon inside badge -->
  <path d="M128 365 L132 369 L140 361"
        stroke="white" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="144" y="370"
        font-family="Inter, -apple-system, sans-serif"
        font-size="12.5" font-weight="600" fill="white">Met</text>

  <!-- Dot separator -->
  <circle cx="196" cy="365" r="2.2" fill="#cdcfd6"/>

  <!-- Meets count with person icon -->
  <!-- Head -->
  <circle cx="209" cy="360" r="4.8" fill="none" stroke="#4d525b" stroke-width="1.5"/>
  <!-- Shoulders -->
  <path d="M202.5 372 C203.5 367 214.5 367 215.5 372"
        fill="none" stroke="#4d525b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="220" y="369"
        font-family="Inter, -apple-system, sans-serif"
        font-size="13" font-weight="500" fill="#4d525b">12 meets</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  DIVIDER                                           -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="20" y1="390" x2="373" y2="390" stroke="#e6e7ea" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  CHILDREN SECTION                                  -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="20" y="414"
        font-family="Inter, -apple-system, sans-serif"
        font-size="14" font-weight="600" fill="#4d525b">Children</text>

  <!-- ─── Child card: Etan (2 yrs) ─── -->
  <rect x="20" y="424" width="88" height="80" rx="16" fill="#eae6db"/>
  <circle cx="64" cy="450" r="20" fill="#d0dacf"/>
  <text x="64" y="456"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="16" font-weight="700" fill="#186338">E</text>
  <text x="64" y="474"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="12" font-weight="600" fill="#4d525b">Etan</text>
  <!-- Age pill -->
  <rect x="46" y="479" width="36" height="18" rx="9" fill="#186338" fill-opacity="0.14"/>
  <text x="64" y="492"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="10.5" font-weight="600" fill="#186338">2 yrs</text>

  <!-- ─── Child card: Olivia (1 yr) ─── -->
  <rect x="118" y="424" width="88" height="80" rx="16" fill="#eae6db"/>
  <circle cx="162" cy="450" r="20" fill="#d0dacf"/>
  <text x="162" y="456"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="16" font-weight="700" fill="#186338">O</text>
  <text x="162" y="474"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="12" font-weight="600" fill="#4d525b">Olivia</text>
  <rect x="144" y="479" width="36" height="18" rx="9" fill="#186338" fill-opacity="0.14"/>
  <text x="162" y="492"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="10.5" font-weight="600" fill="#186338">1 yr</text>

  <!-- ─── Child card: Erick (6 yrs) ─── -->
  <rect x="216" y="424" width="88" height="80" rx="16" fill="#eae6db"/>
  <circle cx="260" cy="450" r="20" fill="#d0dacf"/>
  <text x="260" y="456"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="16" font-weight="700" fill="#186338">Er</text>
  <text x="260" y="474"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="12" font-weight="600" fill="#4d525b">Erick</text>
  <rect x="242" y="479" width="36" height="18" rx="9" fill="#186338" fill-opacity="0.14"/>
  <text x="260" y="492"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="10.5" font-weight="600" fill="#186338">6 yrs</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  ABOUT CARD                                        -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="16" y="518" width="361" height="116" rx="16" fill="#eae6db" filter="url(#cardShadow)"/>
  <!-- Left accent bar (brand green) -->
  <rect x="16" y="527" width="4" height="98" rx="2" fill="#186338" fill-opacity="0.45"/>
  <!-- About label -->
  <text x="32" y="543"
        font-family="Inter, -apple-system, sans-serif"
        font-size="13" font-weight="700" fill="#4d525b">About</text>
  <!-- Bio lines -->
  <text x="32" y="562"
        font-family="Inter, -apple-system, sans-serif"
        font-size="13" fill="#676d7a">James Martin is parent to Kenedy&#x2019;s in 73301.</text>
  <text x="32" y="580"
        font-family="Inter, -apple-system, sans-serif"
        font-size="13" fill="#676d7a">Passionate about sports, nature &amp; outdoors,</text>
  <text x="32" y="598"
        font-family="Inter, -apple-system, sans-serif"
        font-size="13" fill="#676d7a">community. Loves spontaneous connections</text>
  <text x="32" y="616"
        font-family="Inter, -apple-system, sans-serif"
        font-size="13" fill="#818898" font-style="italic">at the park.</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  USER EVENT HISTORY                                -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="20" y="656"
        font-family="Inter, -apple-system, sans-serif"
        font-size="14" font-weight="600" fill="#4d525b">User Event History</text>

  <!-- Event card -->
  <rect x="16" y="666" width="361" height="92" rx="16" fill="#eae6db" filter="url(#cardShadow)"/>

  <!-- Event image placeholder (warm taupe) -->
  <rect x="26" y="675" width="74" height="74" rx="12" fill="#dbd5c8"/>
  <!-- Art-craft icon suggestion: overlapping circles + stroke -->
  <circle cx="54" cy="699" r="11" fill="none" stroke="#9aa0ad" stroke-width="2.2" opacity="0.55"/>
  <circle cx="68" cy="706" r="8"  fill="none" stroke="#9aa0ad" stroke-width="2"   opacity="0.55"/>
  <path d="M44 716 Q57 710 70 718"
        stroke="#9aa0ad" stroke-width="2" fill="none"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Event title -->
  <text x="112" y="690"
        font-family="Inter, -apple-system, sans-serif"
        font-size="14" font-weight="600" fill="#4d525b">Kids Art &amp; Craft Day</text>

  <!-- Date row: calendar icon + text -->
  <rect x="112" y="698"  width="11" height="10" rx="2"
        fill="none" stroke="#818898" stroke-width="1.2"/>
  <line x1="114.5" y1="698" x2="114.5" y2="695" stroke="#818898" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="120.5" y1="698" x2="120.5" y2="695" stroke="#818898" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="112"   y1="702" x2="123"   y2="702" stroke="#818898" stroke-width="0.8" opacity="0.5"/>
  <text x="127" y="707"
        font-family="Inter, -apple-system, sans-serif"
        font-size="12" fill="#818898">Mon, Feb 25 &#xB7; 10:00am</text>

  <!-- Location row: pin icon + text -->
  <path d="M115 724 C112.5 720 112 718.5 112 717 C112 714.2 113.8 712 116 712 C118.2 712 120 714.2 120 717 C120 718.5 119.5 720 117 724 Z"
        fill="none" stroke="#818898" stroke-width="1.2"/>
  <circle cx="116" cy="717" r="1.8" fill="#818898"/>
  <text x="127" y="722"
        font-family="Inter, -apple-system, sans-serif"
        font-size="12" fill="#818898">Griffith Park, LA</text>

  <!-- Distance badge -->
  <rect x="306" y="733" width="54" height="20" rx="10" fill="#dbd5c8"/>
  <text x="333" y="747"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="11.5" fill="#676d7a">2.1 mi</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  BOTTOM CTA                                        -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Background tray -->
  <rect x="0" y="772" width="393" height="80" fill="#f4f1ea"/>
  <!-- Hairline divider -->
  <line x1="0" y1="772" x2="393" y2="772" stroke="#e6e7ea" stroke-width="0.75"/>

  <!-- Continue button (Brand/500, full-width pill) -->
  <rect x="20" y="781" width="353" height="52" rx="26" fill="#186338"/>
  <text x="196.5" y="813"
        text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="16" font-weight="600" fill="white">Continue</text>

  <!-- Home indicator bar -->
  <rect x="152" y="841" width="89" height="5" rx="2.5" fill="#1e3e2b" opacity="0.14"/>

</svg>
