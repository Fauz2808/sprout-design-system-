<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprout – 15.2.1 Clubs Search No Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:#b8b0a0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:52px 0 80px; font-family:'Inter',sans-serif; }
    :root {
      --brand-500:#186338; --brand-700:#1e3e2b; --brand-50:#e2e9e3; --brand-100:#d0dacf;
      --bg:#f4f1ea; --surf-1:#eae6db; --surf-2:#dbd5c8; --surf-3:#c2b9a6;
      --text-primary:#4d525b; --text-secondary:#818898; --text-tertiary:#b3b8c1;
      --text-brand:#186338; --text-brand-bold:#1e3e2b; --border:#e6e7ea;
    }
    .phone { width:393px; height:852px; background:var(--bg); border-radius:54px; overflow:hidden; position:relative; display:flex; flex-direction:column; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 0 0 10px #1c1c1e,0 0 0 12px #2c2c2e,0 50px 100px rgba(0,0,0,.48); }
    .phone::before { content:''; position:absolute; left:-13px; top:120px; width:4px; height:32px; background:#2a2a2a; border-radius:2px 0 0 2px; box-shadow:0 44px 0 #2a2a2a,0 88px 0 #2a2a2a; }
    .phone::after  { content:''; position:absolute; right:-13px; top:148px; width:4px; height:66px; background:#2a2a2a; border-radius:0 2px 2px 0; }
    .island { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#0a0a0a; border-radius:18px; z-index:100; }

    .status-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 26px 0; height:52px; flex-shrink:0; }
    .s-time { font-size:15px; font-weight:600; color:var(--text-primary); }
    .s-icons { display:flex; align-items:center; gap:6px; }

    /* Club tabs */
    .club-tabs { display:flex; gap:18px; padding:12px 20px 10px; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
    .club-tabs::-webkit-scrollbar { display:none; }
    .club-tab { display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; }
    .club-icon-wrap { position:relative; width:52px; height:52px; }
    .club-icon { width:52px; height:52px; border-radius:50%; background:var(--surf-1); border:2.5px solid transparent; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .club-tab.active .club-icon { border-color:var(--brand-500); }
    .club-badge { position:absolute; top:-1px; right:-1px; width:17px; height:17px; border-radius:50%; background:var(--brand-500); color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); }
    .club-name { font-size:9.5px; color:var(--text-secondary); text-align:center; max-width:58px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .club-tab.active .club-name { color:var(--text-brand); font-weight:600; }

    /* Section header */
    .section-header { padding:6px 20px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .section-title { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--text-brand-bold); margin-bottom:2px; }
    .section-sub { font-size:12px; color:var(--text-secondary); }

    /* Active search bar */
    .search-active { display:flex; align-items:center; gap:8px; margin:12px 20px 0; height:40px; border-radius:99px; background:var(--surf-1); padding:0 14px; border:1.5px solid var(--brand-500); flex-shrink:0; }
    .search-active span { font-size:13.5px; color:var(--text-primary); flex:1; }
    .search-clear { width:18px; height:18px; border-radius:50%; background:var(--surf-2); display:flex; align-items:center; justify-content:center; }

    /* Filter row */
    .filter-row { display:flex; align-items:center; gap:8px; padding:10px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .pill { display:inline-flex; align-items:center; height:29px; padding:0 12px; border-radius:99px; font-size:12.5px; font-weight:500; background:var(--surf-1); color:var(--text-secondary); white-space:nowrap; }
    .pill.active { background:var(--brand-500); color:#fff; font-weight:600; }
    .invite-pill { margin-left:auto; display:inline-flex; align-items:center; gap:4px; height:29px; padding:0 12px; border-radius:99px; font-size:12.5px; font-weight:600; background:transparent; border:1.5px solid var(--brand-500); color:var(--brand-500); cursor:pointer; }

    /* No results state */
    .no-results { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 36px 80px; text-align:center; }
    .no-results-icon { width:72px; height:72px; border-radius:22px; background:var(--surf-1); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
    .no-results-title { font-size:16px; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
    .no-results-query { color:var(--text-brand-bold); }
    .no-results-body { font-size:13px; color:var(--text-secondary); line-height:1.55; max-width:220px; }

    .bottom-nav { position:absolute; bottom:0; left:0; right:0; height:82px; background:var(--bg); border-top:1px solid var(--border); display:flex; align-items:flex-start; padding-top:10px; }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
    .nav-label { font-size:9.5px; font-weight:500; color:var(--text-tertiary); }
    .nav-item.active .nav-label { color:var(--brand-500); }
  </style>
</head>
