<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Generator · Sprout</title>
  <style>
    :root {
      --bg:      #F5F2ED;
      --surface: #FFFFFF;
      --fg:      #1C1C1A;
      --muted:   #7A7670;
      --border:  #E8E4DC;
      --accent:  #1B5C38;

      --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;

      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 5%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    /* ─── device frame ─────────────────────────────────────────────── */
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px; bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px; left: 50%;
      transform: translateX(-50%);
      width: 124px; height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    /* ─── screen ───────────────────────────────────────────────────── */
    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: #000;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      height: 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: #fff; }
    .statusbar .battery { width: 25px; }

    /* ─── hero image (full bleed, top 46% of screen) ─────────────── */
    .hero-image {
      flex: 0 0 380px;
      position: relative;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.0) 40%, rgba(0,0,0,0.3) 100%),
        linear-gradient(135deg, #7eb89a 0%, #4a9068 30%, #2d6e4e 60%, #1b5c38 100%);
      overflow: hidden;
    }

    /* Landscape scene drawn in SVG */
    .hero-image .scene {
      position: absolute;
      inset: 0;
    }

    /* back button */
    .back-btn {
      position: absolute;
      top: 58px;
      left: 20px;
      z-index: 10;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      display: grid; place-items: center;
      border: none;
      cursor: pointer;
    }
    .back-btn svg {
      width: 18px; height: 18px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ─── bottom sheet ─────────────────────────────────────────────── */
    .sheet {
      flex: 1 1 auto;
      background: var(--bg);
      border-radius: 28px 28px 0 0;
      margin-top: -28px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      padding: 0 0 0 0;
      overflow: hidden;
    }

    .sheet-handle {
      width: 40px; height: 5px;
      background: var(--border);
      border-radius: 999px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }

    .sheet-title {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
      padding: 10px 20px 0;
      flex-shrink: 0;
    }

    .sheet-body {
      flex: 1 1 auto;
      padding: 14px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* step dots */
    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
    }
    .dot.active {
      width: 20px;
      border-radius: 999px;
      background: var(--accent);
    }

    /* headline */
    .headline {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-align: center;
      margin: 0 0 6px;
      color: var(--fg);
    }
    .subtext {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      margin: 0 0 18px;
    }

    /* CTA row */
    .cta-stack {
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: center;
    }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
    }
    .btn-primary svg {
      width: 16px; height: 16px;
      stroke: #fff; fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-ghost {
      background: none;
      border: none;
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      padding: 12px 8px;
      cursor: pointer;
      letter-spacing: -0.01em;
    }

    /* ─── input area ───────────────────────────────────────────────── */
    .input-area {
      margin-top: auto;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    /* mode label */
    .mode-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 10px;
    }
    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 8px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .mode-chip .dot-live {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mic-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .mic-btn svg {
      width: 18px; height: 18px;
      stroke: #fff; fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .input-field {
      flex: 1;
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }
    .send-btn {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: color-mix(in oklch, var(--accent) 18%, transparent);
      border: none;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .send-btn svg {
      width: 16px; height: 16px;
      stroke: var(--accent); fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* home indicator */
    .home-indicator {
      flex: 0 0 28px;
      position: relative;
      background: var(--bg);
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.18;
    }

    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Sprout</strong> · Image Generator — Refined Flow</div>

    <div class="device">
      <span class="btn-rail left-1"  aria-hidden></span>
      <span class="btn-rail left-2"  aria-hidden></span>
      <span class="btn-rail left-3"  aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island"           aria-hidden></span>

      <div class="screen">

        <!-- status bar -->
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0"  y="7" width="3" height="4" rx="0.6"/>
              <rect x="4"  y="5" width="3" height="6" rx="0.6"/>
              <rect x="8"  y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="white" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="white" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4" fill="white"/>
            </svg>
          </span>
        </div>

        <!-- hero image -->
        <div class="hero-image">
          <!-- SVG landscape scene -->
          <svg class="scene" viewBox="0 0 366 380" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <!-- sky gradient -->
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#87CEEB"/>
                <stop offset="60%" stop-color="#b8e0f0"/>
                <stop offset="100%" stop-color="#d4edf7"/>
              </linearGradient>
              <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5a9e6f"/>
                <stop offset="100%" stop-color="#3d7a52"/>
              </linearGradient>
              <linearGradient id="fairway" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6ab87e"/>
                <stop offset="100%" stop-color="#4e9464"/>
              </linearGradient>
              <radialGradient id="sun" cx="72%" cy="18%" r="12%">
                <stop offset="0%" stop-color="#fff9c4"/>
                <stop offset="60%" stop-color="#ffe082"/>
                <stop offset="100%" stop-color="#ffe08200"/>
              </radialGradient>
            </defs>

            <!-- sky -->
            <rect width="366" height="380" fill="url(#sky)"/>

            <!-- sun glow -->
            <ellipse cx="265" cy="70" rx="50" ry="50" fill="url(#sun)" opacity="0.8"/>

            <!-- clouds -->
            <ellipse cx="80" cy="55" rx="55" ry="20" fill="white" opacity="0.75"/>
            <ellipse cx="60" cy="60" rx="35" ry="16" fill="white" opacity="0.6"/>
            <ellipse cx="108" cy="60" rx="38" ry="15" fill="white" opacity="0.6"/>
            <ellipse cx="200" cy="42" rx="40" ry="14" fill="white" opacity="0.55"/>
            <ellipse cx="185" cy="47" rx="28" ry="12" fill="white" opacity="0.5"/>
            <ellipse cx="220" cy="47" rx="30" ry="11" fill="white" opacity="0.5"/>

            <!-- distant tree line -->
            <ellipse cx="40"  cy="168" rx="30" ry="38" fill="#2d6a40" opacity="0.9"/>
            <ellipse cx="70"  cy="160" rx="34" ry="44" fill="#347548" opacity="0.9"/>
            <ellipse cx="105" cy="155" rx="30" ry="42" fill="#3a7e50" opacity="0.95"/>
            <ellipse cx="138" cy="158" rx="28" ry="40" fill="#2e6943" opacity="0.9"/>
            <ellipse cx="168" cy="162" rx="26" ry="36" fill="#347548" opacity="0.85"/>
            <ellipse cx="200" cy="160" rx="28" ry="38" fill="#3a7e50" opacity="0.9"/>
            <ellipse cx="232" cy="158" rx="24" ry="36" fill="#2d6a40" opacity="0.85"/>
            <ellipse cx="258" cy="162" rx="22" ry="32" fill="#347548" opacity="0.8"/>
            <ellipse cx="290" cy="165" rx="26" ry="36" fill="#3a7e50" opacity="0.85"/>
            <ellipse cx="324" cy="162" rx="28" ry="40" fill="#2d6a40" opacity="0.9"/>
            <ellipse cx="354" cy="168" rx="24" ry="36" fill="#347548" opacity="0.85"/>

            <!-- buildings behind trees -->
            <rect x="148" y="110" width="18" height="55" fill="#c8d8e8" opacity="0.6"/>
            <rect x="168" y="100" width="22" height="65" fill="#d0dce8" opacity="0.55"/>
            <rect x="192" y="108" width="18" height="57" fill="#c8d4e0" opacity="0.55"/>
            <rect x="210" y="98" width="20" height="67" fill="#ccd8e4" opacity="0.6"/>
            <rect x="232" y="105" width="16" height="60" fill="#c4d0dc" opacity="0.5"/>
            <!-- building windows -->
            <rect x="152" y="118" width="4" height="4" fill="#a8c0d0" opacity="0.5"/>
            <rect x="158" y="118" width="4" height="4" fill="#a8c0d0" opacity="0.5"/>
            <rect x="152" y="126" width="4" height="4" fill="#a8c0d0" opacity="0.4"/>
            <rect x="172" y="108" width="5" height="5" fill="#a0b8cc" opacity="0.5"/>
            <rect x="180" y="108" width="5" height="5" fill="#a0b8cc" opacity="0.5"/>
            <rect x="172" y="118" width="5" height="5" fill="#a0b8cc" opacity="0.4"/>

            <!-- ground / fairway -->
            <path d="M0 200 Q183 185 366 200 L366 380 L0 380 Z" fill="url(#grass)"/>
            <!-- fairway stripes -->
            <path d="M0 215 Q183 200 366 215 L366 240 Q183 225 0 240 Z" fill="#5aac70" opacity="0.4"/>
            <path d="M0 250 Q183 235 366 250 L366 275 Q183 260 0 275 Z" fill="#5aac70" opacity="0.35"/>
            <path d="M0 285 Q183 270 366 285 L366 310 Q183 295 0 310 Z" fill="#5aac70" opacity="0.3"/>

            <!-- sand bunkers -->
            <ellipse cx="110" cy="270" rx="38" ry="18" fill="#e8d8a0" opacity="0.85"/>
            <ellipse cx="260" cy="260" rx="30" ry="14" fill="#e8d8a0" opacity="0.8"/>

            <!-- flag pin -->
            <line x1="200" y1="205" x2="200" y2="245" stroke="#888" stroke-width="1.5"/>
            <polygon points="200,205 215,212 200,219" fill="#e74c3c" opacity="0.9"/>
            <ellipse cx="200" cy="246" rx="8" ry="3" fill="#2d6a40" opacity="0.5"/>
          </svg>

          <!-- back button -->
          <button class="back-btn" aria-label="Go back">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>

        <!-- bottom sheet -->
        <div class="sheet">
          <div class="sheet-handle" aria-hidden></div>
          <div class="sheet-title">Generate Image</div>

          <div class="sheet-body">
            <!-- dots -->
            <div class="dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot active"></span>
            </div>

            <!-- headline -->
            <p class="headline">Here's your cover 🎉</p>
            <p class="subtext">Love it? Use it. Want to tweak it?<br>Describe what to change below.</p>

            <!-- CTAs -->
            <div class="cta-stack">
              <button class="btn-primary">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                Use This Image
              </button>
              <button class="btn-ghost">Start over</button>
            </div>
          </div>

          <!-- input area -->
          <div class="input-area">
            <!-- mode chip -->
            <div class="mode-label">
              <span class="mode-chip">
                <span class="dot-live"></span>
                Refining current image
              </span>
            </div>

            <!-- input row -->
            <div class="input-row">
              <button class="mic-btn" aria-label="Voice input">
                <svg viewBox="0 0 24 24">
                  <rect x="9" y="3" width="6" height="11" rx="3"/>
                  <path d="M5 11a7 7 0 0 0 14 0"/>
                  <line x1="12" y1="18" x2="12" y2="22"/>
                  <line x1="9" y1="22" x2="15" y2="22"/>
                </svg>
              </button>
              <div class="input-field">What would you like to change?</div>
              <button class="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              </button>
            </div>
          </div>

          <div class="home-indicator" aria-hidden></div>
        </div>

      </div><!-- .screen -->
    </div><!-- .device -->
  </div><!-- .stage -->
</body>
</html>
