<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprout Signs — v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:       #0f2218;
  --green-mid:   #1e3e2b;
  --green-brand: #186338;
  --cream:       #f4f1ea;
  --yellow:      #f4b843;
  --yellow-deep: #e8a820;
  --white:       #ffffff;
}

body {
  background: #dedad2;
  font-family: 'Inter', sans-serif;
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  min-height: 100vh;
}

/* ── PAGE LABEL ──────────────────── */
.sign-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #a09a8e;
  margin-top: 20px;
  margin-bottom: 52px;
  align-self: center;
}

/* ── SIGN CARD ───────────────────── */
.sign {
  width: 960px;
  height: 740px;
  border-radius: 32px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 40px 80px rgba(0,0,0,0.22),
    0 8px 24px rgba(0,0,0,0.12),
    0 2px 4px rgba(0,0,0,0.08);
  flex-shrink: 0;
}

/* ─────────────────────────────────
   FRONT SIGN — deep green
───────────────────────────────── */
.sign-front {
  background: var(--green);
  padding: 56px 64px 52px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Subtle texture on front */
.sign-front::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 200px;
  opacity: 0.03;
  pointer-events: none;
}

/* Decorative large circle bg element */
.sign-front::after {
  content: '';
  position: absolute;
  right: -120px;
  top: -120px;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(244,184,67,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.front-top {
  position: relative;
  z-index: 1;
}

.parents-pill {
  display: inline-flex;
  align-items: center;
  background: var(--yellow);
  color: var(--green);
  border-radius: 999px;
  padding: 10px 24px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 32px;
}

.front-headline {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 1;
}

.front-headline .line-1 {
  font-size: 72px;
  color: var(--white);
  display: block;
}

.front-headline .line-2 {
  font-size: 72px;
  color: var(--white);
  display: block;
}

.front-headline .accent {
  color: var(--yellow);
  font-style: italic;
}

.front-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}

/* ── LOGO LOCKUP ───────────────── */
.logo-lockup {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}

.logo-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.logo-name {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
}

.logo-url {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.55;
}

/* Front logo colors */
.sign-front .logo-name { color: var(--white); }
.sign-front .logo-url  { color: var(--white); }
.sign-front .logo-icon { color: var(--yellow); }

/* ── QR CODE ───────────────────── */
.qr-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.qr-box {
  width: 100px;
  height: 100px;
  background: var(--white);
  border-radius: 14px;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(10, 1fr);
  gap: 1.5px;
}

.qr-box .q { background: #1a1a1a; border-radius: 1px; }
.qr-box .e { background: transparent; }

.qr-label {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.sign-front .qr-label { color: rgba(255,255,255,0.45); }


/* ─────────────────────────────────
   BACK SIGN — warm cream
───────────────────────────────── */
.sign-back {
  background: var(--cream);
  padding: 52px 64px 52px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Subtle warm texture */
.sign-back::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 200px;
  opacity: 0.04;
  pointer-events: none;
}

/* Decorative corner accent */
.sign-back::after {
  content: '';
  position: absolute;
  left: -80px;
  bottom: -80px;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(24,99,56,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.back-headline {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.03em;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.back-headline .line {
  display: block;
  font-size: 86px;
  color: var(--green);
}

.back-headline .line .accent {
  color: var(--green-brand);
  font-style: italic;
}

.back-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}

/* Back logo colors */
.sign-back .logo-name { color: var(--green); }
.sign-back .logo-url  { color: var(--green); }
.sign-back .logo-icon { color: var(--green-brand); }

.sign-back .qr-box { background: var(--green); }
.sign-back .qr-box .q { background: var(--cream); }
.sign-back .qr-label { color: rgba(15,34,24,0.4); }

/* ── QR PATTERN ─────────────────── */
/* We encode a visual QR-like pattern manually */
</style>
</head>

  </div>

</div>
