<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body { margin:0; padding:0; background:#f4f1ea; display:flex; align-items:center; justify-content:center; height:100vh; }
  .phone {
    width: 393px; height: 852px;
    border-radius: 54px;
    overflow: hidden; position: relative;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.12),
      0 0 0 10px #1c1c1e,
      0 0 0 12px #2c2c2e,
      0 60px 130px rgba(0,0,0,.55);
  }
  .phone::before {
    content:''; position:absolute; left:-13px; top:120px;
    width:4px; height:32px; background:#2a2a2a;
    border-radius:2px 0 0 2px;
    box-shadow:0 44px 0 #2a2a2a,0 88px 0 #2a2a2a; z-index:200;
  }
  .phone::after {
    content:''; position:absolute; right:-13px; top:148px;
    width:4px; height:66px; background:#2a2a2a;
    border-radius:0 2px 2px 0; z-index:200;
  }
  .island {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:34px; background:#0a0a0a;
    border-radius:18px; z-index:150; pointer-events:none;
  }
  iframe { display:block; width:393px; height:852px; border:0; }
</style>
</head>
<body>
  <div class="phone">
    <iframe id="frame" src="about:blank"></iframe>
    <div class="island"></div>
  </div>
</body>
</html>
