<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprout">
<link rel="apple-touch-icon" href="/assets/app-icon-180.png">
<title>Sprout · Assist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<!--SSC_CSS-->
<link rel="stylesheet" href="/assets/navbar-motion.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/date-night-map.css">
<link rel="stylesheet" href="/sitter-v3.css">
<link rel="stylesheet" href="/ui-directions.css">
</head>
<body>
<div id="phone">
  <div class="island"></div>
  <div class="sbar"><span>9:41</span><span><i class="ph-bold ph-cell-signal-full"></i> <i class="ph-bold ph-wifi-high"></i> <i class="ph-fill ph-battery-full"></i></span></div>

  <div class="brief" id="brief">
    <div class="db">
      <div class="dbhead"><span class="me" aria-hidden="true"></span><div class="mid"><b>Sprout AI</b><span>Monday, July 27</span></div><span class="bell"><i class="ph ph-bell"></i></span></div>
      <div id="daySlot"></div>
      <div id="promoSlot"></div>
      <div class="dbdiv"></div>
    </div>
    <img class="rest" src="/assets/db-rest.webp" alt="To-Do List, invitations and the rest of Jake's Daily Brief">
  </div>

  <nav class="nav" aria-label="Tabs">
    <svg class="notch" aria-hidden="true"><path class="notch-fill" style="fill:var(--bg)"/><path class="notch-edge" fill="none" stroke="#e6e7ea" stroke-width="1"/></svg>
    <span class="tab on"><i class="ph-fill ph-sun-horizon"></i>Daily Brief</span>
    <span class="tab"><i class="ph ph-compass"></i>Events</span>
    <span class="tab-gap" aria-hidden="true"></span>
    <span class="tab"><i class="ph ph-chat-circle-dots"></i>Chat<b class="n">2</b></span>
    <span class="tab"><i class="ph ph-users"></i>Clubs</span>
  </nav>
  <button class="hero" id="assistBtn" aria-label="Sprout Assist, 1 new suggestion"><img src="/assets/assist-clover-knit.png" alt=""><b class="badge">1</b></button>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-label="Sprout Assist">
    <div class="head">
      <button class="round" id="close" aria-label="Close"><i class="ph ph-x"></i></button>
      <div class="orb" id="headOrb"></div>
      <div class="htitle"><b>Sprout</b><span id="hsub">Here for you and Dana</span></div>
      <button class="round" id="historyBtn" aria-label="History"><i class="ph ph-clock-counter-clockwise"></i></button>
      <div class="fam"><i style="background-image:url(/assets/tony.webp)"></i><i style="background-image:url(/assets/dana.webp)"></i></div>
    </div>
    <div id="views" class="views"></div>
    <div class="composer" id="composer"><div><i class="ph ph-plus"></i><span class="ctext" id="ctext">Ask Sprout anything</span><button type="button" class="send" id="send" aria-label="Send"><i class="ph-bold ph-paper-plane-right"></i></button></div></div>
  </section>

  <div class="faceid" id="faceid"><div><i class="ph ph-scan-smiley" id="faceIcon"></i><span id="faceText">Face ID</span></div></div>
  <div class="bscrim" id="bscrim"></div>
  <div id="overlays"></div>
  <div class="toast" id="toast"></div>
  <div class="homebar"></div>
</div>

<aside class="desk" aria-label="Review panel">
  <h1>Sprout Assist</h1>
  <p>Tap the clover or the soccer banner. Every flow uses the parts of the approved SSC Kids demo. People, replies and payments are examples; nothing is sent or charged.</p>
  <ol id="deskLinks"></ol>
  <button type="button" id="restartBtn">Restart</button>
</aside>

<script src="/app.js"></script>
<script src="/flows.js"></script>
<script src="/date-night.js"></script>
<script src="/date-night-map.js"></script>
<script src="/sitter-v3.js"></script>
<script src="/ui-directions.js"></script>
<script src="/assets/thinking-orb.js"></script><script src="/assets/dynamic-orbs.js"></script><script src="/assets/navbar-motion.js"></script>
</body>
</html>
