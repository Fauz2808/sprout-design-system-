<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The other side · Sprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<!-- 20 Nov (Ahmad): the other parent's side of a request, for the presentation (/other-side/). One phone, three moments,
     tap to move on: 1 the notification on their lock screen, 2 the request, 3 their answer and what comes back.
     ?v=carpool-chat   Priya, in Jake's team chat in Sprout (Tony picked "Post in Jake's team chat")
     ?v=carpool-regular Aisha, asked in Sprout for a regular carpool (second on Tony's list, C2)
     ?v=carpool-text   Priya, a group text with Tony and Sprout (Tony picked "Parents I pick"; works without Sprout, N10)
     ?v=sitter-text    Alex the sitter, a group text with Tony and Sprout (N9: Sprout texts, the parent is on the text)
     Playdate is the existing /playdate-invite/ (Ana, in Sprout). Names and times match the sender flows. -->
<style>
:root{--bg:#f4f1ea;--white:#fff;--strong:#1d2a22;--ink:#1e3e2b;--text:#333d36;--subtle:#6b746d;--soft:#ebe7de;--field:#f1eee7;--brand:#186338;--tint:#e3efe6;
  --serif:'Playfair Display',Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif;--ios:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#d9d4c9;font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;cursor:pointer;padding:0;color:inherit}
#phone{position:relative;width:393px;height:852px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:500px){body{display:grid;place-items:center;padding:20px 0}#phone{border-radius:48px;box-shadow:0 0 0 10px #1d241f,0 30px 60px rgb(0 0 0 / .3)}}
.sb{position:absolute;z-index:30;top:0;left:0;right:0;height:50px;padding:16px 30px 0 44px;display:flex;justify-content:space-between;font:600 16px var(--ios);color:#111}
.sb.light{color:#fff}
.sb i{font-size:15px;margin-left:4px}
.home{position:absolute;z-index:40;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111}
.home.light{background:#fff}
.view{position:absolute;inset:0;transition:opacity .45s,transform .45s}
.view[hidden]{display:block!important;opacity:0;pointer-events:none;transform:scale(1.03)}

/* 1 · lock screen */
.lock{background:linear-gradient(170deg,#4d6b57 0%,#2f4a39 45%,#1d2e24 100%);color:#fff;text-align:center}
.lock .date{margin-top:86px;font:500 20px var(--ios);opacity:.9}
.lock .time{font:200 92px/1 var(--ios);letter-spacing:-2px}
.note{position:absolute;left:12px;right:12px;top:330px;display:flex;gap:11px;padding:13px 14px;border-radius:22px;background:rgb(245 245 245 / .82);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:#111;text-align:left;font-family:var(--ios);animation:drop .7s cubic-bezier(.2,1,.3,1) .5s both}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}}
.note .ic{width:38px;height:38px;border-radius:9px;flex:none;background:center/cover}
.note .ic.msg{display:grid;place-items:center;background:linear-gradient(180deg,#5af77a,#24c43f);color:#fff;font-size:24px}
.note .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.note .hd small{font-weight:400;color:#6b6b70}
.note p{margin:2px 0 0;font-size:14px;line-height:1.35}
.tapto{position:absolute;left:0;right:0;bottom:120px;font:500 14px var(--ios);opacity:.75;animation:pulse 2s ease-in-out 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

/* Sprout team chat */
.chat{display:flex;flex-direction:column;background:var(--bg)}
.chat .top{flex:none;padding:56px 14px 10px;display:flex;align-items:center;gap:10px;background:#fbfaf6;border-bottom:1px solid var(--soft)}
.chat .top .bk{width:36px;height:36px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--brand);font-size:18px}
.chat .top .lg{width:40px;height:40px;border-radius:50%;background:center/cover #fff}
.chat .top b{display:block;font:500 17px var(--serif);color:var(--ink)}
.chat .top small{font-size:12px;color:var(--subtle)}
.log{flex:1;overflow:hidden;padding:14px 14px 0;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.m{display:flex;gap:8px;align-items:flex-end}
.m .av{width:30px;height:30px;border-radius:50%;background:center/cover #ddd;flex:none}
.m .b{max-width:78%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:#fff;font-size:14.5px;line-height:1.38;color:#283329}
.m .b small{display:block;margin-bottom:2px;font-size:11px;font-weight:600;color:var(--brand)}
.m.me{justify-content:flex-end}.m.me .b{background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px}
.sys{align-self:center;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#e8e3d8;font-size:12px;color:#4d525b}
.ride{margin-left:38px;padding:13px;border-radius:18px;background:#fff;border:1px solid #dfe9e1;box-shadow:0 6px 18px -10px rgb(30 50 30 / .3)}
.ride .h{display:flex;align-items:center;gap:10px}
.ride .h img{width:40px;height:40px}
.ride .h b{display:block;font:500 17px var(--serif);color:var(--ink)}
.ride .h small{font-size:12.5px;color:var(--subtle)}
.ride .f{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:var(--strong)}
.ride .f i{color:var(--brand);font-size:17px}
.ride .two{display:flex;gap:8px;margin-top:12px}
.ride .two button{flex:1;height:42px;border-radius:999px;font:500 15px var(--serif);background:var(--field);color:var(--ink)}
.ride .two button.go{background:var(--brand);color:#fff}
/* C1 (20 Nov US): the third answer, and the confirmation the card becomes */
.ride .reply{display:block;width:100%;margin-top:8px;height:36px;border-radius:999px;background:transparent;color:var(--brand);font:500 14px var(--serif)}
.ride .conf{margin-top:12px;padding:12px;border-radius:14px;background:#eaf3ec}
.ride .conf .ch{display:flex;align-items:center;gap:8px;font:600 14.5px Inter,system-ui,sans-serif;color:var(--brand)}
.ride .conf .ch i{font-size:19px}
.ride .conf .f{margin-top:6px;font-size:13px}
.ride .f.wait{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f3efe6;color:var(--subtle);font-weight:600;font-size:13px}
.ride .f.wait .spin{width:14px;height:14px;border-radius:50%;border:2px solid #cfc8b8;border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* C2: the shared turns, one line each */
.ride .sch{margin-top:12px;border-radius:12px;background:#f6f3ec;overflow:hidden}
.ride .sch-r{display:flex;justify-content:space-between;padding:7px 12px;font-size:13px;border-top:1px solid #ebe5d9}
.ride .sch-r:first-child{border-top:0}
.ride .sch-r b{font-weight:600;color:var(--ink)}
.ride .sch-r.you b{color:var(--brand)}
/* the "when could you drive?" sheet (Ahmad, 21 Nov) */
.tsheet{position:absolute;inset:0;z-index:30}
.ts-scrim{position:absolute;inset:0;background:rgb(0 0 0 / .32)}
.ts-box{position:absolute;left:0;right:0;bottom:0;padding:10px 20px 30px;border-radius:24px 24px 0 0;background:var(--bg);box-shadow:0 -10px 30px rgb(0 0 0 / .18)}
.ts-grab{display:block;width:38px;height:5px;margin:0 auto 14px;border-radius:3px;background:#d4cec2}
.ts-box b{display:block;font:500 21px var(--serif);color:var(--ink)}
.ts-box p{margin:6px 0 14px;font-size:13.5px;line-height:1.4;color:var(--subtle)}
/* Ahmad, 21 Nov: say up front that more than one time can be picked */
.ts-multi{display:flex;align-items:center;gap:6px;margin:0 0 8px;font:600 12px Inter,system-ui,sans-serif;letter-spacing:.02em;color:var(--brand)}
.ts-multi i{font-size:16px}
.ts-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ts-times button{position:relative}
.ts-times button.on::after{content:"✓";position:absolute;top:50%;right:12px;translate:0 -50%;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font:700 11px/18px Inter,system-ui,sans-serif;text-align:center}
.ts-times button{height:46px;border-radius:14px;background:#fff;border:1.5px solid #e2ddd2;font:600 15px Inter,system-ui,sans-serif;color:var(--ink)}
.ts-times button.on{border-color:var(--brand);background:#eaf3ec;color:var(--brand)}
.ts-send{display:block;width:100%;height:50px;margin-top:16px;border-radius:999px;background:var(--brand);color:#fff;font:500 16px var(--serif)}
.ts-send:disabled{opacity:.45}
.ts-none{display:block;width:100%;height:42px;margin-top:6px;background:transparent;color:var(--subtle);font:500 14px var(--serif)}
.ride.done{border-color:var(--brand);background:#f3f8f4}
.comp{flex:none;margin:10px 12px 30px;height:44px;border-radius:999px;background:#fff;border:1px solid #e6e1d6;display:flex;align-items:center;padding:0 16px;font-size:14px;color:#a49a88}

/* iOS Messages, group text */
.sms{display:flex;flex-direction:column;background:#fff;font-family:var(--ios)}
.sms .top{flex:none;padding:52px 12px 8px;text-align:center;border-bottom:1px solid #e5e5ea;background:rgb(249 249 249 / .94);position:relative}
.sms .top .bk{position:absolute;left:12px;top:64px;color:#0a84ff;font-size:24px}
.sms .avs{display:flex;justify-content:center}
.sms .avs i{width:44px;height:44px;border-radius:50%;border:2px solid #fff;margin-left:-10px;background:center/cover #ccc}
.sms .avs i:first-child{margin-left:0}
.sms .top b{display:block;margin-top:3px;font-size:12px;font-weight:500;color:#111}
.sms .top small{font-size:11px;color:#8e8e93}
.sms .log{gap:3px;padding:12px 12px 0}
.sms .stamp{align-self:center;margin:8px 0 6px;font-size:11px;color:#8e8e93}
.sms .who{margin:6px 0 1px 44px;font-size:11px;color:#8e8e93}
.sms .row{display:flex;gap:8px;align-items:flex-end}
.sms .row .av{width:30px;height:30px;border-radius:50%;background:center/cover #ccc;flex:none}
.sms .row .av.blank{visibility:hidden}
.sms .bb{max-width:74%;padding:8px 12px;border-radius:18px;background:#e9e9eb;color:#000;font-size:15.5px;line-height:1.3}
.sms .row.me{justify-content:flex-end}.sms .row.me .bb{background:#34c759;color:#fff}
.sms .bb a{color:inherit;text-decoration:underline}
.sms .kind{align-self:center;margin:2px 0 8px;font-size:11px;color:#8e8e93}
.quick{flex:none;display:flex;gap:8px;padding:10px 12px 0;overflow-x:auto}
.quick button{flex:none;padding:9px 14px;border-radius:18px;border:1px solid #c7c7cc;font-size:14.5px;color:#0a84ff;background:#fff}
.sms .comp{border-radius:20px;border:1px solid #c7c7cc;margin:10px 12px 30px;height:38px;color:#8e8e93;font-family:var(--ios)}

.in{animation:inn .45s cubic-bezier(.2,1,.3,1) both}
@keyframes inn{from{opacity:0;transform:translateY(12px)}}
.nudge{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgb(24 99 56 / .45)}70%,100%{box-shadow:0 0 0 10px rgb(24 99 56 / 0)}}
.quick .nudge{animation-name:ringb}
@keyframes ringb{0%{box-shadow:0 0 0 0 rgb(10 132 255 / .45)}70%,100%{box-shadow:0 0 0 10px rgb(10 132 255 / 0)}}
/* linked (?link=): the composer is a real field */
.comp.lk input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:#111;outline:none}
.sms .comp.lk input{font-family:var(--ios)}
/* Figma "Push Notification" (13562:200846): glass, 8px padding, 16px radius, Inter 10/1.55 white */
.note.pn{align-items:center;gap:8px;padding:8px;border-radius:16px;background:rgba(244,241,234,.1);border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:1px 4px 25px 2px rgba(13,13,18,.2);color:#fff;font:400 10px/1.55 Inter,system-ui,sans-serif}
.pn-av{position:relative;flex:none;width:40px;height:40px;border-radius:10px;background:linear-gradient(#f2edea,#e7d8d2);display:grid;place-items:center}
.pn-av img{width:24.875px;height:27.639px}
.pn-av.person{border-radius:50%;background:center/cover #ddd}
.pn-av.group{background:center/contain no-repeat #fff}
.pn-av.person i{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:5px;background:linear-gradient(#f2edea,#e7d8d2);display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.pn-av.person i img{width:10px;height:11px}
.pn-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.pn-row{display:flex;gap:8px;white-space:nowrap}
.pn-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pn-sub{font-weight:600}
.pn-body{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div id="phone" aria-live="polite"></div>
<script>
(() => {
  const A = '/assets/';
  const v = new URLSearchParams(location.search).get('v') || 'carpool-chat';
  const phone = document.getElementById('phone');
  const sb = light => `<div class="sb${light ? ' light' : ''}"><span>${light ? '' : '9:41'}</span><span><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>`;
  const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
  /* Ahmad, 22 Nov: the push = Figma "Push Notification" (13562:200846). Avatar per Figma "Push / Avatar": Sprout
     (clover tile), Person (photo + clover badge, asked in Sprout), Contact (photo, no badge: a text message),
     Group (the team or class logo). Title + "now", optional subtitle, body. */
  const PCLOVER = A + 'push-clover.png';
  const pushNote = ({ av = 'sprout', photo, title, sub = '', body = '' }) => {
    const avatar = av === 'person' ? `<span class="pn-av person" style="background-image:url(${photo})"><i><img src="${PCLOVER}" alt=""></i></span>`
      : av === 'contact' ? `<span class="pn-av person" style="background-image:url(${photo})"></span>`
      : av === 'group' ? `<span class="pn-av group" style="background-image:url(${photo})"></span>`
      : `<span class="pn-av"><img src="${PCLOVER}" alt=""></span>`;
    return `<button class="note pn" aria-label="Open the notification">${avatar}<span class="pn-tx"><span class="pn-row"><b>${title}</b><small>now</small></span>${sub ? `<span class="pn-sub">${sub}</span>` : ''}${body ? `<span class="pn-body">${body}</span>` : ''}</span></button>`;
  };
  /* the sample rows' pushes: "<b>Title</b><br>body" → Figma's parts */
  const fromText = (push, av, photo) => { const m = /^<b>(.*?)<\/b><br>([\s\S]*)$/.exec(push.text) || [0, push.app, push.text]; return pushNote({ av, photo, title:m[1], body:m[2] }); };
  /* the answer to tap pulses (a floating hint covered the buttons) */
  const hint = on => phone.querySelectorAll('[data-yes]').forEach(b => b.classList.toggle('nudge', !!on));
  const TONY = A + 'tony.webp', PRIYA = A + 'priya.webp', SPROUT = A + 'app-icon-180.png', ALEX = A + 'sitters/woman.webp', CLOVER = A + 'assist-clover.webp';

  const S = {
    'carpool-chat': {
      who: 'Priya Shah, Leo’s mom, on Jake’s SSC team',
      push: { app: 'Sprout', icon: SPROUT, when: 'now', text: '<b>Jake’s team</b><br>Tony needs a ride for Jake on Saturday at 9:30 AM. Can you help?' },
      thread() {
        return el(`<section class="view chat">${sb()}
          <div class="top"><span class="bk"><i class="ph ph-caret-left"></i></span><span class="lg" style="background-image:url(${A}ssc-logo.webp)"></span><div><b>Jake’s team</b><small>SSC Kids · U6 Blue · 12 families</small></div></div>
          <div class="log">
            <div class="m"><span class="av" style="background-image:url(${A}aisha.webp)"></span><div class="b"><small>Aisha · Ava’s mom</small>Great game last week, kids!</div></div>
            <div class="m in"><span class="av" style="background-image:url(${TONY})"></span><div class="b"><small>Tony · Jake’s dad</small>Hi everyone! Could anyone near us take Jake from home to soccer at Lakeline Park on Sat, Aug 1 at 9:30 AM? We’re on Banks Court. Happy to return the favor!</div></div>
            <div class="ride in" style="animation-delay:.25s"><div class="h"><img src="${A}illus/carpool.webp" alt=""><div><b>Ride for Jake</b><small>Sat, Aug 1 · 9:30 AM</small></div></div>
              <div class="f"><i class="ph ph-map-pin"></i>Banks Court to Lakeline Park, one way</div>
              <div class="f"><i class="ph ph-navigation-arrow"></i>0.8 mi from you · Leo plays too</div>
              <div class="two"><button data-no>Can’t at 9:30</button><button class="go" data-yes>I can drive</button></div>
              <button class="reply" data-reply>Reply to Tony</button></div>
          </div><div class="comp">Message Jake’s team</div></section>`);
      },
      /* C1 (Tony, 20 Nov US): "There should be those pre-automated selections... confirm, I can't, or reply. If they hit
         confirm, there needs to be that confirmation widget... saved to your calendars." The ride card becomes the
         confirmation: who you're driving, when, where, and that it's on your calendar. */
      yes(view, at = '9:30 AM', moved) {
        const card = view.querySelector('.ride');
        card.classList.add('done');
        card.querySelector('[data-reply]')?.remove();
        if (moved) card.querySelector('.h small').textContent = `Sat, Aug 1 · ${at}`;
        (card.querySelector('.two') || card.querySelector('.wait')).replaceWith(el(`<div class="conf in"><div class="ch"><i class="ph-fill ph-check-circle"></i>You’re driving Jake</div>
          <div class="f"><i class="ph ph-clock"></i>Pick up at ${at} · 10212 Banks Court</div>
          <div class="f"><i class="ph ph-flag-checkered"></i>Drop off at Lakeline Park</div>
          <div class="f"><i class="ph ph-calendar-check"></i>Added to your calendar · reminder at ${{ '9:30 AM':'9:00 AM', '9:45 AM':'9:15 AM', '10:00 AM':'9:30 AM', '9:00 AM':'8:30 AM', '10:15 AM':'9:45 AM' }[at]}</div></div>`));
        const log = view.querySelector('.log');
        /* no reply typed for Priya: Sprout never writes a template message as her (Tony on the playdate, same rule) */
        setTimeout(() => { log.append(el(`<div class="sys in"><i class="ph-fill ph-car-profile"></i>${moved ? `Tony moved pickup to ${at} · you’re driving Jake` : 'Priya is driving Jake · Tony was told'}</div>`));
          log.append(el(`<div class="m in"><span class="av" style="background-image:url(${TONY})"></span><div class="b"><small>Tony · Jake’s dad</small>Thank you Priya! He’ll be ready at ${at.replace(' AM', '')}.</div></div>`)); }, 900);
      },
      /* Ahmad, 21 Nov: "Can't" at the asked time usually means "I could at another time". Can't at 9:30 opens a time
         sheet: tick the times you could drive and Tony can move the pickup to fit; or say you can't drive at all. */
      no(view) {
        const T = ['9:00 AM', '9:45 AM', '10:00 AM', '10:15 AM'], on = new Set();
        const sheet = el(`<div class="tsheet"><div class="ts-scrim"></div><div class="ts-box in">
            <span class="ts-grab"></span>
            <b>When could you drive Jake?</b>
            <p>Sat, Aug 1 · Banks Court to Lakeline Park. Tony can move the pickup to fit you.</p>
            <div class="ts-multi"><i class="ph ph-checks"></i>Pick all that work</div>
            <div class="ts-times">${T.map(t => `<button type="button" data-t="${t}">${t}</button>`).join('')}</div>
            <button type="button" class="ts-send" disabled>Pick a time</button>
            <button type="button" class="ts-none">I can’t drive this time</button></div></div>`);
        view.append(sheet);
        const send = sheet.querySelector('.ts-send'), close = () => sheet.remove();
        sheet.querySelector('.ts-scrim').onclick = close;
        sheet.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
          on.has(b.dataset.t) ? on.delete(b.dataset.t) : on.add(b.dataset.t); b.classList.toggle('on', on.has(b.dataset.t));
          const picked = T.filter(t => on.has(t));
          /* Ahmad, 21 Nov: the button doesn't list the times (four made it wrap); the ticks already say which */
          send.disabled = !picked.length; send.textContent = !picked.length ? 'Pick a time' : picked.length > 1 ? 'I can drive at these times' : 'I can drive at this time';
        });
        sheet.querySelector('.ts-none').onclick = () => { close(); view.querySelector('.ride [data-reply]')?.remove();
          view.querySelector('.ride .two').replaceWith(el(`<div class="f in" style="margin-top:12px;color:var(--subtle)"><i class="ph ph-x-circle"></i>You said you can’t. Only Tony sees it.</div>`)); };
        send.onclick = () => {
          const picked = T.filter(t => on.has(t)); if (!picked.length) return;
          close(); view.querySelector('.ride [data-reply]')?.remove();
          view.querySelector('.ride .two').replaceWith(el(`<div class="f wait in"><span class="spin"></span>You offered ${picked.join(' or ')} · waiting on Tony</div>`));
          const log = view.querySelector('.log');
          log.append(el(`<div class="sys in"><i class="ph ph-clock"></i>You told Tony you could drive at ${picked.join(' or ')}</div>`));
          /* the demo plays Tony's side: he moves the pickup to her first time */
          setTimeout(() => this.yes(view, picked[0], true), 2200);
        };
      },
      reply(view) {
        const log = view.querySelector('.log');

      if (m.t === 'ask') { if (!(ask && ask.kind === m.kind && ask.who.n === m.who.n)) arrive(m); return; }
      if (!view) return;
      if (m.t === 'tony-text') fromTony(m.text);
      if (m.t === 'sms') smsFrom(m.from === 'Sprout' ? 'Sprout' : 'Tony Martin', m.text);
      if (m.t === 'moved') { ask.moved = true; confirmRide(m.at, true); }
      if (m.t === 'kept') { state(`<i class="ph ph-arrow-right"></i>Tony kept ${ask.at.l} and is asking others`); card().querySelector('[data-st]').style.color = 'var(--subtle)'; }
      if (m.t === 'set') {
        if (ask.kind === 'text') smsFrom('Sprout', `Thanks ${ask.who.ask}! You’re driving ${ask.riders} on ${ask.day} at ${m.at.l}. Pickup at ${ask.pickAddr}. Add it to your calendar: sprout.link/r/8KQ2`);
        else if (!ask.moved) sys('ph-fill ph-car-profile', `You’re driving ${esc(ask.riders)} · Tony was told`);
      }
      if (m.t === 'covered') { if (m.text && sms()) smsFrom('Sprout', m.text); else sys('ph-fill ph-car-profile', `${esc(m.by)} is driving ${esc(m.riders)} · thanks for checking`); }
      if (m.t === 'schedule') schedule(m);
      if (m.t === 'held') { const st = card().querySelector('[data-st]'); if (st) st.innerHTML = '<span class="spin"></span>You’re in · Tony hasn’t shared the turns yet'; }
    };
    send({ t:'hello' });
  }
})();
</script>
</body>
</html>
