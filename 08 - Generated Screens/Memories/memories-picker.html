<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>11.X – Memories – Select Multiple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --brand:    #186338;
  --brand-d:  #134f2d;
  --brand-dd: #1e3e2b;
  --bg:       #f4f1ea;
  --s1:       #eae6db;
  --s2:       #dbd5c8;
  --tp:       #4d525b;
  --ts:       #818898;
  --tt:       #b3b8c1;
  --border:   rgba(0,0,0,.07);
}

body {
  min-height: 100vh;
  background: linear-gradient(140deg, #aca49a 0%, #c9c2b4 50%, #a9a296 100%);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 52px 0 80px;
  font-family: 'Inter', -apple-system, sans-serif;
  user-select: none;
}

/* ── PHONE ── */
.phone {
  width: 393px; height: 852px;
  background: var(--bg);
  border-radius: 54px; overflow: hidden; position: relative;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 0 0 10px #1c1c1e, 0 0 0 12px #2c2c2e,
    0 60px 130px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
.phone::before {
  content: ''; position: absolute; left: -13px; top: 120px;
  width: 4px; height: 32px; background: #2a2a2a;
  border-radius: 2px 0 0 2px;
  box-shadow: 0 44px 0 #2a2a2a, 0 88px 0 #2a2a2a; z-index: 200;
}
.phone::after {
  content: ''; position: absolute; right: -13px; top: 148px;
  width: 4px; height: 66px; background: #2a2a2a;
  border-radius: 0 2px 2px 0; z-index: 200;
}
.island {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 34px; background: #0a0a0a;
  border-radius: 18px; z-index: 150; pointer-events: none;
}

/* ── STATUS BAR ── */
.sb {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 26px 0; height: 52px; flex-shrink: 0;
}
.sb-time { font-size: 15px; font-weight: 600; color: var(--tp); letter-spacing: -.01em; }
.sb-icons { display: flex; align-items: center; gap: 6px; }

/* ── NAV ── */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px 10px;
  background: var(--bg);
  flex-shrink: 0;
}
.nav-close {
  width: 36px; height: 36px; border-radius: 50%;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s;
}
.nav-close:active { opacity: .4; }
.nav-title {
  font-family: 'Playfair Display', serif;
  font-size: 17px; font-weight: 700;
  color: var(--brand-dd); letter-spacing: -.01em;
}
.nav-next {
  font-size: 15px; font-weight: 600;
  background: none; border: none; cursor: pointer;
  color: var(--tt); min-width: 44px; text-align: right;
  transition: color .2s;
  letter-spacing: -.01em;
}
.nav-next.active { color: var(--brand); }

/* ── PHOTO GRID ── */
.grid-wrap {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
.grid-wrap::-webkit-scrollbar { display: none; }

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
}

.photo-cell {
  aspect-ratio: 1;
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transition: opacity .15s;
}
.photo-cell:active { opacity: .85; }

/* Camera cell */
.camera-cell {
  background: #152418;
  display: flex; align-items: center; justify-content: center;
}

/* Photo placeholder using gradients */
.photo-cell .photo-bg {
  position: absolute; inset: 0;
  transition: transform .2s;
}
.photo-cell:active .photo-bg { transform: scale(.96); }

/* Selection overlay */
.photo-cell.selected .photo-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(24,99,56,.18);
}
.photo-cell.selected {
  outline: 3px solid var(--brand);
  outline-offset: -3px;
  z-index: 2;
}

/* Badge */
.sel-badge {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--brand);
  display: none; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.photo-cell.selected .sel-badge { display: flex; }

/* Unselected circle (empty ring) */
.empty-ring {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.8);
  background: rgba(0,0,0,.1);
}
.photo-cell.selected .empty-ring { display: none; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  flex-shrink: 0;
  background: var(--bg);
  border-top: .5px solid var(--border);
  padding: 10px 14px 32px;
  display: flex; align-items: center; gap: 10px;
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.25,.46,.45,.94);
}
.bottom-bar.visible { transform: translateY(0); }

.cam-btn-sm {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--s1); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
}

.sel-strip {
  flex: 1; display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.sel-strip::-webkit-scrollbar { display: none; }

.sel-thumb {
  width: 46px; height: 46px; border-radius: 8px;
  position: relative; flex-shrink: 0;
  overflow: hidden; cursor: pointer;
  transition: transform .15s;
}
.sel-thumb:active { transform: scale(.92); }
.sel-thumb .thumb-bg { position: absolute; inset: 0; }
.sel-thumb .thumb-num {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--brand);
  font-size: 10px; font-weight: 700; color: #fff;
  display: flex; align-items: center; justify-content: center;
}

.btn-post {
  flex-shrink: 0;
  padding: 13px 22px;
  background: var(--brand); color: #fff;
  border: none; border-radius: 99px;
  font-family: 'Inter', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .15s;
  letter-spacing: -.01em;
}
.btn-post:active { transform: scale(.95); background: var(--brand-d); }

</style>
</head>
<body>

<div class="phone">
  <span class="island" aria-hidden></span>

  <!-- Status bar -->
  <div class="sb">
    <span class="sb-time">9:41</span>
    <span class="sb-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0"    y="8"   width="3" height="4"   rx=".5" fill="#4d525b"/>
        <rect x="4.5"  y="5.5" width="3" height="6.5" rx=".5" fill="#4d525b"/>
        <rect x="9"    y="3"   width="3" height="9"   rx=".5" fill="#4d525b"/>
        <rect x="13.5" y="0"   width="3" height="12"  rx=".5" fill="#4d525b"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M8 2.5C5.4 2.5 3.1 3.5 1.4 5.2l1.2 1.2C4 5.1 5.9 4.3 8 4.3s4 .8 5.4 2.1l1.2-1.2C12.9 3.5 10.6 2.5 8 2.5z" fill="#4d525b"/>
        <path d="M4.2 7.5l1.2 1.2C6.1 8 7 7.6 8 7.6s1.9.4 2.6 1.1l1.2-1.2C10.6 6.3 9.4 5.8 8 5.8s-2.6.5-3.8 1.7z" fill="#4d525b"/>
        <circle cx="8" cy="11" r="1.4" fill="#4d525b"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x=".5" y=".5" width="21" height="11" rx="2.5" stroke="#4d525b" stroke-opacity=".38"/>
        <rect x="22" y="4"  width="2"  height="4"  rx=".8"  fill="#4d525b" fill-opacity=".38"/>
        <rect x="2"  y="2"  width="18" height="8"  rx="1.5" fill="#4d525b"/>
      </svg>
    </span>
  </div>

  <!-- Nav -->
  <div class="nav">
    <button class="nav-close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 2l12 12M14 2L2 14" stroke="#1e3e2b" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <span class="nav-title">Select your moments</span>
    <button class="nav-next" id="next-btn" aria-label="Next">Next</button>
  </div>

  <!-- Photo Grid -->
  <div class="grid-wrap">
    <div class="photo-grid" id="photo-grid">

      <!-- Camera cell -->
      <div class="photo-cell camera-cell">
        <svg width="32" height="28" viewBox="0 0 32 28" fill="none">
          <path d="M11 4H21L24 8H28C29.1 8 30 8.9 30 10V22C30 23.1 29.1 24 28 24H4C2.9 24 2 23.1 2 22V10C2 8.9 2.9 8 4 8H8L11 4Z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="5" stroke="white" stroke-width="1.8"/>
        </svg>
      </div>

      <!-- Photo cells — 17 photos -->
      <!-- Each has a .photo-bg div for gradient, .empty-ring, .sel-badge -->

    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar" id="bottom-bar">
    <button class="cam-btn-sm" aria-label="Camera">
      <svg width="20" height="18" viewBox="0 0 20 18" fill="none">
        <path d="M7 2H13L15.5 5H18C18.6 5 19 5.4 19 6V15C19 15.6 18.6 16 18 16H2C1.4 16 1 15.6 1 15V6C1 5.4 1.4 5 2 5H4.5L7 2Z" stroke="#818898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="10.5" r="3.5" stroke="#818898" stroke-width="1.5"/>
      </svg>
    </button>
    <div class="sel-strip" id="sel-strip"></div>
    <button class="btn-post" id="post-btn">Post</button>
  </div>

</div>

<script>
// Photo data — gradient pairs representing different photos
const photos = [
  { a: '#c9a882', b: '#8a6a4a', label: '👨' }, // warm portrait
  { a: '#4a90d9', b: '#7b2d8b', label: '' },    // blue-purple abstract
  { a: '#2ecc71', b: '#1a7a4a', label: '' },    // green nature
  { a: '#5b2d8b', b: '#1a6ab5', label: '' },    // purple-blue
  { a: '#f5a623', b: '#e74c3c', label: '' },    // orange-red sunset
  { a: '#1abc9c', b: '#3498db', label: '' },    // teal-blue
  { a: '#e8c4a0', b: '#c49a6a', label: '' },    // warm tan
  { a: '#1a237e', b: '#4a148c', label: '' },    // dark indigo
  { a: '#d4e8d0', b: '#a8c8a0', label: '' },    // soft green
  { a: '#212121', b: '#37474f', label: '' },    // dark abstract
  { a: '#ff9800', b: '#e91e63', label: '' },    // orange-pink
  { a: '#607d8b', b: '#90a4ae', label: '' },    // blue-grey
  { a: '#ff6b35', b: '#f7c59f', label: '' },    // warm sunset
  { a: '#00897b', b: '#4db6ac', label: '' },    // teal
  { a: '#8d6e63', b: '#a1887f', label: '' },    // warm brown
  { a: '#5c6bc0', b: '#9575cd', label: '' },    // blue-lavender
  { a: '#80cbc4', b: '#26a69a', label: '' },    // mint-teal
];

const grid = document.getElementById('photo-grid');
const nextBtn = document.getElementById('next-btn');
const bottomBar = document.getElementById('bottom-bar');
const selStrip = document.getElementById('sel-strip');
const postBtn = document.getElementById('post-btn');

// Build grid cells
photos.forEach((p, i) => {
  const cell = document.createElement('div');
  cell.className = 'photo-cell';
  cell.dataset.index = i;

  cell.innerHTML = `
    <div class="photo-bg" style="background:linear-gradient(135deg,${p.a},${p.b});position:absolute;inset:0;"></div>
    <div class="empty-ring"></div>
    <div class="sel-badge"></div>
  `;
  cell.addEventListener('click', () => toggleSelect(i));
  grid.appendChild(cell);
});

let selected = []; // array of photo indices in selection order

function toggleSelect(index) {
  const pos = selected.indexOf(index);
  if (pos === -1) {
    selected.push(index);
  } else {
    selected.splice(pos, 1);
  }
  render();
}

function render() {
  // Update each cell
  photos.forEach((_, i) => {
    const cell = grid.children[i + 1]; // +1 for camera cell
    const pos = selected.indexOf(i);
    const badge = cell.querySelector('.sel-badge');

    if (pos === -1) {
      cell.classList.remove('selected');
      badge.textContent = '';
    } else {
      cell.classList.add('selected');
      badge.textContent = pos + 1;
    }
  });

  // Nav Next button
  if (selected.length > 0) {
    nextBtn.classList.add('active');
    nextBtn.textContent = `Next`;
  } else {
    nextBtn.classList.remove('active');
    nextBtn.textContent = 'Next';
  }

  // Bottom bar
  if (selected.length > 0) {
    bottomBar.classList.add('visible');
    postBtn.textContent = `Post ${selected.length > 1 ? '(' + selected.length + ')' : ''}`.trim();
  } else {
    bottomBar.classList.remove('visible');
  }

  // Thumbnail strip
  selStrip.innerHTML = '';
  selected.forEach((photoIdx, order) => {
    const p = photos[photoIdx];
    const thumb = document.createElement('div');
    thumb.className = 'sel-thumb';
    thumb.innerHTML = `
      <div class="thumb-bg" style="background:linear-gradient(135deg,${p.a},${p.b});position:absolute;inset:0;"></div>
      <div class="thumb-num">${order + 1}</div>
    `;
    thumb.addEventListener('click', () => toggleSelect(photoIdx));
    selStrip.appendChild(thumb);
  });
}

render();
</script>
</body>
</html>
