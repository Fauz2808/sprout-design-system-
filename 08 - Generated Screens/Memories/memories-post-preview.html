<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>11.6 – Memories – Post Multiple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --brand:    #186338;
  --brand-d:  #134f2d;
  --brand-dd: #1e3e2b;
  --bg:       #f4f1ea;
  --s1:       #eae6db;
  --s2:       #dbd5c8;
  --tp:       #4d525b;
  --ts:       #818898;
  --tt:       #b3b8c1;
}

body {
  min-height: 100vh;
  background: linear-gradient(140deg, #aca49a 0%, #c9c2b4 50%, #a9a296 100%);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 52px 0 80px;
  font-family: 'Inter', -apple-system, sans-serif;
  user-select: none;
}

/* ── PHONE ── */
.phone {
  width: 393px; height: 852px;
  background: var(--bg);
  border-radius: 54px; overflow: hidden; position: relative;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 0 0 10px #1c1c1e, 0 0 0 12px #2c2c2e,
    0 60px 130px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
.phone::before {
  content: ''; position: absolute; left: -13px; top: 120px;
  width: 4px; height: 32px; background: #2a2a2a;
  border-radius: 2px 0 0 2px;
  box-shadow: 0 44px 0 #2a2a2a, 0 88px 0 #2a2a2a; z-index: 200;
}
.phone::after {
  content: ''; position: absolute; right: -13px; top: 148px;
  width: 4px; height: 66px; background: #2a2a2a;
  border-radius: 0 2px 2px 0; z-index: 200;
}
.island {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 34px; background: #0a0a0a;
  border-radius: 18px; z-index: 150; pointer-events: none;
}

/* ── STATUS BAR ── */
.statusbar {
  height: 59px; flex-shrink: 0;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 10px;
  position: relative; z-index: 10;
}
.statusbar .time {
  font-size: 15px; font-weight: 600; color: var(--brand-dd);
  letter-spacing: -.02em;
}
.statusbar .icons { display: flex; align-items: center; gap: 6px; }
.statusbar svg { display: block; }

/* ── NAV BAR ── */
.navbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 48px; flex-shrink: 0;
}
.nav-close {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.nav-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  color: var(--brand-dd); letter-spacing: -.02em;
}
.nav-next {
  font-size: 15px; font-weight: 600;
  color: var(--brand);
  background: none; border: none; cursor: pointer;
  font-family: 'Inter', sans-serif;
  padding: 0; letter-spacing: -.01em;
}

/* ── CAROUSEL AREA ── */
.carousel-wrap {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 16px 0 0;
  overflow: hidden;
}

.carousel-track-outer {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.carousel-track {
  display: flex;
  height: 100%;
  gap: 12px;
  padding: 0 20px;
  transition: transform 0.38s cubic-bezier(.4,0,.2,1);
}

.carousel-slide {
  flex-shrink: 0;
  width: calc(393px - 40px - 32px); /* viewport - side padding*2 - peek */
  height: 100%;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}

/* Photo gradient placeholders mimicking real photos */
.slide-0 { background: linear-gradient(160deg, #b8c9c0 0%, #7a9e89 40%, #4d7a63 100%); }
.slide-1 { background: linear-gradient(145deg, #d4c5b0 0%, #b8a48c 40%, #8c7a68 100%); }
.slide-2 { background: linear-gradient(155deg, #c2c9d4 0%, #8a9ab0 40%, #5e7288 100%); }
.slide-3 { background: linear-gradient(150deg, #d4c4b8 0%, #c09a80 40%, #8c6655 100%); }

/* Simulated photo content */
.slide-photo {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.slide-photo::before {
  content: '';
  position: absolute; inset: 0;
  background: inherit;
}
.photo-figure {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: 8px;
}
.photo-figure svg { opacity: .25; }
.photo-figure span {
  font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,.5);
  letter-spacing: .02em;
}

/* Remove badge on each slide */
.slide-remove {
  position: absolute; top: 12px; right: 12px; z-index: 10;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0,0,0,.45); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none;
}

/* Slide number badge */
.slide-num {
  position: absolute; top: 12px; left: 12px; z-index: 10;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--brand); color: #fff;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ── DOTS ── */
.dots {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 16px 0 12px;
  flex-shrink: 0;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--tt); transition: all .3s ease;
  cursor: pointer;
}
.dot.active {
  width: 18px; border-radius: 999px;
  background: var(--brand);
}

/* ── CAPTION INPUT ── */
.caption-wrap {
  padding: 0 20px 12px; flex-shrink: 0;
}
.caption-box {
  background: var(--s1);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex; align-items: flex-start; gap: 10px;
}
.caption-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(145deg, #5e9a72, #186338);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 12px; font-weight: 700; color: #fff;
}
.caption-input {
  flex: 1;
  background: none; border: none; outline: none;
  font-family: 'Inter', sans-serif;
  font-size: 14px; color: var(--tp);
  resize: none; line-height: 1.5;
  padding: 2px 0;
}
.caption-input::placeholder { color: var(--tt); }

/* ── AUDIENCE ROW ── */
.audience-row {
  padding: 0 20px 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
}
.audience-label {
  display: flex; align-items: center; gap: 8px;
}
.audience-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--s1);
  display: flex; align-items: center; justify-content: center;
}
.audience-text {
  font-size: 13px; font-weight: 500; color: var(--tp);
}
.audience-sub {
  font-size: 11px; color: var(--ts); margin-top: 1px;
}
.audience-arrow {
  display: flex; align-items: center;
  font-size: 12px; color: var(--ts); gap: 4px;
}

/* ── POST BUTTON ── */
.post-btn-wrap {
  padding: 0 20px 16px; flex-shrink: 0;
}
.post-btn {
  width: 100%; height: 52px;
  background: var(--brand); color: #fff;
  border: none; border-radius: 16px;
  font-family: 'Inter', sans-serif;
  font-size: 16px; font-weight: 600;
  letter-spacing: -.01em;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s;
}
.post-btn:active { background: var(--brand-d); }

/* ── THUMBNAIL STRIP ── */
.thumb-strip {
  padding: 0 20px 12px; flex-shrink: 0;
  display: flex; gap: 8px; align-items: center;
}
.thumb {
  width: 52px; height: 52px; border-radius: 10px;
  overflow: hidden; flex-shrink: 0; position: relative;
  cursor: pointer; transition: transform .15s;
}
.thumb:active { transform: scale(.95); }
.thumb.active-thumb {
  outline: 2.5px solid var(--brand);
  outline-offset: 2px;
}
.thumb-img {
  width: 100%; height: 100%;
}
.thumb-num {
  position: absolute; top: 4px; left: 4px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--brand); color: #fff;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.thumb-add {
  width: 52px; height: 52px; border-radius: 10px;
  border: 1.5px dashed var(--tt);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer;
}

/* ── HOME INDICATOR ── */
.home-indicator {
  height: 34px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.home-indicator div {
  width: 134px; height: 5px;
  background: var(--brand-dd); border-radius: 999px; opacity: .18;
}

</style>
</head>
<body>

<div class="phone">
  <div class="island"></div>

  <!-- Status Bar -->
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0" y="3" width="3" height="9" rx="1" fill="#1e3e2b"/>
        <rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1e3e2b"/>
        <rect x="9" y="0" width="3" height="12" rx="1" fill="#1e3e2b"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1e3e2b" opacity=".3"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#1e3e2b">
        <path d="M8 2.4C10.5 2.4 12.7 3.5 14.2 5.2L15.5 3.9C13.6 1.8 11 .6 8 .6 5 .6 2.4 1.8.5 3.9l1.3 1.3C3.3 3.5 5.5 2.4 8 2.4z" opacity=".4"/>
        <path d="M8 5.2c1.7 0 3.2.7 4.3 1.9l1.3-1.3C12.1 4.1 10.2 3.2 8 3.2c-2.2 0-4.1.9-5.6 2.6l1.3 1.3C4.8 5.9 6.3 5.2 8 5.2z" opacity=".7"/>
        <path d="M8 8c1 0 1.9.4 2.5 1l1.3-1.3C10.7 6.7 9.4 6 8 6s-2.7.7-3.8 1.7L5.5 9C6.1 8.4 7 8 8 8z"/>
        <circle cx="8" cy="11" r="1.5"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#1e3e2b" stroke-opacity=".35"/>
        <rect x="2" y="2" width="17" height="8" rx="2" fill="#1e3e2b"/>
        <path d="M23 4.5v3a1.5 1.5 0 000-3z" fill="#1e3e2b" opacity=".4"/>
      </svg>
    </div>
  </div>

  <!-- Nav Bar -->
  <div class="navbar">
    <div class="nav-close" onclick="goBack()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M14 4L4 14M4 4l10 10" stroke="#1e3e2b" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="nav-title">Share moment</div>
    <div style="width:36px"></div>
  </div>

  <!-- Carousel -->
  <div class="carousel-wrap">
    <div class="carousel-track-outer">
      <div class="carousel-track" id="track">

        <!-- Slide 1 -->
        <div class="carousel-slide slide-0" onclick="setSlide(0)">
          <div class="slide-photo">
            <div class="photo-figure">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <path d="M6 16c0-2.2 1.8-4 4-4h4l3-4h14l3 4h4c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H10c-2.2 0-4-1.8-4-4V16z" stroke="white" stroke-width="2"/>
                <circle cx="24" cy="26" r="7" stroke="white" stroke-width="2"/>
              </svg>
              <span>PHOTO 1</span>
            </div>
          </div>
          <div class="slide-num">1</div>
          <button class="slide-remove" onclick="removeSlide(event,0)">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M10 2L2 10M2 2l8 8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-slide slide-1" onclick="setSlide(1)">
          <div class="slide-photo">
            <div class="photo-figure">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <path d="M6 16c0-2.2 1.8-4 4-4h4l3-4h14l3 4h4c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H10c-2.2 0-4-1.8-4-4V16z" stroke="white" stroke-width="2"/>
                <circle cx="24" cy="26" r="7" stroke="white" stroke-width="2"/>
              </svg>
              <span>PHOTO 2</span>
            </div>
          </div>
          <div class="slide-num">2</div>
          <button class="slide-remove" onclick="removeSlide(event,1)">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M10 2L2 10M2 2l8 8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-slide slide-2" onclick="setSlide(2)">
          <div class="slide-photo">
            <div class="photo-figure">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <path d="M6 16c0-2.2 1.8-4 4-4h4l3-4h14l3 4h4c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H10c-2.2 0-4-1.8-4-4V16z" stroke="white" stroke-width="2"/>
                <circle cx="24" cy="26" r="7" stroke="white" stroke-width="2"/>
              </svg>
              <span>PHOTO 3</span>
            </div>
          </div>
          <div class="slide-num">3</div>
          <button class="slide-remove" onclick="removeSlide(event,2)">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M10 2L2 10M2 2l8 8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- Slide 4 -->
        <div class="carousel-slide slide-3" onclick="setSlide(3)">
          <div class="slide-photo">
            <div class="photo-figure">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <path d="M6 16c0-2.2 1.8-4 4-4h4l3-4h14l3 4h4c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H10c-2.2 0-4-1.8-4-4V16z" stroke="white" stroke-width="2"/>
                <circle cx="24" cy="26" r="7" stroke="white" stroke-width="2"/>
              </svg>
              <span>PHOTO 4</span>
            </div>
          </div>
          <div class="slide-num">4</div>
          <button class="slide-remove" onclick="removeSlide(event,3)">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M10 2L2 10M2 2l8 8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Dots -->
    <div class="dots" id="dots">
      <div class="dot active" onclick="setSlide(0)"></div>
      <div class="dot" onclick="setSlide(1)"></div>
      <div class="dot" onclick="setSlide(2)"></div>
      <div class="dot" onclick="setSlide(3)"></div>
    </div>
  </div>

  <!-- Thumbnail Strip -->
  <div class="thumb-strip" id="thumbStrip">
    <div class="thumb thumb-0 active-thumb" onclick="setSlide(0)">
      <div class="thumb-img slide-0" style="width:100%;height:100%;"></div>
      <div class="thumb-num">1</div>
    </div>
    <div class="thumb thumb-1" onclick="setSlide(1)">
      <div class="thumb-img slide-1" style="width:100%;height:100%;"></div>
      <div class="thumb-num">2</div>
    </div>
    <div class="thumb thumb-2" onclick="setSlide(2)">
      <div class="thumb-img slide-2" style="width:100%;height:100%;"></div>
      <div class="thumb-num">3</div>
    </div>
    <div class="thumb thumb-3" onclick="setSlide(3)">
      <div class="thumb-img slide-3" style="width:100%;height:100%;"></div>
      <div class="thumb-num">4</div>
    </div>
    <div class="thumb-add" title="Add more">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 3v12M3 9h12" stroke="#b3b8c1" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- Caption -->
  <div class="caption-wrap">
    <div class="caption-box">
      <div class="caption-avatar">SM</div>
      <textarea class="caption-input" rows="2" placeholder="Say something about this moment…"></textarea>
    </div>
  </div>

  <!-- Audience Row -->
  <div class="audience-row">
    <div class="audience-label">
      <div class="audience-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="6" cy="5" r="2.5" stroke="#818898" stroke-width="1.4"/>
          <path d="M1 13c0-2.8 2.2-5 5-5" stroke="#818898" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="11.5" cy="7" r="2" stroke="#818898" stroke-width="1.4"/>
          <path d="M9 13c0-1.7.9-3.1 2.5-3.1S14 11.3 14 13" stroke="#818898" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="audience-text">Miss Taylor's Class</div>
        <div class="audience-sub">25 parents · Kindergarten</div>
      </div>
    </div>
    <div class="audience-arrow">
      Change
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M5 3l4 4-4 4" stroke="#818898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- Post Button -->
  <div class="post-btn-wrap">
    <button class="post-btn">
      Post 4 photos
    </button>
  </div>

  <!-- Home Indicator -->
  <div class="home-indicator"><div></div></div>
</div>

<script>
let current = 0;
const total = 4;
const slideWidth = 393 - 40 - 32 + 12; // slide width + gap

function setSlide(i) {
  current = i;
  const track = document.getElementById('track');
  track.style.transform = `translateX(${-i * slideWidth}px)`;

  // Update dots
  document.querySelectorAll('.dot').forEach((d, idx) => {
    d.classList.toggle('active', idx === i);
  });

  // Update thumb active state
  document.querySelectorAll('.thumb').forEach((t, idx) => {
    t.classList.toggle('active-thumb', idx === i);
  });
}

function removeSlide(e, i) {
  e.stopPropagation();
  // In prototype just nudge to next visible slide
  if (current >= total - 1) setSlide(Math.max(0, current - 1));
  else setSlide(current);
}

function goBack() {
  // no-op in prototype
}

// Swipe support
let startX = 0;
const trackOuter = document.querySelector('.carousel-track-outer');
trackOuter.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
trackOuter.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (dx < -40 && current < total - 1) setSlide(current + 1);
  else if (dx > 40 && current > 0) setSlide(current - 1);
});
</script>

</body>
</html>
