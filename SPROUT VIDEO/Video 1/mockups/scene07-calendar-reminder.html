<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#c9c4b6; display:flex; justify-content:center; align-items:center; padding:60px; font-family:'Inter',sans-serif; }
  .frame { width:393px; height:852px; border-radius:52px; overflow:hidden; position:relative; box-shadow:0 40px 80px rgba(0,0,0,0.35);
    background: radial-gradient(circle at 30% 15%, #2a5540 0%, #16321f 45%, #0a1a12 100%); }
  .statusbar { height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 32px; font-weight:600; font-size:15px; color:#fff; position:relative; z-index:2; }
  .statusicons { display:flex; align-items:center; gap:5px; }
  .signal { display:flex; gap:2px; align-items:flex-end; }
  .signal span { width:3px; background:#fff; border-radius:1px; }
  .signal span:nth-child(1){height:4px;} .signal span:nth-child(2){height:6px;} .signal span:nth-child(3){height:8px;} .signal span:nth-child(4){height:10px;}
  .wifi { width:15px; height:11px; border:2px solid #fff; border-radius:50% 50% 0 0 / 100% 100% 0 0; border-bottom:none; }
  .battery { width:24px; height:12px; border:1.4px solid #fff; border-radius:3px; position:relative; }
  .battery::after { content:''; position:absolute; right:-3px; top:3px; width:2px; height:6px; background:#fff; border-radius:0 1px 1px 0; }
  .battery::before { content:''; position:absolute; top:1.5px; left:1.5px; bottom:1.5px; width:16px; background:#fff; border-radius:1.5px; }

  .clock { text-align:center; margin-top:26px; }
  .clock .time { font-weight:200; font-size:88px; color:#fff; letter-spacing:-2px; line-height:1; }
  .clock .date { font-weight:500; font-size:17px; color:rgba(255,255,255,0.85); margin-top:4px; }

  .notifstack { position:absolute; left:16px; right:16px; top:280px; display:flex; flex-direction:column; gap:10px; }
  .notif { background:rgba(255,255,255,0.16); backdrop-filter:blur(20px); border-radius:20px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
  .icon { width:32px; height:32px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .icon.cal { background:#fff; color:#e04b3f; font-weight:700; font-size:13px; }
  .icon.sprout { background:#186338; }
  .icon.sprout img { width:24px; height:24px; border-radius:6px; object-fit:cover; }
  .notifbody { flex:1; }
  .notiftop { display:flex; justify-content:space-between; }
  .appname { font-size:13px; font-weight:600; color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.02em; }
  .notiftime { font-size:12.5px; color:rgba(255,255,255,0.55); }
  .notiftitle { font-size:15px; font-weight:700; color:#fff; margin-top:2px; }
  .notiftext { font-size:14.5px; color:rgba(255,255,255,0.9); margin-top:1px; line-height:1.3; }
</style><link rel="stylesheet" href="scene-system.css"></head>
<body class="motion-ready scene07">
<div class="frame">
  <div class="statusbar">
    <span>9:41</span>
    <div class="statusicons">
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="wifi"></div>
      <div class="battery"></div>
    </div>
  </div>

  <div class="clock">
    <div class="time">9:41</div>
    <div class="date">Wednesday, August 12</div>
  </div>

  <div class="notifstack">
    <div class="notif">
      <div class="icon cal">31</div>
      <div class="notifbody">
        <div class="notiftop"><span class="appname">Calendar</span><span class="notiftime">now</span></div>
        <div class="notiftitle">School calendar synced</div>
        <div class="notiftext">You're all set — Sprout will handle the reminders from here ✅</div>
      </div>
    </div>
    <div class="notif">
      <div class="icon sprout"><img src="../../Sprout_Logo123.png_202607312032.jpeg"></div>
      <div class="notifbody">
        <div class="notiftop"><span class="appname">Sprout</span><span class="notiftime">now</span></div>
        <div class="notiftitle">👕 Reminder: Free Dress Day tomorrow</div>
        <div class="notiftext">No uniforms needed — sent to the whole group.</div>
      </div>
    </div>
  </div>
</div>
</body></html>
