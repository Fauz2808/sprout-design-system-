<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scene-system.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; display:grid; place-items:center; font-family:Inter,sans-serif; }
  .frame { position:relative; overflow:hidden; background:#f4f1ea; display:grid; place-items:center; }
  .phone { width:344px; height:746px; border:11px solid #101612; border-radius:54px; overflow:hidden; background:#f4f1ea; box-shadow:0 34px 70px rgba(15,34,24,.18); animation:phone-in 720ms cubic-bezier(.16,1,.3,1) both; }
  .phone img { width:100%; height:100%; object-fit:cover; object-position:top center; }
  .label { display:none; }
  .label span { display:block; color:#186338; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; }
  .label strong { display:block; margin-top:5px; font-family:'Playfair Display',serif; font-size:30px; line-height:1.08; }
  @keyframes phone-in { from { opacity:0; transform:translateY(46px) scale(.95); } to { opacity:1; transform:none; } }
</style></head>
<body>
<div class="frame">
  <div class="label"><span>Meet Sprout</span><strong>Your village, in one place.</strong></div>
  <div class="phone"><img src="../../7.1_-_Home_-_Daily_202607312032.jpeg" alt="Sprout daily briefing screen"></div>
</div>
</body></html>
