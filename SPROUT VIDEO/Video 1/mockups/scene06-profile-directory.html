<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#c9c4b6; display:flex; justify-content:center; align-items:center; padding:60px; font-family:'Inter',sans-serif; }
  .frame { width:393px; height:852px; background:#f4f1ea; border-radius:52px; overflow:hidden; position:relative; box-shadow:0 40px 80px rgba(0,0,0,0.35); }
  .statusbar { height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 32px; font-weight:600; font-size:15px; color:#2a2e25; }
  .statusicons { display:flex; align-items:center; gap:5px; }
  .signal { display:flex; gap:2px; align-items:flex-end; }
  .signal span { width:3px; background:#2a2e25; border-radius:1px; }
  .signal span:nth-child(1){height:4px;} .signal span:nth-child(2){height:6px;} .signal span:nth-child(3){height:8px;} .signal span:nth-child(4){height:10px;}
  .wifi { width:15px; height:11px; border:2px solid #2a2e25; border-radius:50% 50% 0 0 / 100% 100% 0 0; border-bottom:none; }
  .battery { width:24px; height:12px; border:1.4px solid #2a2e25; border-radius:3px; position:relative; }
  .battery::after { content:''; position:absolute; right:-3px; top:3px; width:2px; height:6px; background:#2a2e25; border-radius:0 1px 1px 0; }
  .battery::before { content:''; position:absolute; top:1.5px; left:1.5px; bottom:1.5px; width:16px; background:#2a2e25; border-radius:1.5px; }

  .header { padding:8px 24px 4px; }
  .header .eyebrow { font-size:13px; font-weight:600; color:#186338; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }
  .header h1 { font-family:'Playfair Display',serif; font-weight:700; font-size:30px; color:#0f2218; }
  .header p { font-size:14.5px; color:#818898; margin-top:4px; }

  .grid { padding:18px 20px 0; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .card { background:#ffffff; border-radius:20px; padding:18px 14px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; box-shadow:0 6px 18px rgba(15,34,24,0.06); position:relative; }
  .avatar { width:96px; height:96px; border-radius:50%; margin-bottom:10px; border:3px solid #f4f1ea; box-shadow:0 0 0 3px #d0dacf; background-repeat:no-repeat; }
  .avatar.emma { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:450.56px 245.76px; background-position:-117.12px -16px; }
  .avatar.david { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:1126.4px 614.4px; background-position:-1016px -480px; }
  .avatar.sarah { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:965.7px 526.6px; background-position:-75.4px -307.2px; }
  .avatar.mike { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:965.7px 526.6px; background-position:-246.9px -307.2px; }
  .online { position:absolute; width:14px; height:14px; background:#186338; border:2.5px solid #fff; border-radius:50%; top:16px; right:16px; }
  .name { font-weight:700; font-size:16.5px; color:#2a2e25; }
  .role { font-size:13px; color:#818898; margin-top:2px; }
</style><link rel="stylesheet" href="scene-system.css"></head>
<body class="motion-ready scene06">
<div class="frame">
  <div class="statusbar">
    <span>9:41</span>
    <div class="statusicons">
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="wifi"></div>
      <div class="battery"></div>
    </div>
  </div>

  <div class="header">
    <div class="eyebrow">Little Shots ⚽</div>
    <h1>Your Village</h1>
    <p>Real profiles. Real names. Real faces.</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="online"></div>
      <div class="avatar emma"></div>
      <div class="name">Emma</div>
      <div class="role">Mason's mom</div>
    </div>
    <div class="card">
      <div class="online"></div>
      <div class="avatar david"></div>
      <div class="name">David</div>
      <div class="role">Lily's dad</div>
    </div>
    <div class="card">
      <div class="avatar sarah"></div>
      <div class="name">Sarah</div>
      <div class="role">Team photographer</div>
    </div>
    <div class="card">
      <div class="online"></div>
      <div class="avatar mike"></div>
      <div class="name">Mike</div>
      <div class="role">Team treasurer</div>
    </div>
  </div>
</div>
</body></html>
