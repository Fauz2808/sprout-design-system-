<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#c9c4b6; display:flex; justify-content:center; align-items:center; padding:60px; font-family:'Inter',sans-serif; }
  .frame { width:393px; height:852px; background:#f4f1ea; border-radius:52px; overflow:hidden; position:relative; box-shadow:0 40px 80px rgba(0,0,0,0.35); }
  .statusbar { height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 32px; font-weight:600; font-size:15px; color:#2a2e25; }
  .statusicons { display:flex; align-items:center; gap:5px; }
  .signal { display:flex; gap:2px; align-items:flex-end; }
  .signal span { width:3px; background:#2a2e25; border-radius:1px; }
  .signal span:nth-child(1){height:4px;} .signal span:nth-child(2){height:6px;} .signal span:nth-child(3){height:8px;} .signal span:nth-child(4){height:10px;}
  .wifi { width:15px; height:11px; border:2px solid #2a2e25; border-radius:50% 50% 0 0 / 100% 100% 0 0; border-bottom:none; }
  .battery { width:24px; height:12px; border:1.4px solid #2a2e25; border-radius:3px; position:relative; }
  .battery::after { content:''; position:absolute; right:-3px; top:3px; width:2px; height:6px; background:#2a2e25; border-radius:0 1px 1px 0; }
  .battery::before { content:''; position:absolute; top:1.5px; left:1.5px; bottom:1.5px; width:16px; background:#2a2e25; border-radius:1.5px; }

  .header { padding:8px 24px 4px; }
  .header .eyebrow { font-size:13px; font-weight:600; color:#186338; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }
  .header h1 { font-family:'Playfair Display',serif; font-weight:700; font-size:28px; color:#0f2218; }

  .cardwrap { padding:20px 20px 0; }
  .card { background:#ffffff; border-radius:22px; overflow:hidden; box-shadow:0 10px 30px rgba(15,34,24,0.08); }
  .banner { height:150px; background:linear-gradient(135deg,#e8c49a 0%,#d9a86e 100%); display:flex; align-items:center; justify-content:center; font-size:56px; }
  .cardbody { padding:16px 18px 18px; }
  .cardtitle { font-weight:700; font-size:19px; color:#2a2e25; }
  .cardmeta { font-size:14px; color:#818898; margin-top:3px; display:flex; align-items:center; gap:6px; }

  .friendsrow { display:flex; align-items:center; gap:10px; margin-top:16px; }
  .stack { display:flex; }
  .stack .a { width:34px; height:34px; border-radius:50%; margin-left:-10px; border:2.5px solid #fff; background:#dfe2e6; }
  .stack .a:first-child { margin-left:0; }
  .stack .liam { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (1).jpeg"); background-size:262.9px 143.4px; background-position:-68.3px -9.34px; }
  .stack .init { display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; }
  .stack .init.l { background:#186338; }
  .stack .init.n { background:#f9b84a; }
  .friendstext { font-size:14.5px; color:#4d525b; font-weight:500; }
  .friendstext b { color:#2a2e25; }

  .rsvpbtn { margin-top:16px; background:#186338; color:#f4f1ea; font-weight:600; font-size:15.5px; text-align:center; padding:12px; border-radius:14px; }

  .footnote { padding:14px 24px 0; font-size:13.5px; color:#818898; text-align:center; }
</style><link rel="stylesheet" href="scene-system.css"></head>
<body class="motion-ready scene09">
<div class="frame">
  <div class="statusbar">
    <span>9:41</span>
    <div class="statusicons">
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="wifi"></div>
      <div class="battery"></div>
    </div>
  </div>

  <div class="header">
    <div class="eyebrow">Discover</div>
    <h1>Camps &amp; Teams</h1>
  </div>

  <div class="cardwrap">
    <div class="card">
      <div class="banner">🏕️</div>
      <div class="cardbody">
        <div class="cardtitle">Camp Rio — Session 2</div>
        <div class="cardmeta">📅 Jul 14–18 · 9am–3pm</div>
        <div class="friendsrow">
          <div class="stack">
            <div class="a liam"></div>
            <div class="a init l">L</div>
            <div class="a init n">+1</div>
          </div>
          <div class="friendstext"><b>Mason, Lily</b> +1 more are going</div>
        </div>
        <div class="rsvpbtn">RSVP</div>
      </div>
    </div>
  </div>
  <div class="footnote">See which camps and sports teams your kids' friends are signing up for.</div>
</div>
</body></html>
