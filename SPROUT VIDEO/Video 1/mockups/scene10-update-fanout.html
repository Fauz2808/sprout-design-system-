<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#c9c4b6; display:flex; justify-content:center; align-items:center; padding:60px; font-family:'Inter',sans-serif; }
  .frame { width:393px; height:852px; background:#f4f1ea; border-radius:52px; overflow:hidden; position:relative; box-shadow:0 40px 80px rgba(0,0,0,0.35); }
  .statusbar { height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 32px; font-weight:600; font-size:15px; color:#2a2e25; }
  .statusicons { display:flex; align-items:center; gap:5px; }
  .signal { display:flex; gap:2px; align-items:flex-end; }
  .signal span { width:3px; background:#2a2e25; border-radius:1px; }
  .signal span:nth-child(1){height:4px;} .signal span:nth-child(2){height:6px;} .signal span:nth-child(3){height:8px;} .signal span:nth-child(4){height:10px;}
  .wifi { width:15px; height:11px; border:2px solid #2a2e25; border-radius:50% 50% 0 0 / 100% 100% 0 0; border-bottom:none; }
  .battery { width:24px; height:12px; border:1.4px solid #2a2e25; border-radius:3px; position:relative; }
  .battery::after { content:''; position:absolute; right:-3px; top:3px; width:2px; height:6px; background:#2a2e25; border-radius:0 1px 1px 0; }
  .battery::before { content:''; position:absolute; top:1.5px; left:1.5px; bottom:1.5px; width:16px; background:#2a2e25; border-radius:1.5px; }

  .header { padding:8px 24px 16px; text-align:center; }
  .header .name { font-weight:700; font-size:15px; color:#2a2e25; }
  .header .sub { font-size:12.5px; color:#818898; }

  .composer { padding:0 20px; }
  .senderrow { display:flex; align-items:center; gap:10px; justify-content:flex-end; margin-bottom:8px; }
  .sendername { font-size:13px; color:#818898; font-weight:600; }
  .avatar { border-radius:50%; background-repeat:no-repeat; flex-shrink:0; }
  .mike { width:44px; height:44px; background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:442.5px 241.4px; background-position:-113.1px -140.8px; border:2px solid #fff; box-shadow:0 0 0 2px #d0dacf; }

  .sentbubble { background:#186338; color:#f4f1ea; font-size:16px; font-weight:500; line-height:1.4; padding:12px 16px; border-radius:18px 18px 4px 18px; margin-left:60px; box-shadow:0 6px 16px rgba(15,34,24,0.15); }
  .senttime { text-align:right; font-size:12px; color:#a7ad9f; margin-top:5px; margin-right:2px; }

  .divider { margin:26px 24px 16px; display:flex; align-items:center; gap:10px; }
  .divider .line { flex:1; height:1px; background:#d0dacf; }
  .divider .label { font-size:12.5px; color:#186338; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }

  .deliveredcard { margin:0 20px; background:#ffffff; border-radius:20px; padding:18px; box-shadow:0 8px 24px rgba(15,34,24,0.06); }
  .deliveredtitle { font-size:15.5px; font-weight:700; color:#2a2e25; display:flex; align-items:center; gap:8px; }
  .deliveredtitle .check { color:#186338; }
  .recipientrow { display:flex; margin-top:14px; }
  .recipientrow .r { width:36px; height:36px; border-radius:50%; margin-left:-9px; border:2.5px solid #fff; background:#dfe2e6; position:relative; background-repeat:no-repeat; }
  .recipientrow .r:first-child { margin-left:0; }
  .recipientrow .r::after { content:'✓'; position:absolute; bottom:-2px; right:-2px; width:15px; height:15px; background:#186338; color:#fff; font-size:9px; font-weight:700; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center; }
  .r.emma { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:168.96px 92.16px; background-position:-43.92px -6px; }
  .r.david { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:422.4px 230.4px; background-position:-381px -180px; }
  .r.sarah { background-image:url("../../Generated_Image_July_30,_2026_202607312032 (2).jpeg"); background-size:362.1px 197.3px; background-position:-28.3px -115.2px; }
  .r.more { display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#186338; background:#e2e9e3; }
  .recipientlabel { margin-top:12px; font-size:13.5px; color:#818898; }
</style><link rel="stylesheet" href="scene-system.css"></head>
<body class="motion-ready scene10">
<div class="frame">
  <div class="statusbar">
    <span>9:41</span>
    <div class="statusicons">
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="wifi"></div>
      <div class="battery"></div>
    </div>
  </div>

  <div class="header"><div class="name">Little Shots ⚽</div><div class="sub">12 parents</div></div>

  <div class="composer">
    <div class="senderrow"><span class="sendername">Mike · Team Treasurer</span><div class="avatar mike"></div></div>
    <div class="sentbubble">📌 Practice moved to 5:30pm Thursday — same field.</div>
    <div class="senttime">Sent 8:12 AM</div>
  </div>

  <div class="divider"><div class="line"></div><div class="label">Delivered</div><div class="line"></div></div>

  <div class="deliveredcard">
    <div class="deliveredtitle"><span class="check">✓</span> Everyone in Little Shots received this</div>
    <div class="recipientrow">
      <div class="r emma"></div>
      <div class="r david"></div>
      <div class="r sarah"></div>
      <div class="r more">+9</div>
    </div>
    <div class="recipientlabel">One organized parent updates the group — everyone benefits.</div>
  </div>
</div>
</body></html>
