<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cut review · cut-test</title>
<style>
@font-face{font-family:Inter;src:url('../assets/fonts/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Playfair;src:url('../assets/fonts/playfair-display-latin-wght-normal.woff2') format('woff2');font-weight:400 900;font-display:swap}
:root{--paper:#f4f1ea;--shade:#eae6db;--deep:#dbd5c8;--ink:#1e3e2b;--green:#186338;--sage:#e2e9e3;--mint:#d0dacf;--text:#4d525b;--muted:#818898;--white:#fefefd;
--filler:#e9dbd5;--repeat:#e2e9e3;--retake:#f7dada;--hand:#dbd5c8;--retake-ink:#802929}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--paper);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.display{font-family:Playfair,Georgia,serif;letter-spacing:-.02em;color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--deep)}
.bar{max-width:1440px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar h1{font-size:26px;font-weight:500}
.meta{color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{font-family:Playfair,Georgia,serif;font-size:15px;font-weight:500;padding:9px 16px;border-radius:999px;border:1px solid var(--ink);color:var(--ink)}
.btn:hover{background:var(--shade)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--green)}
.stats{max-width:1440px;margin:0 auto;padding:0 24px 12px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
main{max-width:1440px;margin:0 auto;padding:20px 24px 80px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.paras{display:flex;flex-direction:column;gap:10px}
.para{background:var(--white);border:1px solid var(--mint);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:56px 1fr;gap:12px}
.para.playing{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.time{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.play{width:32px;height:32px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.play:hover{background:var(--mint)}
.play svg{width:13px;height:13px}
.text{font-size:17px;line-height:1.9;color:var(--ink)}
.w{padding:1px 2px;border-radius:4px;margin:0 -1px}
.w:hover{background:var(--shade)}
.w.low{text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.w.off{text-decoration:line-through;color:var(--muted)}
.w.off.filler{background:var(--filler)}.w.off.repeat{background:var(--repeat)}.w.off.retake{background:var(--retake);color:var(--retake-ink)}.w.off.hand{background:var(--hand)}
.w.now{box-shadow:inset 0 -3px 0 var(--green)}
.pause{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--green);background:var(--sage);border-radius:999px;padding:0 8px;margin:0 4px;vertical-align:2px;line-height:20px}
.group{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--retake-ink);margin-bottom:4px}
.group button{text-decoration:underline;text-underline-offset:3px}
aside{position:sticky;top:120px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--white);border:1px solid var(--mint);border-radius:14px;padding:14px}
video{display:block;height:min(52vh,560px);aspect-ratio:9/16;margin:0 auto;border-radius:10px;background:#101311;object-fit:cover}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){main{grid-template-columns:1fr}aside{position:static;order:-1}}
</style>
</head>
<body>
<header>
 <div class="bar">
  <h1 class="display">Cut review</h1>
  <div class="meta" id="meta"></div>
  <div class="spacer"></div>
  <button class="btn" id="playcut">Play the cut</button>
  <button class="btn" id="reset">Back to proposals</button>
  <button class="btn" id="copy">Copy JSON</button>
  <button class="btn primary" id="save">Save edl.json</button>
 </div>
 <div class="stats" id="stats"></div>
</header>
<main>
 <section>
  <p class="hint">Struck words are cut. Click any word to keep or cut it. Green chips are pauses and the length they will be shortened to. Dotted words are ones the transcript was unsure of: listen before trusting them.</p>
  <div class="paras" id="paras"></div>
 </section>
 <aside>
  <div class="card"><video id="video" src="../assets/raw.mp4" preload="auto" playsinline controls></video></div>
  <div class="card legend">
   <span><i class="dot" style="background:var(--retake)"></i>Earlier take of a line said again</span>
   <span><i class="dot" style="background:var(--filler)"></i>Filler (um, uh)</span>
   <span><i class="dot" style="background:var(--repeat)"></i>Doubled small word</span>
   <span><i class="dot" style="background:var(--hand)"></i>Cut by hand</span>
  </div>
 </aside>
</main>
<div class="toast" id="toast"></div>

const S = EDL.settings;
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const KEY = 'sprout-cut:' + EDL.raw + ':' + EDL.words.length;

let W = EDL.words;

const fmt = t => { const m = Math.floor(t / 60), s = (t - m * 60).toFixed(1); return m + ':' + (s < 10 ? '0' : '') + s; };

// the same rule as cut.py segments(), without the audio snapping: good enough to preview
function spans(){

    if (!w.keep){ if (cur){ out.push(cur); cur = null; } return; }
    if (cur && w.start - W[cur.i1].end > S.max_pause){ out.push(cur); cur = null; }
    if (!cur) cur = {i0: i, i1: i}; else cur.i1 = i;

$('#save').onclick = async () => {
  const text = output();
  if (window.showSaveFilePicker){ try { const h = await showSaveFilePicker({suggestedName: 'edl.json', types: [{description: 'Edit list', accept: {'application/json': ['.json']}}]}); const f = await h.createWritable(); await f.write(text); await f.close(); toast('Saved ' + h.name + ': now run cut.py apply'); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'})); a.download = 'edl.json'; a.click(); toast('Downloaded edl.json: move it into the cut folder');
};
$('#copy').onclick = async () => { try { await navigator.clipboard.writeText(output()); toast('Edit list copied'); } catch (e) { toast('Copy blocked by the browser'); } };
$('#reset').onclick = () => { W.forEach((w, i) => { w.keep = PROPOSED[i].keep; w.reason = PROPOSED[i].reason; }); commit(); toast('Back to the proposals'); };
render();
window.__edl = () => JSON.parse(output());
</script>
</body>
</html>
