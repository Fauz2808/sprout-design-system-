<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprout – 7.3.1 Activities This Week Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:#b8b0a0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:52px 0 80px; font-family:'Inter',sans-serif; }
    :root {
      --brand-500:#186338; --brand-700:#1e3e2b; --brand-50:#e2e9e3; --brand-100:#d0dacf;
      --bg:#f4f1ea; --surf-1:#eae6db; --surf-2:#dbd5c8; --surf-3:#c2b9a6;
      --text-primary:#4d525b; --text-secondary:#818898; --text-tertiary:#b3b8c1;
      --text-brand:#186338; --text-brand-bold:#1e3e2b; --border:#e6e7ea;
    }
    .phone { width:393px; height:852px; background:var(--bg); border-radius:54px; overflow:hidden; position:relative; display:flex; flex-direction:column; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 0 0 10px #1c1c1e,0 0 0 12px #2c2c2e,0 50px 100px rgba(0,0,0,.48); }
    .phone::before { content:''; position:absolute; left:-13px; top:120px; width:4px; height:32px; background:#2a2a2a; border-radius:2px 0 0 2px; box-shadow:0 44px 0 #2a2a2a,0 88px 0 #2a2a2a; }
    .phone::after  { content:''; position:absolute; right:-13px; top:148px; width:4px; height:66px; background:#2a2a2a; border-radius:0 2px 2px 0; }
    .island { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#0a0a0a; border-radius:18px; z-index:100; }

    .status-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 26px 0; height:52px; flex-shrink:0; }
    .s-time { font-size:15px; font-weight:600; color:var(--text-primary); }
    .s-icons { display:flex; align-items:center; gap:6px; }

    .top-header { display:flex; align-items:center; justify-content:space-between; padding:10px 20px 0; flex-shrink:0; }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--surf-2); overflow:hidden; position:relative; }
    .avatar::before { content:''; position:absolute; top:22%; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%; background:var(--surf-3); }
    .avatar::after  { content:''; position:absolute; bottom:-3px; left:50%; transform:translateX(-50%); width:30px; height:20px; border-radius:50% 50% 0 0; background:var(--surf-3); }
    .home-title { display:flex; align-items:center; gap:4px; font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--text-brand-bold); }
    .bell-btn { width:36px; height:36px; border-radius:50%; background:var(--surf-1); display:flex; align-items:center; justify-content:center; }

    .search-bar { margin:10px 20px 0; height:40px; border-radius:99px; background:var(--surf-1); display:flex; align-items:center; gap:8px; padding:0 14px; flex-shrink:0; }
    .search-bar span { font-size:13.5px; color:var(--text-tertiary); }

    /* Day row */
    .day-strip { display:flex; gap:4px; padding:12px 20px 0; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
    .day-strip::-webkit-scrollbar { display:none; }
    .day-cell { display:flex; flex-direction:column; align-items:center; gap:3px; min-width:38px; }
    .day-label { font-size:9px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; }
    .day-num { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; color:var(--text-secondary); }
    .day-cell.active .day-num { background:var(--brand-500); color:#fff; font-weight:700; }
    .day-cell.active .day-label { color:var(--text-brand); }

    .section-row { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 0; flex-shrink:0; }
    .section-name { font-size:14px; font-weight:600; color:var(--text-primary); }

    .empty-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 36px 80px; text-align:center; }
    .empty-icon { width:88px; height:88px; border-radius:26px; background:var(--brand-50); display:flex; align-items:center; justify-content:center; margin-bottom:20px; animation:float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .empty-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--text-brand-bold); margin-bottom:10px; }
    .empty-body { font-size:13.5px; color:var(--text-secondary); line-height:1.6; max-width:240px; margin-bottom:28px; }
    .cta-btn { display:inline-flex; align-items:center; gap:7px; height:48px; padding:0 28px; border-radius:99px; background:var(--brand-500); color:#fff; font-size:15px; font-weight:600; border:none; cursor:pointer; }

    .bottom-nav { position:absolute; bottom:0; left:0; right:0; height:82px; background:var(--bg); border-top:1px solid var(--border); display:flex; align-items:flex-start; padding-top:10px; }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
    .nav-label { font-size:9.5px; font-weight:500; color:var(--text-tertiary); }
    .nav-item.active .nav-label { color:var(--brand-500); }
  </style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="status-bar">
    <span class="s-time">9:41</span>
    <div class="s-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#4d525b"/><rect x="4.5" y="5" width="3" height="7" rx=".6" fill="#4d525b"/><rect x="9" y="2.5" width="3" height="9.5" rx=".6" fill="#4d525b"/><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#4d525b" opacity=".35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><circle cx="8" cy="10.5" r="1.3" fill="#4d525b"/><path d="M4.5 7C5.8 5.7 6.9 5 8 5s2.2.7 3.5 2" stroke="#4d525b" stroke-width="1.3" stroke-linecap="round" fill="none"/><path d="M1.5 4C3.5 2 5.6.8 8 .8s4.5 1.2 6.5 3.2" stroke="#4d525b" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#4d525b" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#4d525b"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="#4d525b" fill-opacity=".4"/></svg>
    </div>
  </div>

  <div class="top-header">
    <div class="avatar"></div>
    <div class="home-title">Home <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="#1e3e2b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="bell-btn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a5 5 0 0 0-5 5v3l-1.5 2.5h13L14 10V7a5 5 0 0 0-5-5Z" stroke="#4d525b" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 14.5a1.5 1.5 0 0 0 3 0" stroke="#4d525b" stroke-width="1.4"/></svg></div>
  </div>

  <div class="search-bar">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="#b3b8c1" stroke-width="1.4"/><path d="M10 10l3 3" stroke="#b3b8c1" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span>Search</span>
  </div>

  <!-- Day strip -->
  <div class="day-strip">
    <div class="day-cell active"><span class="day-label">MON</span><div class="day-num">2</div></div>
    <div class="day-cell"><span class="day-label">TUE</span><div class="day-num">3</div></div>
    <div class="day-cell"><span class="day-label">WED</span><div class="day-num">4</div></div>
    <div class="day-cell"><span class="day-label">THU</span><div class="day-num">5</div></div>
    <div class="day-cell"><span class="day-label">FRI</span><div class="day-num">6</div></div>
    <div class="day-cell"><span class="day-label">SAT</span><div class="day-num">7</div></div>
    <div class="day-cell"><span class="day-label">SUN</span><div class="day-num">8</div></div>
  </div>

  <div class="section-row">
    <span class="section-name">Activities this week</span>
  </div>

  <div class="empty-wrap">
    <div class="empty-icon">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none">
        <!-- Sun -->
        <circle cx="23" cy="20" r="8" fill="#186338" opacity=".2"/>
        <circle cx="23" cy="20" r="5" fill="#186338" opacity=".5"/>
        <line x1="23" y1="7" x2="23" y2="10" stroke="#186338" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="23" y1="30" x2="23" y2="33" stroke="#186338" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="10" y1="20" x2="13" y2="20" stroke="#186338" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="33" y1="20" x2="36" y2="20" stroke="#186338" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Ground / sprout -->
        <path d="M15 38 C15 34 19 32 23 33 C19 33 15 35 15 38Z" fill="#77b691"/>
        <path d="M31 38 C31 34 27 32 23 33 C27 33 31 35 31 38Z" fill="#77b691"/>
        <line x1="23" y1="33" x2="23" y2="38" stroke="#77b691" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="12" y1="39" x2="34" y2="39" stroke="#d0dacf" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="empty-title">Quiet week ahead</div>
    <div class="empty-body">No activities scheduled nearby this week. Why not plan something?</div>
    <button class="cta-btn">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1v13M1 7.5h13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      Create an Event
    </button>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active"><svg width="23" height="23" viewBox="0 0 23 23" fill="none"><rect x="2.5" y="4.5" width="18" height="16" rx="3" stroke="#186338" stroke-width="1.5"/><path d="M7.5 2.5v3M15.5 2.5v3M2.5 9.5h18" stroke="#186338" stroke-width="1.5" stroke-linecap="round"/></svg><span class="nav-label" style="color:#186338">Events</span></div>
    <div class="nav-item"><svg width="23" height="23" viewBox="0 0 23 23" fill="none"><rect x="2.5" y="4.5" width="18" height="14" rx="3" stroke="#b3b8c1" stroke-width="1.5"/><circle cx="8.5" cy="10" r="2" stroke="#b3b8c1" stroke-width="1.5"/><path d="M2.5 15.5l5-4.5 4 3 3-2.5 6.5 5" stroke="#b3b8c1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-label">Memories</span></div>
    <div class="nav-item"><svg width="23" height="23" viewBox="0 0 23 23" fill="none"><path d="M11.5 2L13.4 8.6H20.3L14.9 12.6L16.8 19.2L11.5 15.2L6.2 19.2L8.1 12.6L2.7 8.6H9.6Z" stroke="#b3b8c1" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="nav-label">AI Assist</span></div>
    <div class="nav-item"><svg width="23" height="23" viewBox="0 0 23 23" fill="none"><path d="M4 3.5h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7.5l-5.5 4V5.5a2 2 0 0 1 2-2Z" stroke="#b3b8c1" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="nav-label">Chat</span></div>
    <div class="nav-item"><svg width="23" height="23" viewBox="0 0 23 23" fill="none"><circle cx="8.5" cy="8" r="4" stroke="#b3b8c1" stroke-width="1.5"/><circle cx="14.5" cy="8" r="4" stroke="#b3b8c1" stroke-width="1.5"/><path d="M2 20c0-3.59 2.91-6.5 6.5-6.5S15 16.41 15 20" stroke="#b3b8c1" stroke-width="1.5" stroke-linecap="round"/><path d="M9 20c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5" stroke="#b3b8c1" stroke-width="1.5" stroke-linecap="round"/></svg><span class="nav-label">Clubs</span></div>
  </div>
</div>
</body>
</html>
