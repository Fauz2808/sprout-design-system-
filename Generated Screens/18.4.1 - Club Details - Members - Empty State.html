<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprout – 18.4.1 Club Details Members Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:#b8b0a0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:52px 0 80px; font-family:'Inter',sans-serif; }
    :root {
      --brand-500:#186338; --brand-700:#1e3e2b; --brand-50:#e2e9e3; --brand-100:#d0dacf;
      --bg:#f4f1ea; --surf-1:#eae6db; --surf-2:#dbd5c8; --surf-3:#c2b9a6;
      --text-primary:#4d525b; --text-secondary:#818898; --text-tertiary:#b3b8c1;
      --text-brand:#186338; --text-brand-bold:#1e3e2b; --border:#e6e7ea;
    }
    .phone { width:393px; height:852px; background:var(--bg); border-radius:54px; overflow:hidden; position:relative; display:flex; flex-direction:column; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 0 0 10px #1c1c1e,0 0 0 12px #2c2c2e,0 50px 100px rgba(0,0,0,.48); }
    .phone::before { content:''; position:absolute; left:-13px; top:120px; width:4px; height:32px; background:#2a2a2a; border-radius:2px 0 0 2px; box-shadow:0 44px 0 #2a2a2a,0 88px 0 #2a2a2a; }
    .phone::after  { content:''; position:absolute; right:-13px; top:148px; width:4px; height:66px; background:#2a2a2a; border-radius:0 2px 2px 0; }
    .island { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#0a0a0a; border-radius:18px; z-index:100; }

    .status-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 26px 0; height:52px; flex-shrink:0; }
    .s-time { font-size:15px; font-weight:600; color:var(--text-primary); }
    .s-icons { display:flex; align-items:center; gap:6px; }

    .top-nav { display:flex; align-items:center; padding:10px 20px 0; flex-shrink:0; }
    .back-btn { width:36px; height:36px; border-radius:50%; background:var(--surf-1); display:flex; align-items:center; justify-content:center; }
    .page-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--text-brand-bold); margin:0 auto; }

    .divider { height:1px; background:var(--border); margin:12px 20px 0; flex-shrink:0; }

    .empty-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 36px 40px; text-align:center; }
    .empty-icon { width:88px; height:88px; border-radius:26px; background:var(--brand-50); display:flex; align-items:center; justify-content:center; margin-bottom:20px; animation:float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .empty-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--text-brand-bold); margin-bottom:10px; }
    .empty-body { font-size:13.5px; color:var(--text-secondary); line-height:1.6; max-width:240px; margin-bottom:28px; }
    .cta-btn { display:inline-flex; align-items:center; gap:7px; height:48px; padding:0 28px; border-radius:99px; background:var(--brand-500); color:#fff; font-size:15px; font-weight:600; border:none; cursor:pointer; margin-bottom:14px; }
    .link-action { font-size:13px; color:var(--text-brand); font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  </style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="status-bar">
    <span class="s-time">9:41</span>
    <div class="s-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#4d525b"/><rect x="4.5" y="5" width="3" height="7" rx=".6" fill="#4d525b"/><rect x="9" y="2.5" width="3" height="9.5" rx=".6" fill="#4d525b"/><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#4d525b" opacity=".35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><circle cx="8" cy="10.5" r="1.3" fill="#4d525b"/><path d="M4.5 7C5.8 5.7 6.9 5 8 5s2.2.7 3.5 2" stroke="#4d525b" stroke-width="1.3" stroke-linecap="round" fill="none"/><path d="M1.5 4C3.5 2 5.6.8 8 .8s4.5 1.2 6.5 3.2" stroke="#4d525b" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#4d525b" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#4d525b"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="#4d525b" fill-opacity=".4"/></svg>
    </div>
  </div>

  <div class="top-nav">
    <div class="back-btn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 4L6 9l5 5" stroke="#4d525b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="page-title">Members</div>
    <div style="width:36px"></div>
  </div>

  <div class="divider"></div>

  <div class="empty-wrap">
    <div class="empty-icon">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
        <circle cx="17" cy="19" r="8" fill="#77b691"/>
        <path d="M5 42c0-6.63 5.37-12 12-12s12 5.37 12 42" fill="#77b691"/>
        <path d="M5 42c0-6.63 5.37-12 12-12s12 5.37 12 12" fill="#77b691"/>
        <circle cx="33" cy="19" r="8" fill="#186338"/>
        <path d="M21 42c0-6.63 5.37-12 12-12s12 5.37 12 12" fill="#186338"/>
        <!-- Plus badge -->
        <circle cx="38" cy="10" r="8" fill="var(--bg, #f4f1ea)" stroke="#186338" stroke-width="1.5"/>
        <path d="M38 6v8M34 10h8" stroke="#186338" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="empty-title">No members yet</div>
    <div class="empty-body">Invite parents to join this club and start building your community.</div>
    <button class="cta-btn">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1v13M1 7.5h13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      Invite Members
    </button>
    <span class="link-action">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M6 2H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9 1h4v4M8 6l5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Share invite link
    </span>
  </div>
</div>
</body>
</html>
